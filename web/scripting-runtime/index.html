<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jai playground</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <h1>Jai playground</h1>
  <p>Write Jai and run it in your browser.</p>
  <div class="workspace">
    <aside aria-label="Source workspace">
      <h2>Files</h2>
      <nav id="files" aria-label="Source files"></nav>
      <form id="new-file">
        <label for="file-name">New file</label>
        <input id="file-name" placeholder="helpers.jai" autocomplete="off" spellcheck="false" required>
        <button type="submit">Add file</button>
      </form>
      <button id="remove-file" type="button" disabled>Remove file</button>
    </aside>
    <section class="editor" aria-label="Source editor">
      <label for="source" id="selected-name">main.jai</label>
      <textarea id="source" spellcheck="false" autocapitalize="off">main :: () -> int {
    if #compile_time return 900;
    return 42;
}</textarea>
    </section>
  </div>
  <p class="hint">Runs start in main.jai. Use #load to include other files in this workspace.</p>
  <div class="actions">
    <button id="run" type="button">Run</button>
    <button id="cancel" type="button" disabled>Cancel</button>
    <span class="shortcut">Ctrl / ⌘ + Enter</span>
  </div>
  <details>
    <summary>Run options</summary>
    <div class="options">
      <div>
        <label for="arguments">Arguments (JSON array of strings)</label>
        <input id="arguments" value="[]" spellcheck="false">
      </div>
      <div>
        <label for="fuel">Execution step limit</label>
        <input id="fuel" type="number" min="0" max="4294967295" value="1000000">
      </div>
    </div>
  </details>
  <pre id="result" role="status" aria-live="polite">Ready.</pre>
  <p class="hint">Experimental compiler. Source files stay in this browser session. Program I/O and native libraries need host support.</p>
  <script type="module" src="./editor.mjs"></script>
</body>
</html>
