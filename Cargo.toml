[workspace]
resolver = "3"
members = [
    "crates/jai-wasm",
    "crates/jai-language-server",
    "crates/jaic",
    "crates/jaic-llvm",
    "crates/jaic-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[workspace.dependencies]
jai-language-server = { path = "crates/jai-language-server" }
inkwell = { version = "0.10.0", default-features = false, features = ["llvm22-1"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

# Release speed with line tables, for profilers (`samply`); see docs/tools/benchmarks.md.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
split-debuginfo = "packed"

[profile.rust-debug]
inherits = "dev"
debug = 2
