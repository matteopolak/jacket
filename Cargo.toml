[workspace]
resolver = "3"
exclude = ["fuzz"]
members = [
    "crates/jai-source",
    "crates/jai-native-source",
    "crates/jai-platform",
    "crates/jai-types",
    "crates/jai-ir",
    "crates/jai-vm",
    "crates/jai-lexer",
    "crates/jai-syntax",
    "crates/jai-modules",
    "crates/jai-eval",
    "crates/jai-sema",
    "crates/jai-codegen",
    "crates/jai-llvm",
    "crates/jai-driver",
    "crates/jai-cli",
    "crates/jai-bench",
    "crates/jai-runtime",
    "crates/jai-wasm",
    "crates/jai-language-server",
    "crates/jaic",
    "crates/jaic-llvm",
    "crates/jaic-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[workspace.dependencies]
jai-language-server = { path = "crates/jai-language-server" }
jai-modules = { path = "crates/jai-modules" }
jai-driver = { path = "crates/jai-driver" }
jai-source = { path = "crates/jai-source" }
jai-native-source = { path = "crates/jai-native-source" }
jai-platform = { path = "crates/jai-platform" }
jai-types = { path = "crates/jai-types" }
jai-ir = { path = "crates/jai-ir" }
jai-vm = { path = "crates/jai-vm" }
jai-lexer = { path = "crates/jai-lexer" }
jai-syntax = { path = "crates/jai-syntax" }
jai-eval = { path = "crates/jai-eval" }
jai-sema = { path = "crates/jai-sema" }
jai-codegen = { path = "crates/jai-codegen" }
jai-llvm = { path = "crates/jai-llvm" }
jai-runtime = { path = "crates/jai-runtime" }
divan = "0.1.21"
sha2 = { version = "0.11", default-features = false }
inkwell = { version = "0.10.0", default-features = false, features = ["llvm22-1-prefer-dynamic"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[profile.rust-debug]
inherits = "dev"
debug = 2
