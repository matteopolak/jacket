[workspace]
resolver = "3"
members = [
    "crates/jai-wasm",
    "crates/jai-language-server",
    "crates/jaic",
    "crates/jaic-llvm",
    "crates/jaic-cli",
    "crates/jailint",
]
# cargo-fuzz targets: their own workspace and lock file (docs/tools/fuzzing.md).
exclude = ["fuzz"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
license = "AGPL-3.0-or-later"
repository = "https://github.com/matteopolak/jai"

[workspace.dependencies]
jai-language-server = { path = "crates/jai-language-server" }
# LLVM 23 support is on inkwell's main branch but in no crates.io release yet (0.10.0 stops at
# LLVM 22). Pinned to a commit at least 14 days old, which `tools/check_dependency_age.py`
# verifies; switch back to a registry version once one with `llvm23-1` is 14 days old.
inkwell = { git = "https://github.com/TheDan64/inkwell", rev = "b7cbeed24af810e14cb36d703f057167b4c033a4", default-features = false, features = ["llvm23-1"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

# Release speed with line tables, for profilers (`samply`); see docs/tools/benchmarks.md.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
split-debuginfo = "packed"

[profile.rust-debug]
inherits = "dev"
debug = 2
