# How `jacket doc` groups the library's modules. Every module (and every `Extensions/` module)
# belongs to exactly one category; `jacket doc --check` fails on a module that is missing here,
# listed twice, or a name that matches no module. Categories show up in this order.

[[category]]
name = "Core"
modules = [
    "Basic", "Runtime_Support", "Runtime_Support_Crash_Handler", "Remap_Context", "Reflection",
    "Soa", "Relative_Pointers", "Deep_Copy", "Extensions/Variant",
]

[[category]]
name = "Math and numbers"
modules = [
    "Math", "Sloppy_Math", "Float16", "Random", "PCG", "Bit_Operations", "SIMD", "Srgb",
    "Color_Interpolation", "Extensions/SIMD", "Extensions/Long_Double",
]

[[category]]
name = "Memory and allocators"
modules = [
    "Memory", "Default_Allocator", "Flat_Pool", "Pool", "Overwriting_Allocator",
    "Unmapping_Allocator", "rpmalloc",
]

[[category]]
name = "Data structures and sorting"
modules = [
    "Bit_Array", "Bucket_Array", "Hash_Table", "Xar", "Sort", "IntroSort", "RadixSort",
    "Extensions/Hash_Map",
]

[[category]]
name = "Text and formats"
modules = [
    "String", "Unicode", "Base64", "Print_Color", "Text_File_Handler", "Subtitles",
    "Extensions/Json", "Extensions/Regex", "Extensions/Jai_Format", "Extensions/Text_Buffer",
    "Extensions/Byte_Search", "Extensions/String_Literal",
]

[[category]]
