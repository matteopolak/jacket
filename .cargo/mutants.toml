# cargo-mutants settings (docs/tools/mutation-testing.md). Mutants are only made in the files the
# workflow or the command line names with --file; this file removes the ones that cannot matter.
# The tests each mutant runs come from the workflow (.github/workflows/mutants.yml), after `--`.
# Panics, diagnostics text and Debug/Display impls are covered by their own tests, and mutating them
# only reports that a message changed.
exclude_re = [
    "impl (Debug|Display) for",
    "impl fmt::(Debug|Display) for",
    "::fmt$",
    # Rotation joins two shifted halves whose bits never overlap, so `|` and `^` give one result.
    "replace \\| with \\^ in rotate_left",
    # emit_cast_check: a type-only context (`type_of(...)`) never runs the code it lowers, so checking
    # there changes nothing; a target that covers the whole source range (`tmin <= smin && smax <=
    # tmax`) cannot happen once the target is narrower.
    "casts\\.rs:34:13: replace \\|\\| with && in Compiler::emit_cast_check",
    "casts\\.rs:\\d+:\\d+: replace <= with > in Compiler::emit_cast_check",
    # fold_cast is an optimisation: a cast it leaves alone is converted by the interpreter or the
    # code generator to the same value, and the folds that matter are also done by the checker's
    # constant evaluation first.
    "in Compiler::fold_cast",
    # The remaining casts.rs survivors, each unobservable from a program:
    #   62, 67  a bound that is equal for an unsigned source and target adds a redundant comparison;
    #   85, 95  the widened value and the size code only fill the run-time failure report;
    #   125     an enum target is exempt from the range check whether or not its representation is one;
    #   217     `cast(Type) T` builds the same type value either way;
    #   380     a string constant of the wrong element type or length is refused by the next branch.
    "casts\\.rs:(62:17|67:17|85:30|95:60|125:13|217:19|380:37):",
]
# A test run that takes longer than this multiple of the unmutated run is a hang the mutant caused.
minimum_test_timeout = 60
