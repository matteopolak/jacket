# Thresholds for the workspace lints in the root `Cargo.toml` (`[workspace.lints.clippy]`).
# `excessive_nesting` fires on blocks nested deeper than this. See docs/tools/development.md.
excessive-nesting-threshold = 7
cognitive-complexity-threshold = 40
# A ratchet: set just above the longest function left after the splits.
# Lower it as the remaining long dispatch functions are split.
too-many-lines-threshold = 250

# Environment variables are declared in `jacket_config::env`, the one module that may read them, so a
# misspelt name cannot silently do nothing and the reference page lists every one.
disallowed-methods = [
    { path = "std::env::var", reason = "declare the variable in `jacket_config::env` and read it through its constant" },
    { path = "std::env::var_os", reason = "declare the variable in `jacket_config::env` and read it through its constant" },
    { path = "std::env::vars", reason = "read the declared variables in `jacket_config::env` one by one" },
    { path = "u16::from_le_bytes", reason = "read and write program data through `jaic::layout::DataLayout`, which respects the target's width and byte order; host-only code adds an `#[allow]` with a reason" },
    { path = "u16::from_ne_bytes", reason = "read and write program data through `jaic::layout::DataLayout`, which respects the target's width and byte order; host-only code adds an `#[allow]` with a reason" },
    { path = "u16::to_le_bytes", reason = "read and write program data through `jaic::layout::DataLayout`, which respects the target's width and byte order; host-only code adds an `#[allow]` with a reason" },
    { path = "u16::to_ne_bytes", reason = "read and write program data through `jaic::layout::DataLayout`, which respects the target's width and byte order; host-only code adds an `#[allow]` with a reason" },
    { path = "u32::from_le_bytes", reason = "read and write program data through `jaic::layout::DataLayout`, which respects the target's width and byte order; host-only code adds an `#[allow]` with a reason" },
    { path = "u32::from_ne_bytes", reason = "read and write program data through `jaic::layout::DataLayout`, which respects the target's width and byte order; host-only code adds an `#[allow]` with a reason" },
    { path = "u32::to_le_bytes", reason = "read and write program data through `jaic::layout::DataLayout`, which respects the target's width and byte order; host-only code adds an `#[allow]` with a reason" },
    { path = "u32::to_ne_bytes", reason = "read and write program data through `jaic::layout::DataLayout`, which respects the target's width and byte order; host-only code adds an `#[allow]` with a reason" },
    { path = "u64::from_le_bytes", reason = "read and write program data through `jaic::layout::DataLayout`, which respects the target's width and byte order; host-only code adds an `#[allow]` with a reason" },
    { path = "u64::from_ne_bytes", reason = "read and write program data through `jaic::layout::DataLayout`, which respects the target's width and byte order; host-only code adds an `#[allow]` with a reason" },
    { path = "u64::to_le_bytes", reason = "read and write program data through `jaic::layout::DataLayout`, which respects the target's width and byte order; host-only code adds an `#[allow]` with a reason" },
    { path = "u64::to_ne_bytes", reason = "read and write program data through `jaic::layout::DataLayout`, which respects the target's width and byte order; host-only code adds an `#[allow]` with a reason" },
    { path = "std::env::vars_os", reason = "read the declared variables in `jacket_config::env` one by one" },
]

disallowed-types = [
    { path = "std::collections::HashMap", reason = "use `jaic::fxhash::HashMap` (Fx hasher; the default SipHash is slow for compiler workloads)" },
    { path = "std::collections::HashSet", reason = "use `jaic::fxhash::HashSet` (Fx hasher; the default SipHash is slow for compiler workloads)" },
    { path = "std::collections::LinkedList", reason = "use `Vec` or `VecDeque`; a linked list is cache-hostile and nothing here needs O(1) splicing" },
]
