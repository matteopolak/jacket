[package]
name = "regex-bench"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"

# A separate crate: not part of the jaic workspace.
[workspace]

[dependencies]
regex = "1.13"
regex-automata = { version = "0.4.18", default-features = false, features = ["std", "dfa-search"] }

[build-dependencies]
regex-automata = { version = "0.4.18", default-features = false, features = ["std", "syntax", "unicode", "dfa-build", "dfa-search"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
