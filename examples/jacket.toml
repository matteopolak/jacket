# Settings shared by every example workspace under examples/. jaifmt, jailint and jacket find the
# nearest jacket.toml above a file, so a workspace here needs none of its own. The browser bundle
# copies this file into each bundled workspace (tools/browser/build_scripting_wasm.py), which is
# the configuration the playground's formatter reads.

[format]
indent-width = 4
max-width = 100
max-blank-lines = 1
brace-style = "same_line"
blank-line-after-declarations = true
blank-lines-around-blocks = true
blank-line-after-guards = true
blank-line-before-return = true

# Examples in doc comments are short; the extra blank lines make them airy.
[doc.format]
blank-line-after-declarations = false
blank-lines-around-blocks = false
blank-line-after-guards = false
blank-line-before-return = false

[lint]
max-complexity = 100

[lint.rules]
shadowed_local = "warn"
lossy_xx = "warn"
neg_cmp_float = "warn"
large_stack_array = "warn"
todo_marker = "warn"
detached_doc_comment = "warn"
incomplete_enum_switch = "warn"
temp_storage_escape = "warn"
excessive_nesting = "warn"
leaked_allocation = "warn"
cognitive_complexity = "warn"

# Examples with a `tests/` folder of their own, for `jacket test` run here. Run inside one, it tests just that example.
[test]
paths = ["kvdb", "sitegen", "seek", "editor", "chat", "chip8", "imageview", "music", "term", "traceview"]
