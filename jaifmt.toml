# jaifmt settings for this repository; see docs/tools/jaifmt.md.
indent_width = 4
max_width = 100
max_blank_lines = 2
brace_style = "same_line"

# tests/corpus: fixtures pinned by sha256 in tests/corpus/manifest.json, and negative cases
# that are deliberately malformed. tools/jaifmt/tests: golden inputs that must stay unformatted.
ignore = ["tests/corpus/**", "tools/jaifmt/tests/**"]
