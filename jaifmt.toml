# jaifmt settings for this repository; see docs/tools/jaifmt.md.
indent_width = 4
max_width = 100
max_blank_lines = 1
brace_style = "same_line"
# Stricter, opt-in spacing inside code blocks (see docs/tools/jaifmt.md).
blank_line_after_declarations = true # after a run of declarations
blank_lines_around_blocks = true # around statements with a block body
blank_line_after_guards = true # after a run of one-line if/for/while
blank_line_before_return = true # above a return in a longer body

# Every Jai file the repository owns is formatted, except:
# - tests/corpus: fixtures pinned by sha256 in tests/corpus/manifest.json, and negative cases
#   that are deliberately malformed.
# - stdlib/Extensions/Jai_Format/tests/cases: golden inputs, kept unformatted.
# - tests/native/debug-info: the debugger test sets breakpoints at fixed line numbers.
# - fuzz: seeds are fuzzer inputs (odd layout is the point, and the jaifmt target starts from
#   them) and regressions are byte-exact reproducers.
ignore = ["tests/corpus/**", "stdlib/Extensions/Jai_Format/tests/cases/**", "tests/native/debug-info/**", "fuzz/**"]
