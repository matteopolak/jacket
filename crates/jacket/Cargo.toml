[package]
name = "jacket"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The jacket command: one front door to the Jai compiler, linter, formatter and language server."

[[bin]]
name = "jacket"
path = "src/main.rs"

[dependencies]
jacket-config = { path = "../jacket-config" }
clap = { version = "=4.6.4", features = ["derive"] }
serde_json = "=1.0.151"
toml = "=1.1.2"
regex-lite = "=0.1.9"
semver = "=1.0.28"
sha2 = "=0.10.9"

[dev-dependencies]
test-support = { path = "../test-support" }

[lints]
workspace = true
