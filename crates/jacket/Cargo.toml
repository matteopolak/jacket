[package]
name = "jacket"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
documentation.workspace = true
description = "The jacket command: one front door to the Jai compiler, linter, formatter and language server."

[[bin]]
name = "jacket"
path = "src/main.rs"

[dependencies]
jailint = { path = "../jailint" }
jacket-config = { path = "../jacket-config" }
jaic = { path = "../jaic" }
jaic-cli-args = { path = "../jaic-cli-args" }
clap = { version = "=4.6.7", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
toml = "=1.2.1"
regex-lite = "=0.1.9"
semver = "=1.0.28"
pulldown-cmark = { workspace = true, features = ["html"] }
sha2 = "=0.11.1"
similar = { version = "=3.2.1", default-features = false, features = ["text"] }

[dev-dependencies]
test-support = { path = "../test-support" }

[lints]
workspace = true
