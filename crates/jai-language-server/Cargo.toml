[package]
name = "jai-language-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "jailsp"
path = "src/main.rs"

[dependencies]
jaic = { path = "../jaic" }
jailint = { path = "../jailint" }
jacket-config = { path = "../jacket-config" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[lints.rust]
# Only `large_alloc` (the executable's allocator) needs it.
unsafe_code = "deny"

[lints.clippy]
all = "warn"
excessive_nesting = "warn"
