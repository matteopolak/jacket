[package]
name = "jai-language-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
autotests = false

[[bin]]
name = "jailsp"
path = "src/main.rs"

[dependencies]
jaic = { path = "../jaic" }
jailint = { path = "../jailint", default-features = false }
jacket-config = { path = "../jacket-config" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[target.'cfg(windows)'.dependencies]
mimalloc = { version = "=0.1.52", default-features = false }
libmimalloc-sys = { version = "=0.1.49", default-features = false, features = ["extended"] }

[dev-dependencies]
test-support = { path = "../test-support", features = ["lsp"] }

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/main.rs"

[[test]]
name = "postgres_typed_queries"
path = "tests/postgres_typed_queries.rs"

[[test]]
name = "scale"
path = "tests/scale.rs"
