[package]
name = "jai-language-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "jailsp"
path = "src/main.rs"

[dependencies]
jaic = { path = "../jaic" }
jailint = { path = "../jailint", default-features = false }
jacket-config = { path = "../jacket-config" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["raw_value"] }
lsp-server = "=0.10.0"
crossbeam-channel = "=0.5.17"
lsp-types = "=0.97.0"

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
cpu-time = "=1.0.0"

[dev-dependencies]
test-support = { path = "../test-support", features = ["lsp"] }

[lints]
workspace = true
