[package]
name = "jailint"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Lints for Jai programs, run on jaic's type-checked program."
autotests = false

[[bin]]
name = "jailint"
path = "src/main.rs"
required-features = ["cli"]

[features]
# The command-line binary. The library (which the language server and its wasm build use) has
# no use for the option parser, so those depend on it with default features off.
default = ["cli"]
cli = ["dep:argdef", "dep:jaic-cli-args", "dep:mimalloc"]

[dependencies]
jaic = { path = "../jaic" }
jacket-config = { path = "../jacket-config" }
argdef = { path = "../argdef", optional = true }
jaic-cli-args = { path = "../jaic-cli-args", optional = true }
serde_json = "=1.0.154"
# The binary runs roots on several threads; the system allocator serialises them.
mimalloc = { version = "=0.1.52", optional = true, default-features = false }

[dev-dependencies]
test-support = { path = "../test-support" }

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/main.rs"
