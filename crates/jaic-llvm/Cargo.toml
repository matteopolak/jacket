[package]
name = "jaic-llvm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "LLVM backend for the jaic compiler core: lowers jaic IR to native object files."

[dependencies]
jaic = { path = "../jaic" }
inkwell.workspace = true

[features]
default = ["dynamic"]
# How LLVM is linked. Development builds use the shared library; release archives link the
# static libraries of an official LLVM release, so the binary runs without LLVM installed.
dynamic = ["inkwell/llvm23-1-prefer-dynamic"]
static = ["inkwell/llvm23-1-force-static"]

[dev-dependencies]
test-support = { path = "../test-support", features = ["backend"] }

[lints]
workspace = true
