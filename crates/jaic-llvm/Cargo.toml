[package]
name = "jaic-llvm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "LLVM backend for the jaic compiler core: lowers jaic IR to native object files."

[dependencies]
jaic = { path = "../jaic" }
inkwell.workspace = true

[lints.rust]
# Inkwell exposes GEP construction as `unsafe`; confined to one helper in `lower`.
unsafe_code = "deny"

[lints.clippy]
all = "warn"
