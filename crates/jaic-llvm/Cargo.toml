[package]
name = "jaic-llvm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "LLVM backend for the jaic compiler core: lowers jaic IR to native object files."

[dependencies]
jaic = { path = "../jaic" }
inkwell.workspace = true

[features]
default = ["dynamic"]
# How LLVM is linked. Development builds use the shared library; release archives link the
# static libraries of an official LLVM release, so the binary runs without LLVM installed.
dynamic = ["inkwell/llvm22-1-prefer-dynamic"]
static = ["inkwell/llvm22-1-force-static"]

[lints.rust]
# Inkwell exposes GEP construction as `unsafe`; confined to one helper in `lower`.
unsafe_code = "deny"

[lints.clippy]
all = "warn"
