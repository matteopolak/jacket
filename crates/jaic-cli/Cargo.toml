[package]
name = "jaic-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Command line driver for the jaic compiler core."

[[bin]]
name = "jaic"
path = "src/main.rs"

[dependencies]
jaic = { path = "../jaic" }
jaic-llvm = { path = "../jaic-llvm", optional = true, default-features = false }

[features]
default = ["dynamic-llvm"]
# Native output (`jaic build`); without it jaic only checks and interprets.
llvm = ["dep:jaic-llvm"]
# LLVM as a shared library (development) or statically linked (release archives).
dynamic-llvm = ["llvm", "jaic-llvm/dynamic"]
static-llvm = ["llvm", "jaic-llvm/static"]

[dev-dependencies]
serde_json = "=1.0.151"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[[test]]
name = "native"
required-features = ["llvm"]
