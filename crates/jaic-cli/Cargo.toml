[package]
name = "jaic-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Command line driver for the jaic compiler core."

[[bin]]
name = "jaic"
path = "src/main.rs"

[dependencies]
jaic = { path = "../jaic" }
jacket-config = { path = "../jacket-config" }
jaic-llvm = { path = "../jaic-llvm", optional = true, default-features = false }
mimalloc = { version = "=0.1.52", optional = true, default-features = false }

# On macOS also replace the C `malloc` family, so LLVM's C++ allocations (about a fifth of a
# build's user time through the system allocator) use mimalloc. Not on Linux: newer glibc frees
# its own allocations through the exported `free` during startup, and the crate cannot override
# on Windows (docs/compiler/compile-speed.md#allocator).
[target.'cfg(target_os = "macos")'.dependencies]
mimalloc = { version = "=0.1.52", optional = true, default-features = false, features = ["override"] }

[features]
default = ["dynamic-llvm", "mimalloc"]
# Native output (`jaic`); without it jaic only checks and interprets.
llvm = ["dep:jaic-llvm"]
# LLVM as a shared library (development) or statically linked (release archives).
dynamic-llvm = ["llvm", "jaic-llvm/dynamic"]
static-llvm = ["llvm", "jaic-llvm/static", "mimalloc"]
# mimalloc under the memory-limit counter instead of the system allocator (on with either LLVM
# feature; `--no-default-features` alone keeps the system allocator).
mimalloc = ["dep:mimalloc"]

[dev-dependencies]
test-support = { path = "../test-support" }
serde_json = "=1.0.151"

[lints]
workspace = true

[[test]]
name = "native"
required-features = ["llvm"]
