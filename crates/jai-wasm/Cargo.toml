[package]
name = "jai-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
jai-runtime = { path = "../jai-runtime" }
jai-language-server = { path = "../jai-language-server" }

# Export-name attributes are the only permitted unsafe syntax, in exports.rs and language_server.rs.
# The interpreter and bridge use no unsafe blocks or raw host memory pointers.
[lints.rust]
unsafe_code = "deny"
[lints.clippy]
all = "warn"
