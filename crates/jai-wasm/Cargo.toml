[package]
name = "jai-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
build = "build.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
jai-language-server = { path = "../jai-language-server" }
jaic = { path = "../jaic" }

# Export-name attributes are the only permitted unsafe syntax, in the play_exports.rs and
# language_server.rs modules. The playground and language-server bridges use no unsafe blocks or raw host
# memory pointers (the jaic interpreter's own unsafe stays inside that crate).
[lints.rust]
unsafe_code = "deny"
[lints.clippy]
all = "warn"
