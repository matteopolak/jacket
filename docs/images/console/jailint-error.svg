<text x="38" y="103"><tspan fill="#ff6b6b" font-weight="700">error[use_after_free]</tspan><tspan fill="#d5dae3" font-weight="700">: `buffer` is used after the call above freed it</tspan></text>
<text x="38" y="119"><tspan fill="#d5dae3">   </tspan><tspan fill="#6cb2ff">╭─[</tspan><tspan fill="#d5dae3">freed.jai:6:12</tspan><tspan fill="#6cb2ff">]</tspan></text>
<text x="38" y="135"><tspan fill="#6cb2ff"> 3</tspan><tspan fill="#d5dae3"> </tspan><tspan fill="#6cb2ff">│</tspan><tspan fill="#d5dae3"> main :: () {</tspan></text>
<text x="38" y="151"><tspan fill="#6cb2ff"> 4</tspan><tspan fill="#d5dae3"> </tspan><tspan fill="#6cb2ff">│</tspan><tspan fill="#d5dae3">     buffer := alloc(64);</tspan></text>
<text x="38" y="167"><tspan fill="#d5dae3">   </tspan><tspan fill="#6cb2ff">·</tspan><tspan fill="#d5dae3">               </tspan><tspan fill="#6cb2ff" font-weight="700">─────────</tspan><tspan fill="#d5dae3"> </tspan><tspan fill="#6cb2ff" font-weight="700">storage derived here</tspan></text>
