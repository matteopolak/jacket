<text x="38" y="199"><tspan fill="#d5dae3">   </tspan><tspan fill="#6cb2ff">·</tspan><tspan fill="#d5dae3">     </tspan><tspan fill="#6cb2ff" font-weight="700">────────────</tspan><tspan fill="#d5dae3"> </tspan><tspan fill="#6cb2ff" font-weight="700">storage invalidated here</tspan></text>
