<text x="38" y="279"><tspan fill="#d5dae3">   </tspan><tspan fill="#6cb2ff">=</tspan><tspan fill="#d5dae3"> </tspan><tspan fill="#d5dae3" font-weight="700">help</tspan><tspan fill="#d5dae3">: free it after its last use, or give it a new value before using it again</tspan></text>
