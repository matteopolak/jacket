# Written by `jacket config migrate` from jailint.toml, jaifmt.toml.

[lint]
# jailint settings for this repository; see docs/tools/jailint.md.

# Every Jai file the repository owns is linted, except:
# - tests/corpus/negative: programs that must fail to compile.
# - stdlib tests' negative/, probes/ and driven/ directories: programs that must fail to compile,
#   known compiler gaps, and sources only a tool builds with its own flags.
# - tests/lint: each rule's bad cases, which must trigger it.
# - stdlib/Extensions/Jai_Format/tests/fixtures: formatter golden inputs, whose code is only there to be
#   formatted.
# - fuzz: fuzzer seeds and byte-exact regressions, many deliberately broken.
exclude = [
    "tests/corpus/negative/**",
    "tests/lint/**",
    "stdlib/**/tests/negative/**",
    "stdlib/**/tests/probes/**",
    "stdlib/**/tests/driven/**",
    "stdlib/Extensions/Jai_Format/tests/fixtures/**",
    "fuzz/**",
]

# Procedures over this mark carry a `// jailint: allow(cognitive_complexity)` on their first
# line; lower it as they are split.
max_complexity = 100

# Time units read as themselves (`seconds * 60`, `ns / 1_000_000_000`).
magic_number_allow = [60, 24, 1_000_000, 1_000_000_000]

# Off-by-default rules this repository holds itself to.
[lint.rules]
excessive_nesting = "warn"
leaked_allocation = "warn"
cognitive_complexity = "warn"
magic_number = "warn"

# Exact float comparisons in library code are checked; tests compare exact results on purpose.
[[lint.overrides]]
paths = ["stdlib/**"]
rules = { float_equality = "warn" }

[[lint.overrides]]
paths = ["stdlib/**/tests/**"]
rules = { float_equality = "allow" }

# Corpus fixtures are pinned by hash, so a case that is one `case` and a default stays as written.
[[lint.overrides]]
paths = ["tests/corpus/positive/case-selection.jai"]
rules = { single_case_switch = "allow" }

# Numbers that are the content rather than a choice: binary file formats, float and checksum
# algorithms, OS bindings, and benchmark or demo workloads.
[[lint.overrides]]
paths = [
    "benchmarks/**",
    "examples/**",
    "stdlib/**/bench/**",
    "stdlib/internal/executable/**",
    "stdlib/internal/archive/**",
    "stdlib/internal/media/**",
    "stdlib/internal/audio/**",
    "stdlib/internal/resource-wire/**",
    "stdlib/internal/android-toolchain/**",
    "stdlib/internal/developer-tools/**",
    "stdlib/Extensions/Wasi_Runtime/**",
    "stdlib/internal/numerics/**",
    "stdlib/internal/rendering/**",
    "stdlib/internal/hash/**",
    "stdlib/internal/crypto/**",
    "stdlib/internal/random/**",
    "stdlib/internal/basic/binary-to-decimal.jai",
    "stdlib/internal/basic/decimal-to-binary.jai",
    "stdlib/internal/basic/numeric-conversion.jai",
    "stdlib/internal/basic/format-float.jai",
    "stdlib/Extensions/Json/number.jai",
    "stdlib/X11/**",
    "stdlib/Windows/**",
    "stdlib/POSIX/**",
    # Staged copies of the files above and generated bindings that the developer checks lint.
    "target/**",
]
rules = { magic_number = "allow" }

# Tests, regressions and benchmarks write the flagged shapes on purpose: hand-written copy loops,
# one-element arrays, wide shifts and unsigned bounds are the inputs under test.
[[lint.overrides]]
paths = ["tests/**", "benchmarks/**", "stdlib/**/tests/**"]
rules = { manual_memcpy = "allow", manual_array_find = "allow", useless_format = "allow", unsigned_range_end_minus_one = "allow", useless_resizable = "allow", shift_overflow = "allow", lossy_float_literal = "allow", format_push_string = "allow" }

# Library code whose loops, bounds and formatting are kept as written: each loop or format call is
# guarded or shaped so that rewriting it would change when it allocates or what it reads.
[[lint.overrides]]
paths = [
    "stdlib/Extensions/Jai_Format/config.jai",
    "stdlib/Extensions/Tls/stream.jai",
    "stdlib/Extensions/Wasi_Runtime/files.jai",
    "stdlib/internal/bindings/apple-toolchain/module.jai",
    "stdlib/Extensions/Regex/nfa.jai",
]
rules = { manual_memcpy = "allow" }

[[lint.overrides]]
paths = [
    "stdlib/Extensions/Regex/**",
    "stdlib/internal/developer-tools/codeview-types.jai",
    "stdlib/internal/input/cocoa-events.jai",
    "stdlib/internal/audio/loading.jai",
]
rules = { unsigned_range_end_minus_one = "allow", manual_memcpy = "allow" }

[[lint.overrides]]
paths = ["stdlib/internal/developer-tools/c-header.jai"]
rules = { format_push_string = "allow" }

[[lint.overrides]]
paths = ["stdlib/internal/developer-tools/codeview-types.jai", "stdlib/internal/developer-tools/generator-platform.jai"]
rules = { useless_format = "allow" }

[[lint.overrides]]
paths = ["stdlib/internal/android-toolchain/android-manifest-writer.jai", "stdlib/internal/media/mpeg/program.jai"]
rules = { shift_overflow = "allow" }

[[lint.overrides]]
paths = ["stdlib/internal/media/mpeg/audio.jai", "stdlib/internal/random/pcg.jai"]
rules = { lossy_float_literal = "allow" }

[[lint.overrides]]
paths = ["stdlib/internal/input/cocoa-events.jai", "stdlib/internal/subtitles/parse.jai"]
rules = { manual_array_find = "allow" }

[format]
# jaifmt settings for this repository; see docs/tools/jaifmt.md.
indent_width = 4
max_width = 100
max_blank_lines = 1
brace_style = "same_line"
# Stricter, opt-in spacing inside code blocks (see docs/tools/jaifmt.md).
blank_line_after_declarations = true # after a run of declarations
blank_lines_around_blocks = true # around statements with a block body
blank_line_after_guards = true # after a run of one-line if/for/while
blank_line_before_return = true # above a return in a longer body

# Every Jai file the repository owns is formatted, except:
# - tests/corpus: fixtures pinned by sha256 in tests/corpus/manifest.json, and negative cases
#   that are deliberately malformed.
# - stdlib/Extensions/Jai_Format/tests/fixtures: golden inputs, kept unformatted.
# - tests/compiler/native/debug-info: the debugger test sets breakpoints at fixed line numbers.
# - fuzz: seeds are fuzzer inputs (odd layout is the point, and the jaifmt target starts from
#   them) and regressions are byte-exact reproducers.
ignore = ["tests/corpus/**", "stdlib/Extensions/Jai_Format/tests/fixtures/**", "tests/compiler/native/debug-info/**", "fuzz/**"]
