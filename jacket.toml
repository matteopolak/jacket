[[lint.overrides]]
paths = [
    "stdlib/Extensions/Regex/**",
    "stdlib/internal/developer-tools/codeview-types.jai",
    "stdlib/internal/input/cocoa-events.jai",
    "stdlib/internal/audio/loading.jai",
]
rules = { unsigned_range_end_minus_one = "allow", manual_memcpy = "allow" }

[[lint.overrides]]
paths = ["stdlib/internal/developer-tools/c-header.jai"]
rules = { format_push_string = "allow" }

[[lint.overrides]]
paths = ["stdlib/internal/developer-tools/codeview-types.jai", "stdlib/internal/developer-tools/generator-platform.jai"]
