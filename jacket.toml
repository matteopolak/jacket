    "stdlib/internal/audio/wav.jai",
    "stdlib/internal/developer-tools/codeview-symbol-parser.jai",
    "stdlib/internal/developer-tools/codeview-types.jai",
    "stdlib/internal/developer-tools/debug-formats/dwarf-line-wire.jai",
    "stdlib/internal/developer-tools/dwarf-frame.jai",
    "stdlib/internal/developer-tools/profiling/graphics.jai",
    "stdlib/internal/executable/coff.jai",
    "stdlib/internal/executable/lexer.jai",
