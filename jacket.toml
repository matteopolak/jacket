# Written by `jacket config migrate` from jailint.toml, jaifmt.toml.

[lint]
# jailint settings for this repository; see docs/tools/jailint.md.

# Every Jai file the repository owns is linted, except:
# - tests/corpus/negative: programs that must fail to compile.
# - stdlib tests' negative/, probes/ and driven/ directories: programs that must fail to compile,
#   known compiler gaps, and sources only a tool builds with its own flags.
# - tests/lint: each rule's bad cases, which must trigger it.
# - stdlib/Extensions/Jai_Format/tests/fixtures: formatter golden inputs, whose code is only there to be
#   formatted.
# - fuzz: fuzzer seeds and byte-exact regressions, many deliberately broken.
exclude = [
    "tests/corpus/negative/**",
    "tests/lint/**",
    "stdlib/**/tests/negative/**",
    "stdlib/**/tests/probes/**",
    "stdlib/**/tests/driven/**",
    "stdlib/Extensions/Jai_Format/tests/fixtures/**",
    "fuzz/**",
]

# Procedures over this mark carry a `// jailint: allow(cognitive_complexity)` on their first
# line; lower it as they are split.
max_complexity = 100

# Time units read as themselves (`seconds * 60`, `ns / 1_000_000_000`).
magic_number_allow = [60, 24, 1_000_000, 1_000_000_000]

# Off-by-default rules this repository holds itself to.
[lint.rules]
excessive_nesting = "warn"
leaked_allocation = "warn"
cognitive_complexity = "warn"
magic_number = "warn"

# Exact float comparisons in library code are checked; tests compare exact results on purpose.
[[lint.overrides]]
paths = ["stdlib/**"]
rules = { float_equality = "warn" }

[[lint.overrides]]
paths = ["stdlib/**/tests/**"]
rules = { float_equality = "allow" }

# Corpus fixtures are pinned by hash, so a case that is one `case` and a default stays as written.
[[lint.overrides]]
paths = ["tests/corpus/positive/case-selection.jai"]
rules = { single_case_switch = "allow" }

# Numbers that are the content rather than a choice. Each override names the files that still
# need it; the named constants and the character literals of the other files are in the code.

