# Written by `jacket config migrate` from jailint.toml, jaifmt.toml.

[lint]
# jailint settings for this repository; see docs/tools/jailint.md.

# Every Jai file the repository owns is linted, except:
# - tests/corpus/negative: programs that must fail to compile.
# - stdlib tests' negative/, probes/ and driven/ directories: programs that must fail to compile,
#   known compiler gaps, and sources only a tool builds with its own flags.
# - tests/lint: each rule's bad cases, which must trigger it.
# - stdlib/Extensions/Jai_Format/tests/fixtures: formatter golden inputs, whose code is only there to be
#   formatted.
# - fuzz: fuzzer seeds and byte-exact regressions, many deliberately broken.
exclude = [
    "tests/corpus/negative/**",
    "tests/lint/**",
    "stdlib/**/tests/negative/**",
    "stdlib/**/tests/probes/**",
    "stdlib/**/tests/driven/**",
    "stdlib/Extensions/Jai_Format/tests/fixtures/**",
    "fuzz/**",
]

# Off-by-default rules this repository holds itself to.
[lint.rules]
excessive_nesting = "warn"
leaked_allocation = "warn"

[format]
# jaifmt settings for this repository; see docs/tools/jaifmt.md.
indent_width = 4
max_width = 100
max_blank_lines = 1
brace_style = "same_line"
# Stricter, opt-in spacing inside code blocks (see docs/tools/jaifmt.md).
blank_line_after_declarations = true # after a run of declarations
blank_lines_around_blocks = true # around statements with a block body
blank_line_after_guards = true # after a run of one-line if/for/while
blank_line_before_return = true # above a return in a longer body

# Every Jai file the repository owns is formatted, except:
# - tests/corpus: fixtures pinned by sha256 in tests/corpus/manifest.json, and negative cases
#   that are deliberately malformed.
# - stdlib/Extensions/Jai_Format/tests/fixtures: golden inputs, kept unformatted.
# - tests/compiler/native/debug-info: the debugger test sets breakpoints at fixed line numbers.
# - fuzz: seeds are fuzzer inputs (odd layout is the point, and the jaifmt target starts from
#   them) and regressions are byte-exact reproducers.
ignore = ["tests/corpus/**", "stdlib/Extensions/Jai_Format/tests/fixtures/**", "tests/compiler/native/debug-info/**", "fuzz/**"]
