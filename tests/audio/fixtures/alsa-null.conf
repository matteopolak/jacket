# Normal Debian/Ubuntu ALSA package configuration, plus a real silent null PCM.
</usr/share/alsa/alsa.conf>
pcm.jai_audio_test {
    type null
    chmap [ "FL FR" "FL FR RL RR FC LFE" "FL FR RL RR FC LFE SL SR" ]
    hint {
        show on
        description "Clean-room audio controlled null sink"
    }
}
