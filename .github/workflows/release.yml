name: release
# Builds jacket, jaic, jailsp, jailint and jaifmt for macOS (Apple silicon and Intel), Linux (x86-64 and arm64) and
# Windows (x86-64 and arm64), optimized with PGO (except Windows arm64) and BOLT on Linux x86-64
# (tools/dev/build_pgo.py, docs/tools/releases.md).
# A `v*` tag push builds and publishes the matching compiler version. Manual runs from the default
# branch also require a tag matching that workflow revision's Cargo version. Historical releases
# are rebuilt by dispatching each historical workflow from its own tag, preserving its toolchain
# and platform matrix.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish_integrations:
        description: Publish external editor and package integrations (a tag push always does)
        type: boolean
        required: false
        default: false
      tag:
        description: Compiler tag matching this workflow revision (historical tags use their own workflow revision)
        required: false
        default: ''
      editor_version:
        description: Optional VS Code and Neovim plugin version; defaults to the compiler tag (for editor-only repins, e.g. 0.17.1)
        required: false
        default: ''
permissions:
  contents: read
# One release run per tag at a time: a second run for the same tag (a re-push, or a dispatch while
# the tag's own run builds) waits instead of publishing alongside it. Never cancelled, since a run
# may be part-way through publishing.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
env:
  # tools/ holds the folders the Python scripts import from (`from toolkit.repo import ROOT`).
  PYTHONPATH: ${{ github.workspace }}/tools
  CARGO_INCREMENTAL: '0'
jobs:
  release-meta:
    runs-on: ubuntu-24.04
    # Every job reads these instead of repeating event and input expressions.
    #   version                this workflow revision's compiler version (Cargo.toml)
    #   tag                    the selected compiler tag; empty for a run without one (a dry run)
    #   is_current_release     the tag is v<version>
    #   dry_run                no tag: render and validate, publish nothing
    #   publish_stores         a tag push, or a dispatch with publish_integrations
    #   publish_editor_stores  Marketplace and Open VSX: the current release on a tag push, or on a
    #                          dispatch with publish_integrations and an explicit editor_version
    #   editor_version         the dispatch input, else the compiler version
    #   editor_valid           editor_version is x.y.z
    #   editor_pinned          editor_version was given as an input
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      is_current_release: ${{ steps.meta.outputs.is_current_release }}
      dry_run: ${{ steps.meta.outputs.dry_run }}
      publish_stores: ${{ steps.meta.outputs.publish_stores }}
      publish_editor_stores: ${{ steps.meta.outputs.publish_editor_stores }}
      editor_version: ${{ steps.meta.outputs.editor_version }}
      editor_valid: ${{ steps.meta.outputs.editor_valid }}
      editor_pinned: ${{ steps.meta.outputs.editor_pinned }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Compute the release metadata
        id: meta
        env:
          TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
          EDITOR_INPUT: ${{ inputs.editor_version }}
          PUBLISH_INTEGRATIONS: ${{ inputs.publish_integrations }}
          EVENT: ${{ github.event_name }}
        run: python3 tools/release.py meta

  validate-release:
    needs: release-meta
    runs-on: ubuntu-24.04
    steps:
      - name: Require the selected tag to match this workflow revision
        env:
          RELEASE_VERSION: ${{ needs.release-meta.outputs.version }}
          RELEASE_TAG: ${{ needs.release-meta.outputs.tag }}
          DRY_RUN: ${{ needs.release-meta.outputs.dry_run }}
          IS_CURRENT: ${{ needs.release-meta.outputs.is_current_release }}
          EDITOR_VERSION: ${{ needs.release-meta.outputs.editor_version }}
          EDITOR_VALID: ${{ needs.release-meta.outputs.editor_valid }}
        run: |
          if [ "$DRY_RUN" != true ] && [ "$IS_CURRENT" != true ]; then
            echo "This workflow builds v$RELEASE_VERSION. Dispatch historical versions from their own tag workflow; selected $RELEASE_TAG." >&2
            exit 1
          fi
          # Fail before the builds rather than after them.
          [ "$EDITOR_VALID" = true ] || { echo "editor_version must be x.y.z, got $EDITOR_VERSION" >&2; exit 1; }

  build:
    name: ${{ matrix.name }}
    needs: validate-release
    if: github.event_name != 'push' || !github.event.forced
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            runner: macos-15
            llvm: LLVM-{version}-macOS-ARM64.tar.xz
          # LLVM publishes no Intel macOS build: conda-forge's static libraries instead
          # (tools/ci/install_ci_llvm_macos.sh --static).
          - name: macos-x64
            runner: macos-15-intel
            llvm: conda-forge
          - name: linux-x64
            runner: ubuntu-24.04
            llvm: LLVM-{version}-Linux-X64.tar.xz
            bolt: true
          # No BOLT: Ubuntu's arm64 linker adds Cortex-A53 erratum 843419 veneers, which llvm-bolt
          # refuses to keep; dropping them would break the binary on Cortex-A53 (Raspberry Pi 3).
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            llvm: LLVM-{version}-Linux-ARM64.tar.xz
          - name: windows-x64
            runner: windows-2025
            llvm: clang+llvm-{version}-x86_64-pc-windows-msvc.tar.xz
            rust_target: x86_64-pc-windows-msvc
          - name: windows-arm64
            runner: windows-11-arm
            llvm: clang+llvm-{version}-aarch64-pc-windows-msvc.tar.xz
            rust_target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      # llvm-tools: the llvm-profdata that matches rustc's LLVM, to merge the PGO profiles.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: '3.14'}
      - name: Install the pinned toolchain
        run: python3 tools/ci/install_pinned.py rust --component llvm-tools
      - uses: ./.github/actions/dependency-age-cache
      - name: Validate dependency ages before building
        # Read-only GitHub API access for the commit dates of pinned git dependencies.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/ci/check_dependency_age.py
      # Downloaded from the LLVM release each run: the archives are 0.8-2 GB, and cached copies would fill the repository's cache budget for no saving.
      - name: Install the official LLVM release (static libraries)
        if: matrix.llvm != '' && matrix.llvm != 'conda-forge'
        env:
          ARCHIVE: ${{ matrix.llvm }}
        run: python3 tools/ci/install_pinned.py llvm-release "$ARCHIVE"
      # The official macOS LLVM names Homebrew's static zstd (/opt/homebrew/lib/libzstd.a) in its
      # system libraries; linking the archive leaves no runtime dependency on Homebrew.
      # Its static libraries are LTO bitcode that Xcode's ld cannot read, so link with the
      # release's own clang and lld (which run that LTO) against the Xcode SDK. The release also
      # ships its own libc++ (static, and a dylib found through @rpath); removing it makes `-lc++`
      # link the system's /usr/lib/libc++.1.dylib from the SDK.
      - name: Install static zstd and link with LLVM's lld (macOS arm64)
        if: runner.os == 'macOS' && matrix.llvm != 'conda-forge'
        run: bash tools/ci/macos_static_zstd.sh
      # conda-forge's LLVM for osx-64 (static libraries of ordinary objects, which Xcode's ld
      # links) with its static zstd and libc++; the script deletes the environment's dylibs, so
      # `-lz -lxml2 -liconv` link the system's and `-lzstd -lc++` the archives. The static libc++ needs the system's libc++abi. Nothing points into the
      # runner's temp directory afterwards (the smoke test's otool check).
      - name: Install conda-forge's static LLVM (macOS x64)
        if: matrix.llvm == 'conda-forge'
        run: |
          tools/ci/install_ci_llvm_macos.sh --static
          echo "CARGO_TARGET_X86_64_APPLE_DARWIN_RUSTFLAGS=-C link-arg=-lc++abi" >> "$GITHUB_ENV"
      # The Windows release's llvm-config names static libraries the archive lacks (libxml2,
      # and zstd by an absolute build-machine path llvm-sys cannot parse); prepare.sh supplies
      # them and an llvm-config front (docs/tools/llvm-setup.md). The release is built against
      # the static C runtime (/MT), so jaic must be too, or it crashes at run time.
      # The release's clang (on PATH) is the smoke test's linker driver.
      - name: Prepare LLVM and use the static CRT (Windows)
        if: runner.os == 'Windows'
        run: |
          llvm="$(cygpath -u "$RUNNER_TEMP")/llvm"
          bash tools/ci/windows-llvm/prepare.sh "$llvm"
          # An explicit target keeps the flag off build scripts and proc macros.
          target="${{ matrix.rust_target }}"
          echo "CARGO_BUILD_TARGET=$target" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_$(echo "$target" | tr 'a-z-' 'A-Z_')_RUSTFLAGS=-C target-feature=+crt-static" >> "$GITHUB_ENV"
          cygpath -w "$llvm/bin" >> "$GITHUB_PATH"
      - name: Install static zlib and zstd (Linux)
        if: runner.os == 'Linux'
        # X11 and GL: Window_Creation, which the smoke test's WebGPU triangle links.
        timeout-minutes: 15
        run: |
          bash tools/ci/apt_install.sh zlib1g-dev libzstd-dev libxml2-dev libx11-dev libgl-dev libasound2-dev libpulse-dev libpipewire-0.3-dev libwayland-dev libxkbcommon-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev libdrm-dev libgbm-dev libegl-dev libudev-dev libusb-1.0-0-dev libdecor-0-dev patchelf
      # Instrumented build, training run over this repository's tests and examples, then the
      # profile-guided build into target/pgo/dist. On Linux x86-64 the result is also rewritten by
      # the llvm-bolt that ships in the official LLVM release (elsewhere: PGO only).
      - name: Build (PGO, and BOLT on Linux x86-64)
        id: build
        run: |
          llvm=none
          if [ -n "${{ matrix.llvm }}" ]; then llvm=lazy; fi
          bolt=()
          if [ "${{ matrix.bolt }}" = true ]; then bolt=(--bolt --llvm-bin "$RUNNER_TEMP/llvm/bin"); fi
          python3 tools/dev/build_pgo.py --llvm "$llvm" --jobs 4 "${bolt[@]}"
      # The static LLVM links into the code generation library, not into jaic.
      - name: Show the failing link
        if: failure() && steps.build.outcome == 'failure' && matrix.llvm != ''
        run: cargo rustc --release --locked -p jaic-backend --no-default-features --features static -- -C link-args=-v 2>&1 | tail -60
      - name: Package
        env:
          NAME: ${{ matrix.name }}
        run: bash tools/ci/package_release.sh
      - name: Smoke test the packaged compiler outside the checkout
        env:
          NAME: ${{ matrix.name }}
          LLVM: ${{ matrix.llvm }}
        run: bash tools/ci/smoke_packaged_compiler.sh
      # What a user does first, on the archive that is about to be published: `jacket new`,
      # `build`, `run` and a language-server hover (the post-release smoke test's project check),
      # then that `-check` and `-interp` never open the code generation library and a build does
      # (docs/compiler/lazy-backend.md). Catches a tool or library the archive lacks before the
      # release exists.
      - name: Smoke test a new project with the packaged tools
        shell: bash
        run: python3 tools/ci/release_smoke.py project --bin "$PWD/$PACKAGE_DIR"
      # generate_bindings on a C header and on the C++ class of issue 26, with the packaged tools
      # outside the checkout: a helper library the archive lacks fails here.
      - name: Smoke test Bindings_Generator with the packaged tools
        shell: bash
        run: python3 tools/ci/release_smoke.py bindings --bin "$PWD/$PACKAGE_DIR"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

  # The VS Code extension can have an editor-only version while pinning the compiler release's
  # archive checksums (docs/tools/vscode-extension.md).
  vscode:
    needs: [release-meta, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TOOLCHAIN_VERSION: ${{ needs.release-meta.outputs.version }}
      EDITOR_VERSION: ${{ needs.release-meta.outputs.editor_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: '24'}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: archives
          merge-multiple: true
      - name: Validate dependency ages before installing
        working-directory: editors/vscode
        run: node scripts/check-dependency-age.ts
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: editors/vscode/package.json
      - name: Package
        working-directory: editors/vscode
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          npm pkg set version="$EDITOR_VERSION"
          python3 ../../tools/ci/toolchain_manifest.py --version "$TOOLCHAIN_VERSION" --archives ../../archives --out toolchain-manifest.json
          test "$(node -p 'require("./package.json").version')" = "$EDITOR_VERSION"
          test "$(node -p 'require("./toolchain-manifest.json").version')" = "$TOOLCHAIN_VERSION"
          pnpm run package -o "jacket-vscode-$EDITOR_VERSION.vsix"
          mkdir -p ../../vsix && mv "jacket-vscode-$EDITOR_VERSION.vsix" ../../vsix/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vscode-extension
          path: vsix/*.vsix
          if-no-files-found: error

  # The API reference (docs/tools/jacket-doc.md): the standard library's docs as a static site
  # for /docs/jacket/, with the browser compiler beside it so the examples run on the page. Attached
  # to the release as jacket-docs-<version>.tar.gz; the portfolio site unpacks it.
  docs:
    needs: [release-meta, validate-release]
    if: github.event_name != 'push' || !github.event.forced
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: '0'
      VERSION: ${{ needs.release-meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Install the pinned Rust toolchain and wasm target
        run: python3 tools/ci/install_pinned.py rust --target wasm32-unknown-unknown
      - uses: ./.github/actions/rust-cache
      - uses: ./.github/actions/dependency-age-cache
      - name: Validate dependency ages before building
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/ci/check_dependency_age.py
      - name: Fetch the locked crates
        run: cargo fetch --locked
      - name: Build the browser compiler
        run: python3 tools/browser/build_scripting_wasm.py --release --output target/doc-runtime
      - name: Build jacket and jaic without the native backend
        run: cargo build --release --locked --offline -p jacket -p jaic-cli --no-default-features
      - name: Build the site
        run: target/release/jacket doc --base-url /docs/jacket/ --source-ref "v$VERSION" --runtime target/doc-runtime --out target/doc-site
      - name: Pack it
        run: |
          mkdir -p dist-docs
          tar -czf "dist-docs/jacket-docs-$VERSION.tar.gz" -C target/doc-site .
          ls -l dist-docs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-site
          path: dist-docs/*.tar.gz
          if-no-files-found: error

  publish:
    needs: [release-meta, validate-release, build, vscode, docs]
    if: >-
      needs.release-meta.outputs.is_current_release == 'true' &&
      (github.event_name == 'workflow_dispatch' || !github.event.forced)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ needs.release-meta.outputs.tag }}
        run: |
          tag="$TAG"
          python3 tools/release.py notes "$tag" > notes.md
          python3 tools/ci/toolchain_manifest.py --version "$tag" --archives dist --out dist/toolchain-manifest.json
          (cd dist && sha256sum -- * > SHA256SUMS)
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_VERSION: ${{ needs.release-meta.outputs.version }}
        run: python3 tools/release.py publish

  # Extension stores are only updated for the current compiler release. Historical compiler
  # rebuilds still attach a freshly checksum-pinned VSIX to GitHub, without republishing old,
  # immutable store versions.
  editor-store:
    name: editor-store (${{ matrix.store }})
    needs: [release-meta, vscode, publish]
    if: needs.release-meta.outputs.publish_editor_stores == 'true'
    strategy:
      fail-fast: false
      matrix:
        store: [marketplace, open-vsx]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: '24'}
      - name: Validate dependency ages before installing
        run: node scripts/check-dependency-age.ts
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: editors/vscode/package.json
      - name: Install vsce and ovsx
        run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vscode-extension
          path: vsix
      - name: Publish to the VS Code Marketplace
        if: matrix.store == 'marketplace'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: python3 ../../tools/release.py marketplace
      - name: Publish to Open VSX
        if: matrix.store == 'open-vsx'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: python3 ../../tools/release.py open-vsx

  # Package managers (docs/tools/releases.md). After the GitHub release, the Homebrew
  # formula is rendered from the tag and the release's own SHA256SUMS
  # by tools/dev/render_packages.py, validated, and published when their secret is set (otherwise the
  # job says it skipped). They run after `publish`, so a failure here never holds up the release.
  # A run without a tag renders and validates from this run's archives and publishes nothing.
  homebrew:
    needs: [release-meta, build, publish]
    if: >-
      needs.release-meta.outputs.publish_stores == 'true' &&
      (needs.release-meta.outputs.is_current_release == 'true' || needs.release-meta.outputs.dry_run == 'true') &&
      !cancelled() && needs.build.result == 'success' &&
      (needs.publish.result == 'success' || (needs.publish.result == 'skipped' && needs.release-meta.outputs.dry_run == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TAG: ${{ needs.release-meta.outputs.tag }}
      VERSION: ${{ needs.release-meta.outputs.version }}
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      HOMEBREW_NO_ENV_HINTS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: '3.14'}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: env.TAG == ''
        with:
          pattern: '*64'
          path: archives
          merge-multiple: true
      - name: Render the formula from the release's version and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$TAG" ]; then
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p SHA256SUMS -D "$RUNNER_TEMP"
            source=(--sums "$RUNNER_TEMP/SHA256SUMS")
          else
            source=(--archives archives)
          fi
          python3 tools/dev/render_packages.py --version "$VERSION" "${source[@]}" --out "$RUNNER_TEMP/packages"
          cat "$RUNNER_TEMP/packages/homebrew/jacket.rb"
      - name: Validate the formula (and, for a release, install and test it)
        run: |
          # The URLs exist only once the release does, so a dry run only audits.
          mode=audit; [ -n "$TAG" ] && mode=install
          bash tools/ci/check_formula.sh "$RUNNER_TEMP/packages/homebrew/jacket.rb" jairelease/local "$mode"
      # The tap may hold only a README: the first push creates Formula/.
      - name: Push the formula to matteopolak/homebrew-tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: python3 tools/release.py homebrew

  # The Neovim plugin (editors/nvim) is mirrored to matteopolak/jacket.nvim, because vim.pack and
  # plugin managers need a repository whose root is the plugin. The mirror's main branch is
  # replaced by the plugin's files with its version and the release's toolchain manifest stamped in, and
  # tagged vX.Y.Z. It pushes only when the NVIM_MIRROR_DEPLOY_KEY secret (a write-enabled
  # deploy key of that repository) is set; see docs/tools/neovim-plugin.md#publishing.
  neovim:
    needs: [release-meta, build, publish, vscode]
    if: >-
      needs.release-meta.outputs.publish_stores == 'true' &&
      (needs.release-meta.outputs.is_current_release == 'true' || needs.release-meta.outputs.dry_run == 'true') &&
      (github.event_name == 'push' ||
       (needs.release-meta.outputs.editor_pinned == 'true' && needs.vscode.result == 'success') ||
       (needs.release-meta.outputs.dry_run == 'true' && needs.release-meta.outputs.editor_pinned == 'false')) &&
      !cancelled() && needs.build.result == 'success' &&
      (needs.publish.result == 'success' || (needs.publish.result == 'skipped' && needs.release-meta.outputs.dry_run == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TAG: ${{ needs.release-meta.outputs.tag }}
      VERSION: ${{ needs.release-meta.outputs.version }}
      EDITOR_VERSION: ${{ needs.release-meta.outputs.editor_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Stamp the version and the release's toolchain manifest into the plugin
        env:
          GH_TOKEN: ${{ github.token }}
        # The plugin downloads the compiler version; its mirror tag can advance separately.
        run: python3 tools/release.py nvim-stamp
      - name: Push to matteopolak/jacket.nvim
        env:
          DEPLOY_KEY: ${{ secrets.NVIM_MIRROR_DEPLOY_KEY }}
        run: python3 tools/release.py nvim-mirror
