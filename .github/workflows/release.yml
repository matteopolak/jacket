name: release
# Builds jacket, jaic, jailsp, jailint and jaifmt for macOS (Apple silicon and Intel), Linux (x86-64 and arm64) and
# Windows (x86-64 and arm64), optimized with PGO (except Windows arm64) and BOLT on Linux x86-64
# (tools/dev/build_pgo.py, docs/tools/releases.md).
# A `v*` tag push builds and publishes the matching compiler version. Manual runs from the default
# branch also require a tag matching that workflow revision's Cargo version. Historical releases
# are rebuilt by dispatching each historical workflow from its own tag, preserving its toolchain
# and platform matrix.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish_integrations:
        description: Publish external editor and package integrations (a tag push always does)
        type: boolean
        required: false
        default: false
      tag:
        description: Compiler tag matching this workflow revision (historical tags use their own workflow revision)
        required: false
        default: ''
      editor_version:
        description: Optional VS Code and Neovim plugin version; defaults to the compiler tag (for editor-only repins, e.g. 0.17.1)
        required: false
        default: ''
permissions:
  contents: read
# One release run per tag at a time: a second run for the same tag (a re-push, or a dispatch while
# the tag's own run builds) waits instead of publishing alongside it. Never cancelled, since a run
# may be part-way through publishing.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
env:
  CARGO_INCREMENTAL: '0'
  LLVM_VERSION: 23.1.2
jobs:
  release-meta:
    runs-on: ubuntu-24.04
    # Every job reads these instead of repeating event and input expressions.
    #   version                this workflow revision's compiler version (Cargo.toml)
    #   tag                    the selected compiler tag; empty for a run without one (a dry run)
    #   is_current_release     the tag is v<version>
    #   dry_run                no tag: render and validate, publish nothing
    #   publish_stores         a tag push, or a dispatch with publish_integrations
    #   publish_editor_stores  Marketplace and Open VSX: the current release on a tag push, or on a
    #                          dispatch with publish_integrations and an explicit editor_version
    #   editor_version         the dispatch input, else the compiler version
    #   editor_valid           editor_version is x.y.z
    #   editor_pinned          editor_version was given as an input
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      is_current_release: ${{ steps.meta.outputs.is_current_release }}
      dry_run: ${{ steps.meta.outputs.dry_run }}
      publish_stores: ${{ steps.meta.outputs.publish_stores }}
      publish_editor_stores: ${{ steps.meta.outputs.publish_editor_stores }}
      editor_version: ${{ steps.meta.outputs.editor_version }}
      editor_valid: ${{ steps.meta.outputs.editor_valid }}
      editor_pinned: ${{ steps.meta.outputs.editor_pinned }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Compute the release metadata
        id: meta
        env:
          TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
          EDITOR_INPUT: ${{ inputs.editor_version }}
          PUBLISH_INTEGRATIONS: ${{ inputs.publish_integrations }}
          EVENT: ${{ github.event_name }}
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          is_current=false
          dry_run=false
          publish_stores=false
          publish_editor_stores=false
          editor_pinned=false
          editor_valid=false
          if [ -z "$TAG" ]; then dry_run=true; elif [ "$TAG" = "v$version" ]; then is_current=true; fi
          if [ "$EVENT" = push ] || [ "$PUBLISH_INTEGRATIONS" = true ]; then publish_stores=true; fi
          editor_version="$EDITOR_INPUT"
          if [ -n "$editor_version" ]; then editor_pinned=true; else editor_version="${TAG#v}"; fi
          if [ -z "$editor_version" ]; then editor_version="$version"; fi
          if [[ "$editor_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then editor_valid=true; fi
          if [ "$is_current" = true ] && { [ "$EVENT" = push ] || { [ "$PUBLISH_INTEGRATIONS" = true ] && [ "$editor_pinned" = true ]; }; }; then
            publish_editor_stores=true
          fi
          {
            echo "version=$version"
            echo "tag=$TAG"
            echo "is_current_release=$is_current"
            echo "dry_run=$dry_run"
            echo "publish_stores=$publish_stores"
            echo "publish_editor_stores=$publish_editor_stores"
            echo "editor_version=$editor_version"
            echo "editor_valid=$editor_valid"
            echo "editor_pinned=$editor_pinned"
          } >> "$GITHUB_OUTPUT"

  validate-release:
    needs: release-meta
    runs-on: ubuntu-24.04
    steps:
      - name: Require the selected tag to match this workflow revision
        env:
          RELEASE_VERSION: ${{ needs.release-meta.outputs.version }}
          RELEASE_TAG: ${{ needs.release-meta.outputs.tag }}
          DRY_RUN: ${{ needs.release-meta.outputs.dry_run }}
          IS_CURRENT: ${{ needs.release-meta.outputs.is_current_release }}
          EDITOR_VERSION: ${{ needs.release-meta.outputs.editor_version }}
          EDITOR_VALID: ${{ needs.release-meta.outputs.editor_valid }}
        run: |
          if [ "$DRY_RUN" != true ] && [ "$IS_CURRENT" != true ]; then
            echo "This workflow builds v$RELEASE_VERSION. Dispatch historical versions from their own tag workflow; selected $RELEASE_TAG." >&2
            exit 1
          fi
          # Fail before the builds rather than after them.
          [ "$EDITOR_VALID" = true ] || { echo "editor_version must be x.y.z, got $EDITOR_VERSION" >&2; exit 1; }

  build:
    name: ${{ matrix.name }}
    needs: validate-release
    if: github.event_name != 'push' || !github.event.forced
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            runner: macos-15
            llvm: LLVM-23.1.2-macOS-ARM64.tar.xz
          # LLVM publishes no Intel macOS build: conda-forge's static libraries instead
          # (tools/ci/install_ci_llvm_macos.sh --static).
          - name: macos-x64
            runner: macos-15-intel
            llvm: conda-forge
          - name: linux-x64
            runner: ubuntu-24.04
            llvm: LLVM-23.1.2-Linux-X64.tar.xz
            bolt: true
          # No BOLT: Ubuntu's arm64 linker adds Cortex-A53 erratum 843419 veneers, which llvm-bolt
          # refuses to keep; dropping them would break the binary on Cortex-A53 (Raspberry Pi 3).
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            llvm: LLVM-23.1.2-Linux-ARM64.tar.xz
          - name: windows-x64
            runner: windows-2025
            llvm: clang+llvm-23.1.2-x86_64-pc-windows-msvc.tar.xz
            rust_target: x86_64-pc-windows-msvc
          - name: windows-arm64
            runner: windows-11-arm
            llvm: clang+llvm-23.1.2-aarch64-pc-windows-msvc.tar.xz
            rust_target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      # llvm-tools: the llvm-profdata that matches rustc's LLVM, to merge the PGO profiles.
      - name: Install the pinned toolchain
        run: bash tools/ci/install_rust_toolchain.sh --component llvm-tools
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Validate dependency ages before building
        # Read-only GitHub API access for the commit dates of pinned git dependencies.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/ci/check_dependency_age.py
      # The download is cached by archive name; ci.yml's Windows setup uses the same key and path.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: matrix.llvm != '' && matrix.llvm != 'conda-forge'
        with:
          path: ${{ runner.temp }}/llvm-download
          key: llvm-${{ matrix.llvm }}
      - name: Install the official LLVM release (static libraries)
        if: matrix.llvm != '' && matrix.llvm != 'conda-forge'
        env:
          ARCHIVE: ${{ matrix.llvm }}
        run: bash tools/ci/install_llvm_release.sh "$ARCHIVE"
      # The official macOS LLVM names Homebrew's static zstd (/opt/homebrew/lib/libzstd.a) in its
      # system libraries; linking the archive leaves no runtime dependency on Homebrew.
      # Its static libraries are LTO bitcode that Xcode's ld cannot read, so link with the
      # release's own clang and lld (which run that LTO) against the Xcode SDK. The release also
      # ships its own libc++ (static, and a dylib found through @rpath); removing it makes `-lc++`
      # link the system's /usr/lib/libc++.1.dylib from the SDK.
      - name: Install static zstd and link with LLVM's lld (macOS arm64)
        if: runner.os == 'macOS' && matrix.llvm != 'conda-forge'
        run: |
          brew install zstd
          ls -l /opt/homebrew/lib/libzstd.a
          # llvm-sys turns that absolute path into `-L/opt/homebrew/lib -lzstd`, for which ld
          # prefers the dylib beside the archive (and jaic would then need Homebrew's zstd at run
          # time). Without the dylib links in that folder, the archive is linked.
          rm -f /opt/homebrew/lib/libzstd*.dylib
          ls "$RUNNER_TEMP/llvm/bin/ld64.lld"
          find "$RUNNER_TEMP/llvm/lib" \( -name 'libc++*' -o -name 'libunwind*' \) -print -delete
          {
            echo "SDKROOT=$(xcrun --show-sdk-path)"
            echo "CARGO_TARGET_AARCH64_APPLE_DARWIN_LINKER=$RUNNER_TEMP/llvm/bin/clang"
            echo "CARGO_TARGET_AARCH64_APPLE_DARWIN_RUSTFLAGS=-C link-arg=-fuse-ld=lld"
          } >> "$GITHUB_ENV"
      # conda-forge's LLVM for osx-64 (static libraries of ordinary objects, which Xcode's ld
      # links) with its static zstd and libc++; the script deletes the environment's dylibs, so
      # `-lz -lxml2 -liconv` link the system's and `-lzstd -lc++` the archives. The static libc++ needs the system's libc++abi. Nothing points into the
      # runner's temp directory afterwards (the smoke test's otool check).
      - name: Install conda-forge's static LLVM (macOS x64)
        if: matrix.llvm == 'conda-forge'
        run: |
          tools/ci/install_ci_llvm_macos.sh --static
          echo "CARGO_TARGET_X86_64_APPLE_DARWIN_RUSTFLAGS=-C link-arg=-lc++abi" >> "$GITHUB_ENV"
      # The Windows release's llvm-config names static libraries the archive lacks (libxml2,
      # and zstd by an absolute build-machine path llvm-sys cannot parse); prepare.sh supplies
      # them and an llvm-config front (docs/tools/llvm-setup.md). The release is built against
      # the static C runtime (/MT), so jaic must be too, or it crashes at run time.
      # The release's clang (on PATH) is the smoke test's linker driver.
      - name: Prepare LLVM and use the static CRT (Windows)
        if: runner.os == 'Windows'
        run: |
          llvm="$(cygpath -u "$RUNNER_TEMP")/llvm"
          bash tools/ci/windows-llvm/prepare.sh "$llvm"
          # An explicit target keeps the flag off build scripts and proc macros.
          target="${{ matrix.rust_target }}"
          echo "CARGO_BUILD_TARGET=$target" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_$(echo "$target" | tr 'a-z-' 'A-Z_')_RUSTFLAGS=-C target-feature=+crt-static" >> "$GITHUB_ENV"
          cygpath -w "$llvm/bin" >> "$GITHUB_PATH"
      - name: Install static zlib and zstd (Linux)
        if: runner.os == 'Linux'
        # X11 and GL: Window_Creation, which the smoke test's WebGPU triangle links.
        timeout-minutes: 15
        run: |
          bash tools/ci/apt_install.sh zlib1g-dev libzstd-dev libxml2-dev libx11-dev libgl-dev libasound2-dev libpulse-dev libpipewire-0.3-dev libwayland-dev libxkbcommon-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev libdrm-dev libgbm-dev libegl-dev libudev-dev libusb-1.0-0-dev libdecor-0-dev patchelf
      # Instrumented build, training run over this repository's tests and examples, then the
      # profile-guided build into target/pgo/dist. On Linux x86-64 the result is also rewritten by
      # the llvm-bolt that ships in the official LLVM release (elsewhere: PGO only).
      - name: Build (PGO, and BOLT on Linux x86-64)
        id: build
        run: |
          llvm=none
          if [ -n "${{ matrix.llvm }}" ]; then llvm=static; fi
          bolt=()
          if [ "${{ matrix.bolt }}" = true ]; then bolt=(--bolt --llvm-bin "$RUNNER_TEMP/llvm/bin"); fi
          python3 tools/dev/build_pgo.py --llvm "$llvm" --jobs 4 "${bolt[@]}"
      - name: Show the failing link
        if: failure() && steps.build.outcome == 'failure' && matrix.llvm != ''
        run: cargo rustc --release --locked -p jaic-cli --bin jaic --no-default-features --features static-llvm -- -C link-args=-v 2>&1 | tail -60
      - name: Package
        run: |
          exe=""
          if [ "$RUNNER_OS" = "Windows" ]; then exe=".exe"; fi
          dir="jacket-${{ matrix.name }}"
          mkdir -p "$dir"
          out="target/pgo/dist"
          # Symbol tables are about a tenth of the macOS binary (docs/tools/releases.md,
          # "Binary size"). Stripped after PGO and BOLT, which need them. macOS: local symbols
          # only, then the ad-hoc signature arm64 requires is made again. Windows: the
          # symbols are in the .pdb, which the archive does not ship.
          case "$RUNNER_OS" in
            macOS) for t in jaic jailsp jailint jacket; do strip -x "$out/$t"; codesign --force -s - "$out/$t"; done ;;
            Linux) for t in jaic jailsp jailint jacket; do strip --strip-unneeded "$out/$t"; done ;;
          esac
          ls -l "$out"
          cp "$out/jaic$exe" "$out/jailsp$exe" "$out/jailint$exe" "$out/jacket$exe" "$dir/"
          # Bootstrap definitions are packaged with the standard library.
          cp -R stdlib "$dir/stdlib"
          # Windows: the crash runtime the standard library binds (crash-native/platform_io_windows_crash)
          # is C built here, not stored in the repository. The DLL is what `jaic -interp` and a
          # metaprogram load; the static archive is what built programs link, so they need no DLL.
          if [ "$RUNNER_OS" = "Windows" ]; then
            cpu="${{ matrix.name == 'windows-arm64' && 'arm64' || 'x64' }}"
            python3 tools/stdlib/build_platform_io_runtime.py --stdlib "$dir/stdlib" --cpu "$cpu" --static-library
            ls -l "$dir/stdlib/internal/runtime/crash-native"
          fi
          cp README.md CHANGELOG.md "$dir/"
          # wgpu-native for the WebGPU module (pinned and checksum-verified, tools/bindings/webgpu.json),
          # where jaic looks for native libraries: <stdlib>/../native-libs/<platform>.
          # The static library is what `jaic` links, the shared one what `jaic -interp` loads.
          python3 tools/bindings/fetch_wgpu_native.py --platform "${{ matrix.name }}" --out "$dir/native-libs/${{ matrix.name }}"
          # The C libraries the stdlib binds (stb_image, stb_image_write, stb_image_resize,
          # stb_vorbis, lz4, meshoptimizer, pl_mpeg, FreeType, Dear ImGui and MojoShader; rpmalloc
          # on macOS and Linux; SDL2 on Windows x64), built from the pinned, checksum-verified
          # sources in tools/native/native-libs.json, static and shared like wgpu-native, each with its
          # licence under licenses/. Simp, GetRect, Sound_Player and the other modules need them.
          # The script stops when a file it should have left is missing. macOS: for the oldest
          # macOS the jaic binary runs on, not the runner's.
          if [ "$RUNNER_OS" = "macOS" ]; then
            export MACOSX_DEPLOYMENT_TARGET="${{ matrix.name == 'macos-x64' && '10.12' || '11.0' }}"
          fi
          python3 tools/native/build_native_libs.py --platform "${{ matrix.name }}" --out "$dir/native-libs/${{ matrix.name }}"
          # What Bindings_Generator's generate_bindings needs at run time: its helper library on every
          # platform, and libclang from the pinned LLVM on Linux and Windows (macOS uses the Xcode
          # toolchain's; docs/tools/releases.md, "Bindings_Generator"). Printed with its size.
          python3 tools/ci/package_bindings_helpers.py --platform "${{ matrix.name }}" \
            --llvm-prefix "${LLVM_SYS_231_PREFIX:-$RUNNER_TEMP/llvm}" --out "$dir/native-libs/${{ matrix.name }}"
          unset MACOSX_DEPLOYMENT_TARGET
          ls -l "$dir/native-libs/${{ matrix.name }}"
          # Every library the packaged stdlib binds is either in the archive, built into jaic, or
          # the system's on purpose (the audio output, clipboard and allocator libraries once
          # went missing from all six archives).
          python3 tools/ci/check_native_libs.py --stdlib "$dir/stdlib" --platform "${{ matrix.name }}" \
            --native "$dir/native-libs/${{ matrix.name }}"
          # jaifmt is a Jai program: built by the packaged jaic against the packaged stdlib, -O2
          # with the default checks (not jaifmt/build.jai's unchecked build), no debug files.
          "$dir/jaic$exe" jaifmt/main.jai -O2 -no_debug_info -exe "$dir/jaifmt"
          # SDL3's generated source must satisfy the real repository formatter and linter.
          # No missing dependency or syntax-only lint fallback is accepted by these checks.
          "$dir/jaifmt$exe" --check stdlib/Extensions/SDL3 stdlib/Extensions/SDL3/tests
          python3 tools/bindings/sdl3_gen.py --source target/sdl3/SDL3-3.4.18 --jaifmt "$PWD/$dir/jaifmt$exe" --check
          python3 tools/bindings/sdl3_lint.py --jailint "$PWD/$dir/jailint$exe" --stdlib "$PWD/$dir/stdlib"
          ls "$dir"
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip "$dir.zip" "$dir" > /dev/null
            echo "ARCHIVE=$dir.zip" >> "$GITHUB_ENV"
          else
            tar -czf "$dir.tar.gz" "$dir"
            echo "ARCHIVE=$dir.tar.gz" >> "$GITHUB_ENV"
          fi
          echo "PACKAGE_DIR=$dir" >> "$GITHUB_ENV"
      - name: Smoke test the packaged compiler outside the checkout
        run: |
          exe=""
          if [ "$RUNNER_OS" = "Windows" ]; then exe=".exe"; fi
          work="$RUNNER_TEMP/smoke"
          mkdir -p "$work"
          cp examples/compile-time-record.jai "$work/main.jai"
          jaic="$PWD/$PACKAGE_DIR/jaic$exe"
          jailint="$PWD/$PACKAGE_DIR/jailint$exe"
          jaifmt="$PWD/$PACKAGE_DIR/jaifmt$exe"
          cd "$work"
          # Input without a final newline, as Homebrew's formula test sends it; the exit status
          # is checked too (a crash prints nothing, which an output check alone could miss).
          set +e
          printf 'main::(){x:=1;}' | "$jaifmt" --stdin > fmt.out
          status=$?
          set -e
          formatted="$(tr -d '\r' < fmt.out)"
          echo "$formatted"
          test "$status" = 0
          test "$formatted" = "$(printf 'main :: () {\n    x := 1;\n}')"
          # Built for the baseline x86-64 CPU, not this runner's: the archive runs on machines
          # without AVX (the 0.4.1 jaifmt had AVX-512 and died with SIGILL on other runners).
          # The `*_wide` byte searches are the exception: they are AVX2 and only reached through
          # a table that picks them when the CPU has AVX2 (Extensions/Byte_Search).
          if [ "${{ matrix.name }}" = "linux-x64" ]; then
            if objdump -d "$jaifmt" | awk '/>:$/ { symbol = $0; next }
                symbol !~ /_wide/ && /%[yz]mm|\{%k[0-7]\}/ { print symbol; print; found = 1; exit }
                END { exit !found }'; then
              echo "jaifmt uses instructions beyond baseline x86-64"; exit 1
            fi
          fi
          set +e
          "$jaic" main.jai -interp
          status=$?
          set -e
          test "$status" = 42
          # jailint finds the packaged stdlib next to itself.
          "$jailint" -D warnings main.jai
          # Bindings_Generator runs from the archive alone: its helper library and libclang
          # (the Xcode toolchain's on macOS) are found without a checkout (#26, #27).
          printf 'typedef struct Pair { int a; float b; } Pair;\n' > bindings.h
          printf '%s\n' '#import "Basic";' '#import "Bindings_Generator";' '#import "Compiler";' \
            '#run {' '    set_build_options_dc(.{do_output = false});' '    options: Generate_Bindings_Options;' \
            '    array_add(*options.source_files, "bindings.h");' '    options.generate_library_declarations = false;' \
            '    assert(generate_bindings(options, "bindings.jai"));' '}' > generate.jai
          "$jaic" generate.jai
          grep -q 'Pair :: struct' bindings.jai
          if [ -n "${{ matrix.llvm }}" ]; then
            "$jaic" main.jai -exe main
            set +e
            ./main$exe
            status=$?
            set -e
            test "$status" = 42
          fi
          # WebGPU programs need nothing beyond the archive: the triangle example links the
          # packaged static wgpu-native, and `jaic -interp` loads the packaged shared one (exit 77:
          # the runner has no GPU adapter, which still proves the library loaded).
          cp "$GITHUB_WORKSPACE/examples/webgpu/triangle.jai" "$GITHUB_WORKSPACE/stdlib/Extensions/WebGPU/tests/headless.jai" .
          if [ -n "${{ matrix.llvm }}" ]; then
            "$jaic" triangle.jai -exe triangle
            ls -l triangle$exe
          fi
          set +e
          "$jaic" headless.jai -interp
          status=$?
          set -e
          test "$status" = 0 || test "$status" = 77
          # SDL3 is source-built and packaged on all six current release targets. Audit every
          # declared runtime export and artifact hash, then compile/run ABI + headless tests
          # with the packaged static archive, outside the checkout and without system SDL3.
          python3 "$GITHUB_WORKSPACE/tools/bindings/run_sdl3.py" --jaic "$jaic" \
            --native "$GITHUB_WORKSPACE/$PACKAGE_DIR/native-libs/${{ matrix.name }}" \
            --platform "${{ matrix.name }}" --work "$work/sdl3"
          # Simp and the stb libraries need nothing beyond the archive either: `jaic -interp` loads
          # the packaged shared libraries, and the built executable links the static ones.
          cp "$GITHUB_WORKSPACE/stdlib/Simp/tests/image.jai" simp-image.jai
          "$jaic" simp-image.jai -interp
          if [ -n "${{ matrix.llvm }}" ]; then
            "$jaic" simp-image.jai -exe simp-image
            ./simp-image$exe
          fi
          # The other shipped libraries, with the stdlib's own runtime tests: FreeType (a BDF font
          # in memory), Dear ImGui (frames with no window), MojoShader (bytecode to GLSL), and on
          # Windows x64 SDL2 (its import library and DLL from the official release).
          # Sound_Player's own device test also runs without a device (jai_audio_output).
          libs=(stdlib/freetype/tests/bdf-glyph.jai stdlib/ImGui/tests/headless-frames.jai stdlib/MojoShader/tests/translate.jai stdlib/Sound_Player/tests/device-lifecycle.jai)
          if [ "${{ matrix.name }}" = "windows-x64" ]; then libs+=(stdlib/SDL/tests/geometry-timer.jai); fi
          for lib_path in "${libs[@]}"; do
            lib_test=$(basename "$lib_path" .jai)
            cp "$GITHUB_WORKSPACE/$lib_path" .
            "$jaic" "$lib_test.jai" -interp
            if [ -n "${{ matrix.llvm }}" ]; then
              "$jaic" "$lib_test.jai" -exe "$lib_test"
              # Executables load SDL2.dll from their own directory.
              if [ -f "$GITHUB_WORKSPACE/$PACKAGE_DIR/native-libs/${{ matrix.name }}/SDL2.dll" ]; then
                cp "$GITHUB_WORKSPACE/$PACKAGE_DIR/native-libs/${{ matrix.name }}/SDL2.dll" .
              fi
              "./$lib_test$exe"
            fi
          done
          # The allocator (rpmalloc and the callback context it binds; macOS and Linux) and, on
          # Linux, the X11 clipboard library, which needs a display to run, so it is only linked.
          if [ "$RUNNER_OS" != "Windows" ]; then
            cp "$GITHUB_WORKSPACE/tools/ci/native-smoke/rpmalloc.jai" rpmalloc-smoke.jai
            "$jaic" rpmalloc-smoke.jai -interp
            if [ -n "${{ matrix.llvm }}" ]; then
              "$jaic" rpmalloc-smoke.jai -exe rpmalloc-smoke
              ./rpmalloc-smoke
            fi
          fi
          if [ "$RUNNER_OS" = "Linux" ] && [ -n "${{ matrix.llvm }}" ]; then
            cp "$GITHUB_WORKSPACE/tools/ci/native-smoke/clipboard.jai" clipboard-link.jai
            "$jaic" clipboard-link.jai -exe clipboard-link
          fi
          # Windows without Clang on PATH, where Git's coreutils `link` is in /usr/bin: jaic
          # skips it and links with Visual Studio's link.exe (0.4.2: `link: extra operand`).
          if [ "$RUNNER_OS" = "Windows" ]; then
            (
              PATH="$(echo "$PATH" | tr ':' '\n' | grep -vi llvm | paste -sd:)"
              export PATH
              which -a link
              "$jaic" simp-image.jai -exe simp-image-msvc
              ./simp-image-msvc.exe
            )
          fi
          # (`! cmd` would not stop the script: `set -e` ignores a negated command.)
          if [ "$RUNNER_OS" = "macOS" ]; then
            otool -L "$jaic"
            if otool -L "$jaic" | grep -E '/opt/homebrew|/usr/local|@rpath'; then
              echo "jaic links a library outside the system"; exit 1
            fi
          fi
          if [ "$RUNNER_OS" = "Linux" ]; then
            ldd "$jaic"
            if ldd "$jaic" | grep -i llvm; then echo "jaic links a shared LLVM"; exit 1; fi
          fi
          # Installed the usual way: unpacked elsewhere, linked from a bin folder, with no
          # checkout to fall back on (the build's own stdlib path is baked in as the fallback).
          if [ "$RUNNER_OS" != "Windows" ]; then
            mv "$GITHUB_WORKSPACE/stdlib" "$GITHUB_WORKSPACE/stdlib.hidden"
            cp -R "$GITHUB_WORKSPACE/$PACKAGE_DIR" "$RUNNER_TEMP/opt-jaic"
            mkdir -p "$RUNNER_TEMP/bin"
            ln -s "$RUNNER_TEMP/opt-jaic/jaic" "$RUNNER_TEMP/bin/jaic"
            set +e
            "$RUNNER_TEMP/bin/jaic" main.jai -interp
            status=$?
            # The native libraries are found beside the real stdlib behind the symlink.
            "$RUNNER_TEMP/bin/jaic" simp-image.jai -interp
            simp_status=$?
            # jaifmt is self-contained: it needs neither the stdlib nor a checkout.
            ln -s "$RUNNER_TEMP/opt-jaic/jaifmt" "$RUNNER_TEMP/bin/jaifmt"
            linked_fmt="$(printf 'main::(){x:=1;}' | "$RUNNER_TEMP/bin/jaifmt" --stdin)"
            fmt_status=$?
            set -e
            mv "$GITHUB_WORKSPACE/stdlib.hidden" "$GITHUB_WORKSPACE/stdlib"
            test "$status" = 42
            test "$simp_status" = 0
            test "$fmt_status" = 0
            test "$linked_fmt" = "$formatted"
          fi
      # What a user does first, on the archive that is about to be published: `jacket new`,
      # `build`, `run` and a language-server hover (the post-release smoke test's project check).
      # Catches a tool or library the archive lacks before the release exists.
      - name: Smoke test a new project with the packaged tools
        shell: bash
        run: python3 tools/ci/release_smoke.py project --bin "$PWD/$PACKAGE_DIR"
      # generate_bindings on a C header and on the C++ class of issue 26, with the packaged tools
      # outside the checkout: a helper library the archive lacks fails here.
      - name: Smoke test Bindings_Generator with the packaged tools
        shell: bash
        run: python3 tools/ci/release_smoke.py bindings --bin "$PWD/$PACKAGE_DIR"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

  # The VS Code extension can have an editor-only version while pinning the compiler release's
  # archive checksums (docs/tools/vscode-extension.md).
  vscode:
    needs: [release-meta, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TOOLCHAIN_VERSION: ${{ needs.release-meta.outputs.version }}
      EDITOR_VERSION: ${{ needs.release-meta.outputs.editor_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: archives
          merge-multiple: true
      - name: Validate dependency ages before installing
        working-directory: editors/vscode
        run: node scripts/check-dependency-age.ts
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: editors/vscode/package.json
      - name: Package
        working-directory: editors/vscode
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          npm pkg set version="$EDITOR_VERSION"
          python3 ../../tools/ci/toolchain_manifest.py --version "$TOOLCHAIN_VERSION" --archives ../../archives --out toolchain-manifest.json
          test "$(node -p 'require("./package.json").version')" = "$EDITOR_VERSION"
          test "$(node -p 'require("./toolchain-manifest.json").version')" = "$TOOLCHAIN_VERSION"
          pnpm run package -o "jacket-vscode-$EDITOR_VERSION.vsix"
          mkdir -p ../../vsix && mv "jacket-vscode-$EDITOR_VERSION.vsix" ../../vsix/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vscode-extension
          path: vsix/*.vsix
          if-no-files-found: error

  publish:
    needs: [release-meta, validate-release, build, vscode]
    if: >-
      needs.release-meta.outputs.is_current_release == 'true' &&
      (github.event_name == 'workflow_dispatch' || !github.event.forced)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ needs.release-meta.outputs.tag }}
        run: |
          tag="$TAG"
          python3 tools/ci/release_notes.py "$tag" > notes.md
          python3 tools/ci/toolchain_manifest.py --version "$tag" --archives dist --out dist/toolchain-manifest.json
          (cd dist && sha256sum -- * > SHA256SUMS)
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_VERSION: ${{ needs.release-meta.outputs.version }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isImmutable > release.json 2> release-error.txt; then
            if [ "$(node -p 'require("./release.json").isImmutable')" = "true" ]; then
              echo "GitHub release $TAG is immutable; its archives and checksums cannot be replaced safely." >&2
              exit 1
            fi
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            if [ "$TAG" = "v$CURRENT_VERSION" ]; then
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "Jacket ${TAG#v}" --notes-file notes.md --latest
            else
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "Jacket ${TAG#v}" --notes-file notes.md
            fi
          elif grep -qi 'release not found' release-error.txt; then
            if [ "$TAG" = "v$CURRENT_VERSION" ]; then
              gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "Jacket ${TAG#v}" --notes-file notes.md --latest --verify-tag
            else
              gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "Jacket ${TAG#v}" --notes-file notes.md --latest=false --verify-tag
            fi
          else
            cat release-error.txt >&2
            exit 1
          fi

  # Extension stores are only updated for the current compiler release. Historical compiler
  # rebuilds still attach a freshly checksum-pinned VSIX to GitHub, without republishing old,
  # immutable store versions.
  editor-store:
    name: editor-store (${{ matrix.store }})
    needs: [release-meta, vscode, publish]
    if: needs.release-meta.outputs.publish_editor_stores == 'true'
    strategy:
      fail-fast: false
      matrix:
        store: [marketplace, open-vsx]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Validate dependency ages before installing
        run: node scripts/check-dependency-age.ts
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: editors/vscode/package.json
      - name: Install vsce and ovsx
        run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vscode-extension
          path: vsix
      - name: Publish to the VS Code Marketplace
        if: matrix.store == 'marketplace'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then echo "VSCE_PAT is not set; skipping the Marketplace"; exit 0; fi
          vsix="$(ls ../../vsix/jacket-vscode-*.vsix)"
          # vsce reads the token from VSCE_PAT.
          pnpm exec vsce publish --packagePath "$vsix" --skip-duplicate
      - name: Publish to Open VSX
        if: matrix.store == 'open-vsx'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then echo "OVSX_PAT is not set; skipping Open VSX"; exit 0; fi
          vsix="$(ls ../../vsix/jacket-vscode-*.vsix)"
          # The namespace (package.json's publisher) must exist before the first publish. Creating
          # it again fails with "Namespace already exists", which is the state we want.
          if ! out="$(pnpm exec ovsx create-namespace matteopolak -p "$OVSX_PAT" 2>&1)"; then
            echo "$out"
            echo "$out" | grep -qi "already exists" || exit 1
          else
            echo "$out"
          fi
          pnpm exec ovsx publish "$vsix" -p "$OVSX_PAT" --skip-duplicate

  # Package managers (docs/tools/releases.md). After the GitHub release, the Homebrew
  # formula is rendered from the tag and the release's own SHA256SUMS
  # by tools/dev/render_packages.py, validated, and published when their secret is set (otherwise the
  # job says it skipped). They run after `publish`, so a failure here never holds up the release.
  # A run without a tag renders and validates from this run's archives and publishes nothing.
  homebrew:
    needs: [release-meta, build, publish]
    if: >-
      needs.release-meta.outputs.publish_stores == 'true' &&
      (needs.release-meta.outputs.is_current_release == 'true' || needs.release-meta.outputs.dry_run == 'true') &&
      !cancelled() && needs.build.result == 'success' &&
      (needs.publish.result == 'success' || (needs.publish.result == 'skipped' && needs.release-meta.outputs.dry_run == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TAG: ${{ needs.release-meta.outputs.tag }}
      VERSION: ${{ needs.release-meta.outputs.version }}
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      HOMEBREW_NO_ENV_HINTS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: env.TAG == ''
        with:
          pattern: '*64'
          path: archives
          merge-multiple: true
      - name: Render the formula from the release's version and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$TAG" ]; then
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p SHA256SUMS -D "$RUNNER_TEMP"
            source=(--sums "$RUNNER_TEMP/SHA256SUMS")
          else
            source=(--archives archives)
          fi
          python3 tools/dev/render_packages.py --version "$VERSION" "${source[@]}" --out "$RUNNER_TEMP/packages"
          cat "$RUNNER_TEMP/packages/homebrew/jacket.rb"
      - name: Validate the formula (and, for a release, install and test it)
        run: |
          # The URLs exist only once the release does, so a dry run only audits.
          mode=audit; [ -n "$TAG" ] && mode=install
          bash tools/ci/check_formula.sh "$RUNNER_TEMP/packages/homebrew/jacket.rb" jairelease/local "$mode"
      # The tap may hold only a README: the first push creates Formula/.
      - name: Push the formula to matteopolak/homebrew-tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAG" ]; then echo "No tag (dry run); not pushing the formula"; exit 0; fi
          if [ -z "$TAP_TOKEN" ]; then echo "HOMEBREW_TAP_TOKEN is not set; skipping the Homebrew tap"; exit 0; fi
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/matteopolak/homebrew-tap.git" "$RUNNER_TEMP/tap"
          cd "$RUNNER_TEMP/tap"
          mkdir -p Formula
          cp "$RUNNER_TEMP/packages/homebrew/jacket.rb" Formula/jacket.rb
          # The formula was called jai before 0.18.0; the rename lets `brew upgrade` move old installs.
          git rm -q --ignore-unmatch Formula/jai.rb
          echo '{ "jai": "jacket" }' > formula_renames.json
          git add Formula/jacket.rb formula_renames.json
          if git diff --cached --quiet; then echo "Formula/jacket.rb is already at $VERSION"; exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "jacket $VERSION"
          git push origin HEAD
          echo "Pushed jacket $VERSION to matteopolak/homebrew-tap"

  # The Neovim plugin (editors/nvim) is mirrored to matteopolak/jacket.nvim, because vim.pack and
  # plugin managers need a repository whose root is the plugin. The mirror's main branch is
  # replaced by the plugin's files with its version and the release's toolchain manifest stamped in, and
  # tagged vX.Y.Z. It pushes only when the NVIM_MIRROR_DEPLOY_KEY secret (a write-enabled
  # deploy key of that repository) is set; see docs/tools/neovim-plugin.md#publishing.
  neovim:
    needs: [release-meta, build, publish, vscode]
    if: >-
      needs.release-meta.outputs.publish_stores == 'true' &&
      (needs.release-meta.outputs.is_current_release == 'true' || needs.release-meta.outputs.dry_run == 'true') &&
      (github.event_name == 'push' ||
       (needs.release-meta.outputs.editor_pinned == 'true' && needs.vscode.result == 'success') ||
       (needs.release-meta.outputs.dry_run == 'true' && needs.release-meta.outputs.editor_pinned == 'false')) &&
      !cancelled() && needs.build.result == 'success' &&
      (needs.publish.result == 'success' || (needs.publish.result == 'skipped' && needs.release-meta.outputs.dry_run == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TAG: ${{ needs.release-meta.outputs.tag }}
      VERSION: ${{ needs.release-meta.outputs.version }}
      EDITOR_VERSION: ${{ needs.release-meta.outputs.editor_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Stamp the version and the release's toolchain manifest into the plugin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The plugin downloads the compiler version; its mirror tag can advance separately.
          cd editors/nvim
          sed -i "s/^return '.*'$/return '$VERSION'/" lua/jai/version.lua
          grep -q "^return '$VERSION'$" lua/jai/version.lua
          if [ -n "$TAG" ]; then
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p toolchain-manifest.json -D .
            cat toolchain-manifest.json
          fi
      - name: Push to matteopolak/jacket.nvim
        env:
          DEPLOY_KEY: ${{ secrets.NVIM_MIRROR_DEPLOY_KEY }}
        run: |
          if [ -z "$TAG" ]; then echo "No tag (dry run); not pushing the plugin"; exit 0; fi
          if [ -z "$DEPLOY_KEY" ]; then echo "NVIM_MIRROR_DEPLOY_KEY is not set; skipping the Neovim plugin mirror"; exit 0; fi
          key="$RUNNER_TEMP/mirror_key"
          known="$RUNNER_TEMP/known_hosts"
          printf '%s\n' "$DEPLOY_KEY" > "$key"
          chmod 600 "$key"
          # GitHub's published ed25519 host key fingerprint, so the push cannot go to an impostor.
          ssh-keyscan -t ed25519 github.com > "$known" 2> /dev/null
          ssh-keygen -lf "$known" | grep -q 'SHA256:+DiY3wvvV6TuJJhbpZisF/zLDA0zPMSvHdkr4UvCOqU' || { echo "unexpected github.com host key"; exit 1; }
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o UserKnownHostsFile=$known -o StrictHostKeyChecking=yes"
          git clone git@github.com:matteopolak/jacket.nvim.git "$RUNNER_TEMP/mirror"
          cd "$RUNNER_TEMP/mirror"
          git checkout -B main
          git rm -rq --ignore-unmatch .
          cp -R "$GITHUB_WORKSPACE/editors/nvim/." .
          cp "$GITHUB_WORKSPACE/LICENSE" "$GITHUB_WORKSPACE/LICENSE-EXCEPTION" .
          git add -A
          if git diff --cached --quiet; then
            echo "The mirror already has this content"
          else
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -q -m "jacket.nvim $EDITOR_VERSION (toolchain $VERSION)"
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$EDITOR_VERSION" > /dev/null; then
            git fetch -q origin "refs/tags/v$EDITOR_VERSION:refs/tags/v$EDITOR_VERSION"
            tagged_commit="$(git rev-parse "refs/tags/v$EDITOR_VERSION^{commit}")"
            current_commit="$(git rev-parse HEAD)"
            test "$tagged_commit" = "$current_commit" || {
              echo "Mirror tag v$EDITOR_VERSION already points to different plugin content; publish a new editor_version instead of retagging." >&2
              exit 1
            }
            echo "The mirror tag v$EDITOR_VERSION already points to this content"
            git push origin main
          else
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              tag -a "v$EDITOR_VERSION" -m "jacket.nvim $EDITOR_VERSION (toolchain $VERSION)"
            git push origin main "v$EDITOR_VERSION"
          fi
          echo "Pushed jacket.nvim $EDITOR_VERSION for toolchain $VERSION to matteopolak/jacket.nvim"
