name: release
# Builds jaic, jailsp, jailint and jaifmt for macOS (Apple silicon and Intel), Linux (x86-64 and arm64) and
# Windows (x86-64 and arm64), optimized with PGO (except Windows arm64) and BOLT on Linux x86-64
# (tools/build_pgo.py, docs/tools/pgo-and-bolt.md).
# A `v*` tag push publishes a GitHub release with the archives and the tag's CHANGELOG.md section;
# a manual run without a tag only builds and smoke-tests the archives (kept as workflow artifacts).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish_integrations:
        description: Publish external editor and package integrations
        type: boolean
        required: false
        default: false
      tag:
        description: Existing tag to publish (empty = build and test only)
        required: false
        default: ''
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: '0'
  LLVM_VERSION: 23.1.2
jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            runner: macos-15
            llvm: LLVM-23.1.2-macOS-ARM64.tar.xz
          # LLVM publishes no Intel macOS build: conda-forge's static libraries instead
          # (tools/install_ci_llvm_macos.sh --static).
          - name: macos-x64
            runner: macos-15-intel
            llvm: conda-forge
          - name: linux-x64
            runner: ubuntu-24.04
            llvm: LLVM-23.1.2-Linux-X64.tar.xz
            bolt: true
          # No BOLT: Ubuntu's arm64 linker adds Cortex-A53 erratum 843419 veneers, which llvm-bolt
          # refuses to keep; dropping them would break the binary on Cortex-A53 (Raspberry Pi 3).
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            llvm: LLVM-23.1.2-Linux-ARM64.tar.xz
          - name: windows-x64
            runner: windows-2025
            llvm: clang+llvm-23.1.2-x86_64-pc-windows-msvc.tar.xz
            rust_target: x86_64-pc-windows-msvc
          - name: windows-arm64
            runner: windows-11-arm
            llvm: clang+llvm-23.1.2-aarch64-pc-windows-msvc.tar.xz
            rust_target: aarch64-pc-windows-msvc
    if: github.event_name != 'push' || !github.event.forced
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      # llvm-tools: the llvm-profdata that matches rustc's LLVM, to merge the PGO profiles.
      - name: Install the pinned toolchain
        run: rustup toolchain install nightly-2026-08-29 --profile minimal --component llvm-tools
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Validate dependency ages before building
        # Read-only GitHub API access for the commit dates of pinned git dependencies.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/check_dependency_age.py
      - name: Install the official LLVM release (static libraries)
        if: matrix.llvm != '' && matrix.llvm != 'conda-forge'
        run: |
          curl -fsSL -o llvm.tar.xz "https://github.com/llvm/llvm-project/releases/download/llvmorg-$LLVM_VERSION/${{ matrix.llvm }}"
          llvm="$RUNNER_TEMP/llvm"
          prefix="$llvm"
          if [ "$RUNNER_OS" = "Windows" ]; then
            # GNU tar reads `D:\...` as a remote host; Cargo and llvm-config want `D:/...`.
            llvm="$(cygpath -u "$RUNNER_TEMP")/llvm"
            prefix="$(cygpath -m "$llvm")"
          fi
          mkdir -p "$llvm"
          tar -xJf llvm.tar.xz -C "$llvm" --strip-components=1
          rm llvm.tar.xz
          echo "LLVM_SYS_231_PREFIX=$prefix" >> "$GITHUB_ENV"
          "$llvm/bin/llvm-config" --version
          echo "system libraries: $("$llvm/bin/llvm-config" --link-static --system-libs)"
      # The official macOS LLVM names Homebrew's static zstd (/opt/homebrew/lib/libzstd.a) in its
      # system libraries; linking the archive leaves no runtime dependency on Homebrew.
      # Its static libraries are LTO bitcode that Xcode's ld cannot read, so link with the
      # release's own clang and lld (which run that LTO) against the Xcode SDK. The release also
      # ships its own libc++ (static, and a dylib found through @rpath); removing it makes `-lc++`
      # link the system's /usr/lib/libc++.1.dylib from the SDK.
      - name: Install static zstd and link with LLVM's lld (macOS arm64)
        if: runner.os == 'macOS' && matrix.llvm != 'conda-forge'
        run: |
          brew install zstd
          ls -l /opt/homebrew/lib/libzstd.a
          # llvm-sys turns that absolute path into `-L/opt/homebrew/lib -lzstd`, for which ld
          # prefers the dylib beside the archive (and jaic would then need Homebrew's zstd at run
          # time). Without the dylib links in that folder, the archive is linked.
          rm -f /opt/homebrew/lib/libzstd*.dylib
          ls "$RUNNER_TEMP/llvm/bin/ld64.lld"
          find "$RUNNER_TEMP/llvm/lib" \( -name 'libc++*' -o -name 'libunwind*' \) -print -delete
          echo "SDKROOT=$(xcrun --show-sdk-path)" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_APPLE_DARWIN_LINKER=$RUNNER_TEMP/llvm/bin/clang" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_APPLE_DARWIN_RUSTFLAGS=-C link-arg=-fuse-ld=lld" >> "$GITHUB_ENV"
      # conda-forge's LLVM for osx-64 (static libraries of ordinary objects, which Xcode's ld
      # links) with its static zstd and libc++; the script deletes the environment's dylibs, so
      # `-lz -lxml2 -liconv` link the system's and `-lzstd -lc++` the archives. The static libc++ needs the system's libc++abi. Nothing points into the
      # runner's temp directory afterwards (the smoke test's otool check).
      - name: Install conda-forge's static LLVM (macOS x64)
        if: matrix.llvm == 'conda-forge'
        run: |
          tools/install_ci_llvm_macos.sh --static
          echo "CARGO_TARGET_X86_64_APPLE_DARWIN_RUSTFLAGS=-C link-arg=-lc++abi" >> "$GITHUB_ENV"
      # The Windows release's llvm-config names static libraries the archive lacks (libxml2,
      # and zstd by an absolute build-machine path llvm-sys cannot parse); prepare.sh supplies
      # them and an llvm-config front (docs/tools/llvm-setup.md). The release is built against
      # the static C runtime (/MT), so jaic must be too, or it crashes at run time.
      # The release's clang (on PATH) is the smoke test's linker driver.
      - name: Prepare LLVM and use the static CRT (Windows)
        if: runner.os == 'Windows'
        run: |
          llvm="$(cygpath -u "$RUNNER_TEMP")/llvm"
          bash tools/windows-llvm/prepare.sh "$llvm"
          # An explicit target keeps the flag off build scripts and proc macros.
          target="${{ matrix.rust_target }}"
          echo "CARGO_BUILD_TARGET=$target" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_$(echo "$target" | tr 'a-z-' 'A-Z_')_RUSTFLAGS=-C target-feature=+crt-static" >> "$GITHUB_ENV"
          echo "$(cygpath -w "$llvm/bin")" >> "$GITHUB_PATH"
      - name: Install static zlib and zstd (Linux)
        if: runner.os == 'Linux'
        # X11 and GL: Window_Creation, which the smoke test's WebGPU triangle links.
        timeout-minutes: 15
        run: |
          apt=(sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          "${apt[@]}" update && "${apt[@]}" install -y zlib1g-dev libzstd-dev libxml2-dev libx11-dev libgl-dev
      # Instrumented build, training run over this repository's tests and examples, then the
      # profile-guided build into target/pgo/dist. On Linux x86-64 the result is also rewritten by
      # the llvm-bolt that ships in the official LLVM release (elsewhere: PGO only).
      - name: Build (PGO, and BOLT on Linux x86-64)
        id: build
        run: |
          llvm=none
          if [ -n "${{ matrix.llvm }}" ]; then llvm=static; fi
          bolt=()
          if [ "${{ matrix.bolt }}" = true ]; then bolt=(--bolt --llvm-bin "$RUNNER_TEMP/llvm/bin"); fi
          python3 tools/build_pgo.py --llvm "$llvm" --jobs 4 "${bolt[@]}"
      - name: Show the failing link
        if: failure() && steps.build.outcome == 'failure' && matrix.llvm != ''
        run: cargo rustc --release --locked -p jaic-cli --bin jaic --no-default-features --features static-llvm -- -C link-args=-v 2>&1 | tail -60
      - name: Package
        run: |
          exe=""
          if [ "$RUNNER_OS" = "Windows" ]; then exe=".exe"; fi
          # jai-<platform> since 0.4.1 (0.4.0 and earlier shipped jaic-<platform>).
          dir="jai-${{ matrix.name }}"
          mkdir -p "$dir"
          out="target/pgo/dist"
          # Symbol tables are about a tenth of the macOS binary (docs/tools/releases.md,
          # "Binary size"). Stripped after PGO and BOLT, which need them. macOS: local symbols
          # only, then the ad-hoc signature arm64 requires is made again. Windows: the
          # symbols are in the .pdb, which the archive does not ship.
          case "$RUNNER_OS" in
            macOS) for t in jaic jailsp jailint; do strip -x "$out/$t"; codesign --force -s - "$out/$t"; done ;;
            Linux) for t in jaic jailsp jailint; do strip --strip-unneeded "$out/$t"; done ;;
          esac
          ls -l "$out"
          cp "$out/jaic$exe" "$out/jailsp$exe" "$out/jailint$exe" "$dir/"
          # stdlib/prelude/module.jai loads ../stdlib/prelude/module.jai.
          cp -R stdlib "$dir/stdlib"
          cp README.md CHANGELOG.md "$dir/"
          # wgpu-native for the WebGPU module (pinned and checksum-verified, tools/webgpu.json),
          # where jaic looks for native libraries: <stdlib>/../artifacts/native-libs/<platform>.
          # The static library is what `jaic build` links, the shared one what `jaic run` loads.
          python3 tools/fetch_wgpu_native.py --platform "${{ matrix.name }}" --out "$dir/artifacts/native-libs/${{ matrix.name }}"
          # The C libraries the stdlib binds (stb_image, stb_image_write, stb_image_resize,
          # stb_vorbis, lz4, meshoptimizer, pl_mpeg, FreeType, Dear ImGui and MojoShader; rpmalloc
          # on macOS and Linux; SDL2 on Windows x64), built from the pinned, checksum-verified
          # sources in tools/native-libs.json, static and shared like wgpu-native, each with its
          # licence under licenses/. Simp, GetRect, Sound_Player and the other modules need them.
          # The script stops when a file it should have left is missing. macOS: for the oldest
          # macOS the jaic binary runs on, not the runner's.
          if [ "$RUNNER_OS" = "macOS" ]; then
            export MACOSX_DEPLOYMENT_TARGET="${{ matrix.name == 'macos-x64' && '10.12' || '11.0' }}"
          fi
          python3 tools/build_native_libs.py --platform "${{ matrix.name }}" --out "$dir/artifacts/native-libs/${{ matrix.name }}"
          unset MACOSX_DEPLOYMENT_TARGET
          ls -l "$dir/artifacts/native-libs/${{ matrix.name }}"
          # jaifmt is a Jai program: built by the packaged jaic against the packaged stdlib, -O2
          # with the default checks (not jaifmt/build.jai's unchecked build), no debug files.
          "$dir/jaic$exe" build jaifmt/main.jai -O2 --no-debug-info -o "$dir/jaifmt"
          ls "$dir"
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip "$dir.zip" "$dir" > /dev/null
            echo "ARCHIVE=$dir.zip" >> "$GITHUB_ENV"
          else
            tar -czf "$dir.tar.gz" "$dir"
            echo "ARCHIVE=$dir.tar.gz" >> "$GITHUB_ENV"
          fi
          echo "PACKAGE_DIR=$dir" >> "$GITHUB_ENV"
      - name: Smoke test the packaged compiler outside the checkout
        run: |
          exe=""
          if [ "$RUNNER_OS" = "Windows" ]; then exe=".exe"; fi
          work="$RUNNER_TEMP/smoke"
          mkdir -p "$work"
          cp examples/compile-time-record.jai "$work/main.jai"
          jaic="$PWD/$PACKAGE_DIR/jaic$exe"
          jailint="$PWD/$PACKAGE_DIR/jailint$exe"
          jaifmt="$PWD/$PACKAGE_DIR/jaifmt$exe"
          cd "$work"
          # Input without a final newline, as Homebrew's formula test sends it; the exit status
          # is checked too (a crash prints nothing, which an output check alone could miss).
          set +e
          printf 'main::(){x:=1;}' | "$jaifmt" --stdin > fmt.out
          status=$?
          set -e
          formatted="$(tr -d '\r' < fmt.out)"
          echo "$formatted"
          test "$status" = 0
          test "$formatted" = "$(printf 'main :: () {\n    x := 1;\n}')"
          # Built for the baseline x86-64 CPU, not this runner's: the archive runs on machines
          # without AVX (the 0.4.1 jaifmt had AVX-512 and died with SIGILL on other runners).
          if [ "${{ matrix.name }}" = "linux-x64" ]; then
            if objdump -d "$jaifmt" | grep -E -m 5 '%[yz]mm|\{%k[0-7]\}'; then
              echo "jaifmt uses instructions beyond baseline x86-64"; exit 1
            fi
          fi
          set +e
          "$jaic" run main.jai
          status=$?
          set -e
          test "$status" = 42
          # jailint finds the packaged stdlib next to itself.
          "$jailint" -D warnings main.jai
          if [ -n "${{ matrix.llvm }}" ]; then
            "$jaic" build main.jai -o main
            set +e
            ./main$exe
            status=$?
            set -e
            test "$status" = 42
          fi
          # WebGPU programs need nothing beyond the archive: the triangle example links the
          # packaged static wgpu-native, and `jaic run` loads the packaged shared one (exit 77:
          # the runner has no GPU adapter, which still proves the library loaded).
          cp "$GITHUB_WORKSPACE/examples/webgpu/triangle.jai" "$GITHUB_WORKSPACE/tests/webgpu/headless.jai" .
          if [ -n "${{ matrix.llvm }}" ]; then
            "$jaic" build triangle.jai -o triangle
            ls -l triangle$exe
          fi
          set +e
          "$jaic" run headless.jai
          status=$?
          set -e
          test "$status" = 0 || test "$status" = 77
          # Simp and the stb libraries need nothing beyond the archive either: `jaic run` loads
          # the packaged shared libraries, and the built executable links the static ones.
          cp "$GITHUB_WORKSPACE/tests/native-libs/simp-image.jai" .
          "$jaic" run simp-image.jai
          if [ -n "${{ matrix.llvm }}" ]; then
            "$jaic" build simp-image.jai -o simp-image
            ./simp-image$exe
          fi
          # The other shipped libraries, with the stdlib's own runtime tests: FreeType (a BDF font
          # in memory), Dear ImGui (frames with no window), MojoShader (bytecode to GLSL), and on
          # Windows x64 SDL2 (its import library and DLL from the official release).
          libs=(freetype-bdf-glyph imgui-headless-frames mojoshader-translate)
          if [ "${{ matrix.name }}" = "windows-x64" ]; then libs+=(sdl2-geometry-timer); fi
          for lib_test in "${libs[@]}"; do
            cp "$GITHUB_WORKSPACE/tests/stdlib/$lib_test.jai" .
            "$jaic" run "$lib_test.jai"
            if [ -n "${{ matrix.llvm }}" ]; then
              "$jaic" build "$lib_test.jai" -o "$lib_test"
              # Executables load SDL2.dll from their own directory.
              if [ -f "$GITHUB_WORKSPACE/$PACKAGE_DIR/artifacts/native-libs/${{ matrix.name }}/SDL2.dll" ]; then
                cp "$GITHUB_WORKSPACE/$PACKAGE_DIR/artifacts/native-libs/${{ matrix.name }}/SDL2.dll" .
              fi
              "./$lib_test$exe"
            fi
          done
          # Windows without Clang on PATH, where Git's coreutils `link` is in /usr/bin: jaic
          # skips it and links with Visual Studio's link.exe (0.4.2: `link: extra operand`).
          if [ "$RUNNER_OS" = "Windows" ]; then
            (
              PATH="$(echo "$PATH" | tr ':' '\n' | grep -vi llvm | paste -sd:)"
              export PATH
              which -a link
              "$jaic" build simp-image.jai -o simp-image-msvc
              ./simp-image-msvc.exe
            )
          fi
          # (`! cmd` would not stop the script: `set -e` ignores a negated command.)
          if [ "$RUNNER_OS" = "macOS" ]; then
            otool -L "$jaic"
            if otool -L "$jaic" | grep -E '/opt/homebrew|/usr/local|@rpath'; then
              echo "jaic links a library outside the system"; exit 1
            fi
          fi
          if [ "$RUNNER_OS" = "Linux" ]; then
            ldd "$jaic"
            if ldd "$jaic" | grep -i llvm; then echo "jaic links a shared LLVM"; exit 1; fi
          fi
          # Installed the usual way: unpacked elsewhere, linked from a bin folder, with no
          # checkout to fall back on (the build's own stdlib path is baked in as the fallback).
          if [ "$RUNNER_OS" != "Windows" ]; then
            mv "$GITHUB_WORKSPACE/stdlib" "$GITHUB_WORKSPACE/stdlib.hidden"
            cp -R "$GITHUB_WORKSPACE/$PACKAGE_DIR" "$RUNNER_TEMP/opt-jaic"
            mkdir -p "$RUNNER_TEMP/bin"
            ln -s "$RUNNER_TEMP/opt-jaic/jaic" "$RUNNER_TEMP/bin/jaic"
            set +e
            "$RUNNER_TEMP/bin/jaic" run main.jai
            status=$?
            # The native libraries are found beside the real stdlib behind the symlink.
            "$RUNNER_TEMP/bin/jaic" run simp-image.jai
            simp_status=$?
            # jaifmt is self-contained: it needs neither the stdlib nor a checkout.
            ln -s "$RUNNER_TEMP/opt-jaic/jaifmt" "$RUNNER_TEMP/bin/jaifmt"
            linked_fmt="$(printf 'main::(){x:=1;}' | "$RUNNER_TEMP/bin/jaifmt" --stdin)"
            fmt_status=$?
            set -e
            mv "$GITHUB_WORKSPACE/stdlib.hidden" "$GITHUB_WORKSPACE/stdlib"
            test "$status" = 42
            test "$simp_status" = 0
            test "$fmt_status" = 0
            test "$linked_fmt" = "$formatted"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

  # The VS Code extension, versioned like the release and pinned to the SHA-256 of the archives
  # the build jobs just made, so it downloads exactly those (docs/tools/vscode-extension.md).
  vscode:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: archives
          merge-multiple: true
      - name: Version from the tag (or Cargo.toml for a dry run)
        run: |
          cargo_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          tag="${{ inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}"
          version="${tag#v}"
          if [ -z "$version" ]; then version="$cargo_version"; fi
          # The extension downloads jaic v<its version>, so the two must agree.
          test "$version" = "$cargo_version" || { echo "tag $tag does not match Cargo.toml version $cargo_version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Validate dependency ages before installing
        working-directory: editors/vscode
        run: node scripts/check-dependency-age.ts
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: editors/vscode/package.json
      - name: Package
        working-directory: editors/vscode
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          node scripts/pin-toolchain.ts --version "$VERSION" --archives ../../archives
          test "$(node -p 'require("./package.json").version')" = "$VERSION"
          pnpm run package -o "jai-vscode-$VERSION.vsix"
          mkdir -p ../../vsix && mv "jai-vscode-$VERSION.vsix" ../../vsix/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vscode-extension
          path: vsix/*.vsix
          if-no-files-found: error

  publish:
    needs: [build, vscode]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version="${tag#v}"
          # The section under "## [version]" up to the next "## [".
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $version"; exit 1; }
          (cd dist && sha256sum * > SHA256SUMS)
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "Jai Toolchain ${TAG#v}" --notes-file notes.md --latest

  # The extension stores, each in its own job after the GitHub release: a store that is down or
  # rejects the upload fails only its job, never the release or the other store. Each publishes
  # only when its token is configured (repository secrets VSCE_PAT and OVSX_PAT; see
  # docs/tools/vscode-extension.md#publishing). --skip-duplicate makes re-running a tag harmless.
  marketplace:
    needs: [vscode, publish]
    if: >-
      inputs.publish_integrations &&
      (startsWith(github.ref, 'refs/tags/v') || inputs.tag != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Validate dependency ages before installing
        run: node scripts/check-dependency-age.ts
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: editors/vscode/package.json
      - name: Install vsce
        run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vscode-extension
          path: vsix
      - name: Publish to the VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then echo "VSCE_PAT is not set; skipping the Marketplace"; exit 0; fi
          vsix="$(ls ../../vsix/jai-vscode-*.vsix)"
          # vsce reads the token from VSCE_PAT.
          pnpm exec vsce publish --packagePath "$vsix" --skip-duplicate

  open-vsx:
    needs: [vscode, publish]
    if: >-
      inputs.publish_integrations &&
      (startsWith(github.ref, 'refs/tags/v') || inputs.tag != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Validate dependency ages before installing
        run: node scripts/check-dependency-age.ts
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: editors/vscode/package.json
      - name: Install ovsx
        run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vscode-extension
          path: vsix
      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then echo "OVSX_PAT is not set; skipping Open VSX"; exit 0; fi
          vsix="$(ls ../../vsix/jai-vscode-*.vsix)"
          # The namespace (package.json's publisher) must exist before the first publish. Creating
          # it again fails with "Namespace already exists", which is the state we want.
          if ! out="$(pnpm exec ovsx create-namespace matteopolak -p "$OVSX_PAT" 2>&1)"; then
            echo "$out"
            echo "$out" | grep -qi "already exists" || exit 1
          else
            echo "$out"
          fi
          pnpm exec ovsx publish "$vsix" -p "$OVSX_PAT" --skip-duplicate

  # Package managers (docs/tools/package-managers.md). After the GitHub release, the Homebrew
  # formula is rendered from the tag and the release's own SHA256SUMS
  # by tools/render_packages.py, validated, and published when their secret is set (otherwise the
  # job says it skipped). They run after `publish`, so a failure here never holds up the release.
  # A run without a tag renders and validates from this run's archives and publishes nothing.
  homebrew:
    needs: [build, publish]
    if: >-
      inputs.publish_integrations &&
      (!cancelled() && needs.build.result == 'success' && (needs.publish.result == 'success' || (needs.publish.result == 'skipped' && !startsWith(github.ref, 'refs/tags/v') && inputs.tag == '')))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      HOMEBREW_NO_ENV_HINTS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: env.TAG == ''
        with:
          pattern: '*64'
          path: archives
          merge-multiple: true
      - name: Render the formula from the release's version and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$TAG" ]; then
            version="${TAG#v}"
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p SHA256SUMS -D "$RUNNER_TEMP"
            source=(--sums "$RUNNER_TEMP/SHA256SUMS")
          else
            version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
            source=(--archives archives)
          fi
          python3 tools/render_packages.py --version "$version" "${source[@]}" --out "$RUNNER_TEMP/packages"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          cat "$RUNNER_TEMP/packages/homebrew/jai.rb"
      - name: Validate the formula (and, for a release, install and test it)
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew tap-new --no-git jairelease/local
          cp "$RUNNER_TEMP/packages/homebrew/jai.rb" "$(brew --repository jairelease/local)/Formula/jai.rb"
          brew trust jairelease/local 2> /dev/null || true
          brew style jairelease/local/jai
          if [ -z "$TAG" ]; then
            # The URLs exist only once the release does.
            brew audit --formula --strict jairelease/local/jai
          else
            brew audit --formula --strict --online jairelease/local/jai
            brew install --build-from-source jairelease/local/jai
            brew test jairelease/local/jai
          fi
      # The tap may hold only a README: the first push creates Formula/.
      - name: Push the formula to matteopolak/homebrew-tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAG" ]; then echo "No tag (dry run); not pushing the formula"; exit 0; fi
          if [ -z "$TAP_TOKEN" ]; then echo "HOMEBREW_TAP_TOKEN is not set; skipping the Homebrew tap"; exit 0; fi
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/matteopolak/homebrew-tap.git" "$RUNNER_TEMP/tap"
          cd "$RUNNER_TEMP/tap"
          mkdir -p Formula
          cp "$RUNNER_TEMP/packages/homebrew/jai.rb" Formula/jai.rb
          git add Formula/jai.rb
          if git diff --cached --quiet; then echo "Formula/jai.rb is already at $VERSION"; exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "jai $VERSION"
          git push origin HEAD
          echo "Pushed jai $VERSION to matteopolak/homebrew-tap"

  # The Neovim plugin (editors/nvim) is mirrored to matteopolak/jai.nvim, because vim.pack and
  # plugin managers need a repository whose root is the plugin. The mirror's main branch is
  # replaced by the plugin's files with its version and the release's checksums stamped in, and
  # tagged vX.Y.Z. It pushes only when the NVIM_MIRROR_DEPLOY_KEY secret (a write-enabled
  # deploy key of that repository) is set; see docs/tools/neovim-plugin.md#publishing.
  neovim:
    needs: [build, publish]
    if: >-
      inputs.publish_integrations &&
      (!cancelled() && needs.build.result == 'success' && (needs.publish.result == 'success' || (needs.publish.result == 'skipped' && !startsWith(github.ref, 'refs/tags/v') && inputs.tag == '')))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      - name: Stamp the version and the release's checksums into the plugin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cargo_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          version="${TAG#v}"
          if [ -z "$version" ]; then version="$cargo_version"; fi
          # The plugin downloads jaic v<its version>, so the two must agree.
          test "$version" = "$cargo_version" || { echo "tag $TAG does not match Cargo.toml version $cargo_version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
          cd editors/nvim
          sed -i "s/^return '.*'$/return '$version'/" lua/jai/version.lua
          grep -q "^return '$version'$" lua/jai/version.lua
          if [ -n "$TAG" ]; then
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p SHA256SUMS -D "$RUNNER_TEMP"
            {
              echo "---SHA-256 checksums of the release archives, written by the release workflow."
              echo "return {"
              echo "  version = '$version',"
              echo "  sha256 = {"
              awk '$2 ~ /^jai-.*\.(tar\.gz|zip)$/ { printf "    [\047%s\047] = \047%s\047,\n", $2, $1 }' "$RUNNER_TEMP/SHA256SUMS"
              echo "  },"
              echo "}"
            } > lua/jai/checksums.lua
            grep -c "jai-linux-x64.tar.gz" lua/jai/checksums.lua
            cat lua/jai/checksums.lua
          fi
      - name: Push to matteopolak/jai.nvim
        env:
          DEPLOY_KEY: ${{ secrets.NVIM_MIRROR_DEPLOY_KEY }}
        run: |
          if [ -z "$TAG" ]; then echo "No tag (dry run); not pushing the plugin"; exit 0; fi
          if [ -z "$DEPLOY_KEY" ]; then echo "NVIM_MIRROR_DEPLOY_KEY is not set; skipping the Neovim plugin mirror"; exit 0; fi
          key="$RUNNER_TEMP/mirror_key"
          known="$RUNNER_TEMP/known_hosts"
          printf '%s\n' "$DEPLOY_KEY" > "$key"
          chmod 600 "$key"
          # GitHub's published ed25519 host key fingerprint, so the push cannot go to an impostor.
          ssh-keyscan -t ed25519 github.com > "$known" 2> /dev/null
          ssh-keygen -lf "$known" | grep -q 'SHA256:+DiY3wvvV6TuJJhbpZisF/zLDA0zPMSvHdkr4UvCOqU' || { echo "unexpected github.com host key"; exit 1; }
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o UserKnownHostsFile=$known -o StrictHostKeyChecking=yes"
          git clone git@github.com:matteopolak/jai.nvim.git "$RUNNER_TEMP/mirror"
          cd "$RUNNER_TEMP/mirror"
          git checkout -B main
          git rm -rq --ignore-unmatch .
          cp -R "$GITHUB_WORKSPACE/editors/nvim/." .
          cp "$GITHUB_WORKSPACE/LICENSE" "$GITHUB_WORKSPACE/LICENSE-EXCEPTION" .
          git add -A
          if git diff --cached --quiet; then
            echo "The mirror already has this content"
          else
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -q -m "jai.nvim $VERSION"
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "The mirror already has the tag v$VERSION"
            git push origin main
          else
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              tag -a "v$VERSION" -m "jai.nvim $VERSION"
            git push origin main "v$VERSION"
          fi
          echo "Pushed jai.nvim $VERSION to matteopolak/jai.nvim"
