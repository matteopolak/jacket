name: release
# Builds jaic, jailsp, jailint and jaifmt for macOS (Apple silicon), Linux (x86-64) and Windows (x86-64 and arm64),
# optimized with PGO (except Windows arm64) and BOLT on Linux (tools/build_pgo.py, docs/tools/pgo-and-bolt.md).
# A `v*` tag push publishes a GitHub release with the archives and the tag's CHANGELOG.md section;
# a manual run without a tag only builds and smoke-tests the archives (kept as workflow artifacts).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish_integrations:
        description: Publish external editor and package integrations
        type: boolean
        required: false
        default: false
      tag:
        description: Existing tag to publish (empty = build and test only)
        required: false
        default: ''
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: '0'
  LLVM_VERSION: 23.1.2
jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            runner: macos-15
            llvm: LLVM-23.1.2-macOS-ARM64.tar.xz
          - name: linux-x64
            runner: ubuntu-24.04
            llvm: LLVM-23.1.2-Linux-X64.tar.xz
          - name: windows-x64
            runner: windows-2025
            llvm: clang+llvm-23.1.2-x86_64-pc-windows-msvc.tar.xz
            rust_target: x86_64-pc-windows-msvc
          - name: windows-arm64
            runner: windows-11-arm
            llvm: clang+llvm-23.1.2-aarch64-pc-windows-msvc.tar.xz
            rust_target: aarch64-pc-windows-msvc
    if: github.event_name != 'push' || !github.event.forced
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      # llvm-tools: the llvm-profdata that matches rustc's LLVM, to merge the PGO profiles.
      - name: Install the pinned toolchain
        run: rustup toolchain install nightly-2026-08-29 --profile minimal --component llvm-tools
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Validate dependency ages before building
        # Read-only GitHub API access for the commit dates of pinned git dependencies.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/check_dependency_age.py
      - name: Install the official LLVM release (static libraries)
        if: matrix.llvm != ''
        run: |
          curl -fsSL -o llvm.tar.xz "https://github.com/llvm/llvm-project/releases/download/llvmorg-$LLVM_VERSION/${{ matrix.llvm }}"
          llvm="$RUNNER_TEMP/llvm"
          prefix="$llvm"
          if [ "$RUNNER_OS" = "Windows" ]; then
            # GNU tar reads `D:\...` as a remote host; Cargo and llvm-config want `D:/...`.
            llvm="$(cygpath -u "$RUNNER_TEMP")/llvm"
            prefix="$(cygpath -m "$llvm")"
          fi
          mkdir -p "$llvm"
          tar -xJf llvm.tar.xz -C "$llvm" --strip-components=1
          rm llvm.tar.xz
          echo "LLVM_SYS_231_PREFIX=$prefix" >> "$GITHUB_ENV"
          "$llvm/bin/llvm-config" --version
          echo "system libraries: $("$llvm/bin/llvm-config" --link-static --system-libs)"
      # The official macOS LLVM names Homebrew's static zstd (/opt/homebrew/lib/libzstd.a) in its
      # system libraries; linking the archive leaves no runtime dependency on Homebrew.
      # Its static libraries are LTO bitcode that Xcode's ld cannot read, so link with the
      # release's own clang and lld (which run that LTO) against the Xcode SDK. The release also
      # ships its own libc++ (static, and a dylib found through @rpath); removing it makes `-lc++`
      # link the system's /usr/lib/libc++.1.dylib from the SDK.
      - name: Install static zstd and link with LLVM's lld (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install zstd
          ls -l /opt/homebrew/lib/libzstd.a
          # llvm-sys turns that absolute path into `-L/opt/homebrew/lib -lzstd`, for which ld
          # prefers the dylib beside the archive (and jaic would then need Homebrew's zstd at run
          # time). Without the dylib links in that folder, the archive is linked.
          rm -f /opt/homebrew/lib/libzstd*.dylib
          ls "$RUNNER_TEMP/llvm/bin/ld64.lld"
          find "$RUNNER_TEMP/llvm/lib" \( -name 'libc++*' -o -name 'libunwind*' \) -print -delete
          echo "SDKROOT=$(xcrun --show-sdk-path)" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_APPLE_DARWIN_LINKER=$RUNNER_TEMP/llvm/bin/clang" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_APPLE_DARWIN_RUSTFLAGS=-C link-arg=-fuse-ld=lld" >> "$GITHUB_ENV"
      # The Windows release's llvm-config names static libraries the archive lacks (libxml2,
      # and zstd by an absolute build-machine path llvm-sys cannot parse); prepare.sh supplies
      # them and an llvm-config front (docs/tools/llvm-setup.md). The release is built against
      # the static C runtime (/MT), so jaic must be too, or it crashes at run time.
      # The release's clang (on PATH) is the smoke test's linker driver.
      - name: Prepare LLVM and use the static CRT (Windows)
        if: runner.os == 'Windows'
        run: |
          llvm="$(cygpath -u "$RUNNER_TEMP")/llvm"
          bash tools/windows-llvm/prepare.sh "$llvm"
          # An explicit target keeps the flag off build scripts and proc macros.
          target="${{ matrix.rust_target }}"
          echo "CARGO_BUILD_TARGET=$target" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_$(echo "$target" | tr 'a-z-' 'A-Z_')_RUSTFLAGS=-C target-feature=+crt-static" >> "$GITHUB_ENV"
          echo "$(cygpath -w "$llvm/bin")" >> "$GITHUB_PATH"
      - name: Install static zlib and zstd (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev libzstd-dev libxml2-dev
      # Instrumented build, training run over this repository's tests and examples, then the
      # profile-guided build into target/pgo/dist. On Linux the result is also rewritten by the
      # llvm-bolt that ships in the official LLVM release (macOS and Windows: PGO only).
      - name: Build (PGO, and BOLT on Linux)
        id: build
        run: |
          llvm=none
          if [ -n "${{ matrix.llvm }}" ]; then llvm=static; fi
          bolt=()
          if [ "$RUNNER_OS" = "Linux" ]; then bolt=(--bolt --llvm-bin "$RUNNER_TEMP/llvm/bin"); fi
          python3 tools/build_pgo.py --llvm "$llvm" --jobs 4 "${bolt[@]}"
      - name: Show the failing link
        if: failure() && steps.build.outcome == 'failure' && matrix.llvm != ''
        run: cargo rustc --release --locked -p jaic-cli --bin jaic --no-default-features --features static-llvm -- -C link-args=-v 2>&1 | tail -60
      - name: Package
        run: |
          exe=""
          if [ "$RUNNER_OS" = "Windows" ]; then exe=".exe"; fi
          dir="jaic-${{ matrix.name }}"
          mkdir -p "$dir"
          out="target/pgo/dist"
          cp "$out/jaic$exe" "$out/jailsp$exe" "$out/jailint$exe" "$dir/"
          # stdlib/prelude/module.jai loads ../stdlib/prelude/module.jai.
          cp -R stdlib "$dir/stdlib"
          cp README.md CHANGELOG.md "$dir/"
          # jaifmt is a Jai program: built by the packaged jaic against the packaged stdlib, -O2
          # with the default checks (not jaifmt/build.jai's unchecked build), no debug files.
          "$dir/jaic$exe" build jaifmt/main.jai -O2 --no-debug-info -o "$dir/jaifmt"
          ls "$dir"
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip "$dir.zip" "$dir" > /dev/null
            echo "ARCHIVE=$dir.zip" >> "$GITHUB_ENV"
          else
            tar -czf "$dir.tar.gz" "$dir"
            echo "ARCHIVE=$dir.tar.gz" >> "$GITHUB_ENV"
          fi
          echo "PACKAGE_DIR=$dir" >> "$GITHUB_ENV"
      - name: Smoke test the packaged compiler outside the checkout
        run: |
          exe=""
          if [ "$RUNNER_OS" = "Windows" ]; then exe=".exe"; fi
          work="$RUNNER_TEMP/smoke"
          mkdir -p "$work"
          cp examples/compile-time-record.jai "$work/main.jai"
          jaic="$PWD/$PACKAGE_DIR/jaic$exe"
          jailint="$PWD/$PACKAGE_DIR/jailint$exe"
          jaifmt="$PWD/$PACKAGE_DIR/jaifmt$exe"
          cd "$work"
          formatted="$(echo 'main::(){x:=1;}' | "$jaifmt" --stdin | tr -d '\r')"
          echo "$formatted"
          test "$formatted" = "$(printf 'main :: () {\n    x := 1;\n}')"
          set +e
          "$jaic" run main.jai
          status=$?
          set -e
          test "$status" = 42
          # jailint finds the packaged stdlib next to itself.
          "$jailint" -D warnings main.jai
          if [ -n "${{ matrix.llvm }}" ]; then
            "$jaic" build main.jai -o main
            set +e
            ./main$exe
            status=$?
            set -e
            test "$status" = 42
          fi
          # (`! cmd` would not stop the script: `set -e` ignores a negated command.)
          if [ "$RUNNER_OS" = "macOS" ]; then
            otool -L "$jaic"
            if otool -L "$jaic" | grep -E '/opt/homebrew|/usr/local|@rpath'; then
              echo "jaic links a library outside the system"; exit 1
            fi
          fi
          if [ "$RUNNER_OS" = "Linux" ]; then
            ldd "$jaic"
            if ldd "$jaic" | grep -i llvm; then echo "jaic links a shared LLVM"; exit 1; fi
          fi
          # Installed the usual way: unpacked elsewhere, linked from a bin folder, with no
          # checkout to fall back on (the build's own stdlib path is baked in as the fallback).
          if [ "$RUNNER_OS" != "Windows" ]; then
            mv "$GITHUB_WORKSPACE/stdlib" "$GITHUB_WORKSPACE/stdlib.hidden"
            cp -R "$GITHUB_WORKSPACE/$PACKAGE_DIR" "$RUNNER_TEMP/opt-jaic"
            mkdir -p "$RUNNER_TEMP/bin"
            ln -s "$RUNNER_TEMP/opt-jaic/jaic" "$RUNNER_TEMP/bin/jaic"
            set +e
            "$RUNNER_TEMP/bin/jaic" run main.jai
            status=$?
            # jaifmt is self-contained: it needs neither the stdlib nor a checkout.
            ln -s "$RUNNER_TEMP/opt-jaic/jaifmt" "$RUNNER_TEMP/bin/jaifmt"
            linked_fmt="$(echo 'main::(){x:=1;}' | "$RUNNER_TEMP/bin/jaifmt" --stdin)"
            set -e
            mv "$GITHUB_WORKSPACE/stdlib.hidden" "$GITHUB_WORKSPACE/stdlib"
            test "$status" = 42
            test "$linked_fmt" = "$formatted"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

  # The VS Code extension, versioned like the release and pinned to the SHA-256 of the archives
  # the build jobs just made, so it downloads exactly those (docs/tools/vscode-extension.md).
  vscode:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: archives
          merge-multiple: true
      - name: Version from the tag (or Cargo.toml for a dry run)
        run: |
          cargo_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          tag="${{ inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}"
          version="${tag#v}"
          if [ -z "$version" ]; then version="$cargo_version"; fi
          # The extension downloads jaic v<its version>, so the two must agree.
          test "$version" = "$cargo_version" || { echo "tag $tag does not match Cargo.toml version $cargo_version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Validate dependency ages before installing
        working-directory: editors/vscode
        run: node scripts/check-dependency-age.mjs
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: editors/vscode/package.json
      - name: Package
        working-directory: editors/vscode
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          node scripts/pin-toolchain.mjs --version "$VERSION" --archives ../../archives
          test "$(node -p 'require("./package.json").version')" = "$VERSION"
          pnpm run package -o "jai-vscode-$VERSION.vsix"
          mkdir -p ../../vsix && mv "jai-vscode-$VERSION.vsix" ../../vsix/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vscode-extension
          path: vsix/*.vsix
          if-no-files-found: error

  publish:
    needs: [build, vscode]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version="${tag#v}"
          # The section under "## [version]" up to the next "## [".
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $version"; exit 1; }
          (cd dist && sha256sum * > SHA256SUMS)
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "jaic $TAG" --notes-file notes.md --latest

  # The extension stores, each in its own job after the GitHub release: a store that is down or
  # rejects the upload fails only its job, never the release or the other store. Each publishes
  # only when its token is configured (repository secrets VSCE_PAT and OVSX_PAT; see
  # docs/tools/vscode-extension.md#publishing). --skip-duplicate makes re-running a tag harmless.
  marketplace:
    needs: [vscode, publish]
    if: >-
      inputs.publish_integrations &&
      (startsWith(github.ref, 'refs/tags/v') || inputs.tag != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Validate dependency ages before installing
        run: node scripts/check-dependency-age.mjs
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: editors/vscode/package.json
      - name: Install vsce
        run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vscode-extension
          path: vsix
      - name: Publish to the VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then echo "VSCE_PAT is not set; skipping the Marketplace"; exit 0; fi
          vsix="$(ls ../../vsix/jai-vscode-*.vsix)"
          # vsce reads the token from VSCE_PAT.
          pnpm exec vsce publish --packagePath "$vsix" --skip-duplicate

  open-vsx:
    needs: [vscode, publish]
    if: >-
      inputs.publish_integrations &&
      (startsWith(github.ref, 'refs/tags/v') || inputs.tag != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Validate dependency ages before installing
        run: node scripts/check-dependency-age.mjs
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: editors/vscode/package.json
      - name: Install ovsx
        run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vscode-extension
          path: vsix
      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then echo "OVSX_PAT is not set; skipping Open VSX"; exit 0; fi
          vsix="$(ls ../../vsix/jai-vscode-*.vsix)"
          # The namespace (package.json's publisher) must exist before the first publish. Creating
          # it again fails with "Namespace already exists", which is the state we want.
          if ! out="$(pnpm exec ovsx create-namespace matteopolak -p "$OVSX_PAT" 2>&1)"; then
            echo "$out"
            echo "$out" | grep -qi "already exists" || exit 1
          else
            echo "$out"
          fi
          pnpm exec ovsx publish "$vsix" -p "$OVSX_PAT" --skip-duplicate
