name: announce release on Zulip
# Posts a release's notes to Zulip. release.yml calls this once, right after its `publish` job
# creates the GitHub release: a release made with the workflow token fires no `release` event for
# other workflows. A manual run previews a past release in another channel (default `test`).
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      channel:
        type: string
        default: announcements
    secrets:
      ZULIP_BOT_EMAIL:
        required: true
      ZULIP_BOT_KEY:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to post
        required: true
      channel:
        description: Zulip channel
        default: test

permissions:
  contents: read

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: tools/ci
      - name: Post the release to Zulip
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ZULIP_SITE: https://jacket.zulipchat.com
          ZULIP_BOT_EMAIL: ${{ secrets.ZULIP_BOT_EMAIL }}
          ZULIP_BOT_KEY: ${{ secrets.ZULIP_BOT_KEY }}
          TAG: ${{ inputs.tag }}
          CHANNEL: ${{ inputs.channel }}
        run: python3 tools/ci/announce_release.py --tag "$TAG" --channel "$CHANNEL"
