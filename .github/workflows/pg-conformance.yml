name: postgres conformance
# The Postgres client against PostgreSQL's own suites (docs/postgres/conformance.md): the server
# tests in stdlib/Extensions/Postgres/tests, then the regression suite run once through the real
# psql and once through the Jai psql shim, on every supported major version. A test that passes
# with psql and fails with the shim fails the job unless regress-skip.txt lists it. The binary
# round trip then fetches the typed data that run leaves behind in text and in binary, and the JSON
# regression literals, and sends every value back to the server. The TAP suites (connection
# strings, password authentication, SASLprep, query cancellation) run through the shim psql and
# libpq_uri_regress the same way. The typed-query, ORM and schema suites run against the same
# cluster, and the `managed` job runs the managed-server tests (downloaded PostgreSQL binaries, no
# installed server) on Linux, macOS and Windows.
on:
  push:
    branches: [main]
    paths:
      - stdlib/Extensions/Postgres/**
      - stdlib/Extensions/Io/**
      - stdlib/Extensions/Tls/**
      - tools/pg_conformance/**
      - .github/workflows/pg-conformance.yml
  pull_request:
    paths:
      - stdlib/Extensions/Postgres/**
      - stdlib/Extensions/Io/**
      - stdlib/Extensions/Tls/**
      - tools/pg_conformance/**
      - .github/workflows/pg-conformance.yml
  workflow_dispatch:
permissions:
  contents: read
env:
  # tools/ holds the folders the Python scripts import from (`from toolkit.repo import ROOT`).
  PYTHONPATH: ${{ github.workspace }}/tools
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  conformance:
    name: PostgreSQL ${{ matrix.postgres }}${{ matrix.beta && ' (beta)' || '' }}
    strategy:
      fail-fast: false
      matrix:
        postgres: ['15', '16', '17', '18']
        beta: [false]
        # The next major while it is in beta or release candidate: reported, allowed to fail.
        include:
          - postgres: '19'
            beta: true
    runs-on: ubuntu-24.04
    continue-on-error: ${{ matrix.beta }}
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: '0'
      JAIC_NATIVE_LIBS: ${{ github.workspace }}/target/http-native-libs
      PG_BIN: /usr/lib/postgresql/${{ matrix.postgres }}/bin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: python3 tools/ci/install_pinned.py rust
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Install LLVM 23
        timeout-minutes: 15
        run: |
          bash tools/ci/install_ci_llvm_linux.sh
          echo "LLVM_SYS_231_PREFIX=/usr/lib/llvm-23" >> "$GITHUB_ENV"
          echo "/usr/lib/llvm-23/bin" >> "$GITHUB_PATH"
      - name: Install PostgreSQL ${{ matrix.postgres }} from the PGDG repository
        timeout-minutes: 20
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # The LLVM step points apt at jai-ci-sources.list.d (tools/ci/apt_lib.sh), so the
          # repository goes there. The per-major component carries a major before its release.
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main ${{ matrix.postgres }}" | sudo tee /etc/apt/jai-ci-sources.list.d/pgdg.list
          # A stalled mirror download is cut off and tried again rather than hanging the job.
          apt_options="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          for attempt in 1 2 3; do
            timeout 300 sudo -E apt-get $apt_options update && break
            echo "apt-get update attempt $attempt failed or stalled"
          done
          apt-cache policy "postgresql-${{ matrix.postgres }}"
          for attempt in 1 2 3; do
            timeout 300 sudo -E apt-get $apt_options install -y "postgresql-${{ matrix.postgres }}" "postgresql-server-dev-${{ matrix.postgres }}" libipc-run-perl libio-pty-perl && break
            [ "$attempt" = 3 ] && exit 1
            echo "apt-get install attempt $attempt failed or stalled"
            sudo dpkg --configure -a || true
          done
      - name: Build the TLS SDK
        run: python3 tools/native/http_native.py --out "$JAIC_NATIVE_LIBS"
      - name: Build jaic
        run: cargo build --locked -p jaic-cli
      - name: Client tests against a throwaway cluster
        run: |
          eval "$(sh stdlib/Extensions/Postgres/tests/start_server.sh "$RUNNER_TEMP/pg" 54329)"
          mkdir -p "$RUNNER_TEMP/server-test"
          (cd "$RUNNER_TEMP/server-test" && "$GITHUB_WORKSPACE/target/debug/jaic" "$GITHUB_WORKSPACE/stdlib/Extensions/Postgres/tests/server.jai" -exe server && ./server)
          # The suites that need a server and a jaic: typed queries (which also run the ORM test),
          # the pg tool's schema commands, then the editor's typed-query diagnostics.
          export JAIC="$GITHUB_WORKSPACE/target/debug/jaic" PSQL="$PG_BIN/psql"
          sh stdlib/Extensions/Postgres/tests/typed/run.sh
          sh stdlib/Extensions/Postgres/tests/schema/run.sh
          JACKET_DATABASE_URL=postgres://postgres@127.0.0.1:54329/jai_typed_test cargo test --locked -p jai-language-server --test postgres_typed_queries -- --nocapture
          "$PG_BIN/pg_ctl" -D "$RUNNER_TEMP/pg" stop
      - name: Regression suite through psql and the shim
        run: python3 -u tools/pg_conformance/run.py --jaic target/debug/jaic --pg-config "$PG_BIN/pg_config"
      - name: Pipeline message traces against libpq_pipeline's
        run: python3 -u tools/pg_conformance/run.py --jaic target/debug/jaic --pg-config "$PG_BIN/pg_config" --pipeline-traces
      - name: TAP suites through psql and the shims
        run: python3 -u tools/pg_conformance/run.py --jaic target/debug/jaic --pg-config "$PG_BIN/pg_config" --tap
      - name: Binary round trip over the regression tables
        run: python3 -u tools/pg_conformance/roundtrip.py --jaic target/debug/jaic --pg-config "$PG_BIN/pg_config"
      - name: Keep the diffs
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pg-conformance-${{ matrix.postgres }}
          path: |
            target/pg-conformance/run/${{ matrix.postgres }}/*/regression.*
            target/pg-conformance/run/${{ matrix.postgres }}/tap/*/*/prove.log
            target/pg-conformance/run/${{ matrix.postgres }}/tap/*/*/log
          retention-days: 7
          if-no-files-found: ignore
  managed:
    name: managed server (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, jaic: target/debug/jaic}
          - {runner: macos-15, jaic: target/debug/jaic}
          - {runner: windows-2025, jaic: target/x86_64-pc-windows-msvc/debug/jaic.exe, triple: x86_64-pc-windows-msvc}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: '0'
      JAIC_NATIVE_LIBS: ${{ github.workspace }}/target/http-native-libs
      JAI_PG_TEST_MANAGED: '1'
      LLVM_VERSION: 23.1.2
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-unix
        if: runner.os != 'Windows'
        with:
          native-libs: 'false'
          font: 'false'
      - uses: ./.github/actions/setup-windows
        if: runner.os == 'Windows'
        with:
          cpu: x64
          triple: x86_64-pc-windows-msvc
      - name: Build the TLS SDK
        run: python tools/native/http_native.py --out "$JAIC_NATIVE_LIBS"
      - name: Build jaic
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            cargo build --locked -p jaic-cli --no-default-features --features static-llvm
          else
            cargo build --locked -p jaic-cli
          fi
      - uses: ./.github/actions/windows-provider
        if: runner.os == 'Windows'
        with:
          cpu: x64
          triple: x86_64-pc-windows-msvc
      - name: Managed server tests (download, start, reuse, restart)
        timeout-minutes: 15
        run: |
          jaic="$GITHUB_WORKSPACE/${{ matrix.jaic }}"
          mkdir -p "$RUNNER_TEMP/managed-test"
          cd "$RUNNER_TEMP/managed-test"
          "$jaic" "$GITHUB_WORKSPACE/stdlib/Extensions/Postgres/tests/managed.jai" -exe managed
          ./managed
      - name: Typed queries in managed mode, with no database URL
        run: |
          jaic="$GITHUB_WORKSPACE/${{ matrix.jaic }}"
          tests="$GITHUB_WORKSPACE/stdlib/Extensions/Postgres/tests"
          work="$RUNNER_TEMP/managed-typed"
          rm -rf "$work"
          mkdir -p "$work/project/db/migrations"
          native() { if [ "$RUNNER_OS" = Windows ]; then cygpath -m "$1"; else printf '%s' "$1"; fi; }
          grep -v "schema public" "$tests/typed/schema.sql" > "$work/project/db/migrations/0001_init.sql"
          JACKET_PG_ROOT="$(native "$work/project")"
          JACKET_PG_MANAGED_CACHE="$(native "$work/cache")"
          export JACKET_PG_ROOT JACKET_PG_MANAGED_CACHE
          unset DATABASE_URL JACKET_DATABASE_URL
          stop_server() {
            for data in "$work"/cache/cluster-*; do
              [ -f "$data/postmaster.pid" ] || continue
              for pg_ctl in "$work"/cache/*/bin/pg_ctl*; do "$pg_ctl" stop -D "$data" -m fast > /dev/null 2>&1 || true; done
            done
          }
          trap stop_server EXIT
          # The project's `jacket.toml` alone turns managed mode on.
          printf '[postgres]\nmanaged = true\n' > "$work/project/jacket.toml"
          # The builds are the test: the binaries need a database URL to run, which managed mode
          # does not give them (the server suites run them).
          "$jaic" "$tests/typed/queries.jai" -exe "$work/queries"
          count=$(find "$work/project/db/queries" -type f | wc -l)
          [ "$count" -gt 10 ]
          # A second build with an empty cache reuses the running server and writes the same cache.
          rm -rf "$work/project/db/queries" "$work/queries"*
          "$jaic" "$tests/typed/queries.jai" -exe "$work/queries"
          [ "$(find "$work/project/db/queries" -type f | wc -l)" -eq "$count" ]
          # Two builds at once on a stopped server: one starts it under the lock, the other reuses it.
          stop_server
          rm -rf "$work/project/db/queries"
          "$jaic" "$tests/typed/queries.jai" -exe "$work/race_a" > "$work/race_a.log" 2>&1 & a=$!
          "$jaic" "$tests/typed/queries.jai" -exe "$work/race_b" > "$work/race_b.log" 2>&1 & b=$!
          wait $a || { cat "$work/race_a.log"; exit 1; }
          wait $b || { cat "$work/race_b.log"; exit 1; }
          [ "$(find "$work/project/db/queries" -type f | wc -l)" -eq "$count" ]
      - name: Keep the server logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pg-managed-${{ matrix.runner }}
          path: ${{ runner.temp }}/managed-typed/cache/cluster-*/server.log
          retention-days: 7
          if-no-files-found: ignore
