name: benchmark
# Manual only: shared runners are too noisy to gate on timings. Compare runs of this workflow
# with each other (same runner image), not with results from a developer machine.
on:
  workflow_dispatch:
    inputs:
      command:
        description: Which benchmark to run
        type: choice
        options: [compile, lsp, lint]
        default: compile
      repeat:
        description: Timed runs per result (the median is reported)
        default: '5'
      only:
        description: Comma-separated substrings of the result keys to run (empty for the defaults)
        default: ''
permissions:
  contents: read
jobs:
  bench:
    name: benchmark (macos-15)
    runs-on: macos-15
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install nightly-2026-08-29 --profile minimal
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Install LLVM 23
        run: |
          tools/install_ci_llvm_macos.sh
      - name: Build the release compiler
        run: cargo build --locked --release -p jaic-cli -p jai-language-server -p jailint
      - name: Fetch the upstream corpus and its native libraries
        run: |
          python3 tools/fetch_upstreams.py
          python3 tools/build_native_libs.py
      - name: Run the benchmark
        env:
          COMMAND: ${{ inputs.command }}
          REPEAT: ${{ inputs.repeat }}
          ONLY: ${{ inputs.only }}
        run: |
          python3 tools/bench/main.py "$COMMAND" --repeat "$REPEAT" --only "$ONLY" \
            --out bench.json --markdown bench.md
      - name: Summary
        if: always()
        run: test -f bench.md && cat bench.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: bench
          path: |
            bench.json
            bench.md
