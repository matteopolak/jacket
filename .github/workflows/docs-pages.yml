name: docs-pages
# The API reference site (docs/tools/jacket-doc.md) at https://jacket.matteopolak.com, served by
# GitHub Pages. The release workflow calls this to build the site for its tag, then deploys it once
# the release is published (its `pages` job). A manual run builds a tag or branch and deploys it.
on:
  workflow_call:
    inputs:
      ref:
        description: Commit, tag or branch to build
        type: string
        required: true
      version:
        description: Version shown on the site
        type: string
        required: true
      source_ref:
        description: Tag or commit the Source links point at; defaults to ref
        type: string
        default: ''
      pack:
        description: Also attach the site as the docs-site artifact (jacket-docs-<version>.tar.gz)
        type: boolean
        default: false
      deploy:
        description: Deploy to Pages after building
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      version:
        description: Displayed documentation version (defaults to the ref without a leading v)
        type: string
        required: false
        default: ''
      browser_checks:
        description: Run Chrome checks even when the repository opt-out is set
        type: boolean
        default: false
      ref:
        description: Tag or branch to build - defaults to the latest release tag
        required: false
        default: ''
      deploy:
        description: Deploy to Pages after building
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: docs-pages-${{ inputs.ref || github.ref_name }}
  cancel-in-progress: false
env:
  PYTHONPATH: ${{ github.workspace }}/tools
  CARGO_INCREMENTAL: '0'
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Pick the ref and version
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref }}
          VERSION: ${{ inputs.version }}
        run: |
          ref="$REF"
          if [ -z "$ref" ]; then ref="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)"; fi
          version="$VERSION"
          if [ -z "$version" ]; then version="${ref#v}"; fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ steps.pick.outputs.ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: website/docs/.node-version
          cache: npm
          cache-dependency-path: website/docs/package-lock.json
      - name: Restore docs dependency policy metadata
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/docs-dependency-age.json
          key: docs-dep-age-${{ hashFiles('website/docs/package-lock.json') }}-${{ github.run_id }}
          restore-keys: |
            docs-dep-age-${{ hashFiles('website/docs/package-lock.json') }}-
            docs-dep-age-
      - name: Validate the locked docs dependencies before installing
        run: python3 tools/ci/check_docs_dependencies.py --cache "$RUNNER_TEMP/docs-dependency-age.json"
      - name: Install the frozen Astro builder
        working-directory: website/docs
        run: npm ci
      - name: Save docs dependency policy metadata
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/docs-dependency-age.json
          key: docs-dep-age-${{ hashFiles('website/docs/package-lock.json') }}-${{ github.run_id }}
      - name: Install the pinned Rust toolchain and wasm target
        run: python3 tools/ci/install_pinned.py rust --target wasm32-unknown-unknown
      - uses: ./.github/actions/rust-cache
      - uses: ./.github/actions/dependency-age-cache
      - name: Validate dependency ages before building
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/ci/check_dependency_age.py
      - name: Fetch the locked crates
        run: cargo fetch --locked
      - name: Build the browser compiler
        run: python3 tools/browser/build_scripting_wasm.py --release --output target/doc-runtime
      - uses: ./.github/actions/setup-llvm
      - name: Build jacket and jaic
        run: cargo build --release --locked --offline -p jacket -p jaic-cli
      - name: Build the matching native declaration formatter
        run: target/release/jaic jaifmt/main.jai -exe target/release/jaifmt
      - name: Check the Rust documentation schema authority
        run: python3 tools/generators/generate_doc_site.py --check
      - name: Check the Astro schema, types and consumer regressions
        working-directory: website/docs
        run: |
          npm run check:generated
          npm run check
          npm test
      - name: Build the site
        env:
          VERSION: ${{ steps.pick.outputs.version }}
          REF: ${{ inputs.source_ref || steps.pick.outputs.ref }}
        run: target/release/jacket doc --validate-examples --base-url / --version "$VERSION" --source-ref "$REF" --playground-url https://matteopolak.com/playground/jacket --runtime target/doc-runtime --export target/doc-export --out target/doc-site
      - name: Check formatter-authored definitions and canonical anchors
        run: node --experimental-strip-types website/docs/scripts/check-definitions.mjs target/doc-export target/doc-site "$RUNNER_TEMP/jacket-doc-definitions-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
      - name: Check documentation validation helpers
        run: |
          PYTHONPATH=tools python3 -m unittest discover -s tools/dev -p test_doc_palette.py
          python3 -m unittest bench.test_doc_site bench.test_doc_server
          python3 -m unittest discover -s tools/ci -p test_check_docs_size.py
          node --test tools/dev/test_chrome_startup.mjs tools/dev/test_chrome_cdp.mjs tools/dev/test_doc_samples.mjs tools/dev/test_doc_sidebar.mjs
          node --test tools/bench/test_doc_browser_accounting.mjs tools/bench/test_doc_browser_content.mjs tools/bench/doc_validate.test.mjs
      - name: Check documentation accessibility and layout
        if: ${{ inputs.browser_checks || vars.DOCS_BROWSER_CHECKS != 'false' }}
        run: |
          python3 tools/dev/doc_serve.py --port 8000 --directory target/doc-site &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          node tools/dev/doc_toc_history.mjs target/doc-site "$RUNNER_TEMP/jacket-doc-toc-history-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
          node tools/dev/doc_parse_layout.mjs target/doc-site "$RUNNER_TEMP/jacket-doc-parser-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
          node tools/dev/doc_a11y.mjs http://127.0.0.1:8000/
          node tools/dev/doc_layout.mjs http://127.0.0.1:8000/
          node tools/dev/doc_toc_position.mjs http://127.0.0.1:8000/ "$RUNNER_TEMP/jacket-doc-toc-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
          node tools/dev/doc_rail_viewport.mjs http://127.0.0.1:8000/ "$RUNNER_TEMP/jacket-doc-rail-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
          node tools/dev/doc_declarations.mjs http://127.0.0.1:8000/ "$RUNNER_TEMP/jacket-doc-declaration-geometry-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
          node tools/dev/doc_examples.mjs http://127.0.0.1:8000/ "$RUNNER_TEMP/jacket-doc-production-examples-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
          node tools/dev/doc_spa.mjs http://127.0.0.1:8000/
          node tools/dev/doc_search_intent.mjs target/doc-site "$RUNNER_TEMP/jacket-search-intent-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
          node tools/dev/doc_cache.mjs target/doc-site "$RUNNER_TEMP/jacket-doc-cache-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
          node tools/dev/doc_edit_coloring.mjs http://127.0.0.1:8000/ "$RUNNER_TEMP/jacket-doc-editor-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
          node tools/dev/doc_sidebar_geometry.mjs http://127.0.0.1:8000/ "$RUNNER_TEMP/jacket-doc-header-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" api/Basic --header-resize
          node tools/dev/doc_sidebar_geometry.mjs http://127.0.0.1:8000/ "$RUNNER_TEMP/jacket-doc-live-dark-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" api/Basic --live-rail --source-y=600 --theme=dark
          node tools/dev/doc_sidebar_geometry.mjs http://127.0.0.1:8000/ "$RUNNER_TEMP/jacket-doc-live-light-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" api/Basic --live-rail --source-y=600 --theme=light
      - name: Retain deterministic parser geometry evidence
        if: ${{ always() && !cancelled() && (inputs.browser_checks || vars.DOCS_BROWSER_CHECKS != 'false') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-parser-geometry
          path: |
            ${{ runner.temp }}/jacket-doc-parser-*
            ${{ runner.temp }}/jacket-doc-toc-history-*
          if-no-files-found: warn
      - name: Check foreground development publication and runtime
        if: ${{ inputs.browser_checks || vars.DOCS_BROWSER_CHECKS != 'false' }}
        run: |
          python3 -m unittest discover -s tools/dev -p test_doc_watch.py
          python3 tools/ci/check_doc_development.py --jacket "$PWD/target/release/jacket" --formatter "$PWD/target/release/jaifmt" --work "$RUNNER_TEMP/jacket-doc-dev-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --full-export "$PWD/target/doc-export" --full-site "$PWD/target/doc-site"
      - name: Pack it for the release
        if: inputs.pack
        env:
          VERSION: ${{ steps.pick.outputs.version }}
        run: |
          mkdir -p dist-docs
          tar -czf "dist-docs/jacket-docs-$VERSION.tar.gz" -C target/doc-site .
          ls -l dist-docs
      - if: inputs.pack
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-site
          path: dist-docs/*.tar.gz
          if-no-files-found: error
      - name: Check the complete Pages publication budget
        run: python3 tools/ci/check_docs_size.py target/doc-site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: target/doc-site

  deploy:
    needs: build
    if: inputs.deploy
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
