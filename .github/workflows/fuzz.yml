name: fuzzing
# Nightly libFuzzer runs of every target (docs/tools/testing.md). The saved crash inputs are
# replayed on every push and pull request by the `fuzz-regressions` job of ci.yml.
on:
  schedule:
    - cron: '23 3 * * 1-6'
    # Sundays also minimize each corpus (`cmin` replays it and takes 6 to 10 minutes per target).
    - cron: '23 3 * * 0'
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds to fuzz each target
        default: '600'
permissions:
  contents: read
env:
  # tools/ holds the folders the Python scripts import from (`from toolkit.repo import ROOT`).
  PYTHONPATH: ${{ github.workspace }}/tools
jobs:
  targets:
    name: list the targets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Read fuzz/targets.json
        id: list
        run: echo "matrix=$(python3 fuzz/seed_corpus.py --matrix)" >> "$GITHUB_OUTPUT"
  fuzz:
    needs: targets
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    env:
      CARGO_INCREMENTAL: '0'
      SECONDS_PER_TARGET: ${{ inputs.seconds || '600' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Install the pinned toolchain
        run: python3 tools/ci/install_pinned.py rust
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-fuzz@0.13.2
      - name: Restore the corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Add seeds from the repository
        run: python3 fuzz/seed_corpus.py ${{ matrix.target }}
      - name: Fuzz
        # Leaves time for the steps after it, which run even when this one is cut short.
        timeout-minutes: 25
        run: fuzz/run.sh ${{ matrix.target }} "$SECONDS_PER_TARGET" "$(nproc)"
      - name: Summarize the findings
        # Replays each saved input and writes the panic message and the input (hex dump and escaped
        # text) to the job summary, so no artifact needs downloading to see what broke.
        if: ${{ failure() }}
        timeout-minutes: 15
        continue-on-error: true
        run: python3 tools/fuzz/crash_summary.py ${{ matrix.target }}
      - name: Minimize the corpus
        if: ${{ always() && (github.event_name == 'workflow_dispatch' || github.event.schedule == '23 3 * * 0') }}
        # cargo fuzz cmin replaces the corpus only once it has finished, so a cut-off keeps it.
        timeout-minutes: 10
        continue-on-error: true
        working-directory: fuzz
        # The unit timeout is the target's own, as in `fuzz/run.sh`.
        run: |
          read -r _ unit_timeout <<< "$(python3 seed_corpus.py --settings ${{ matrix.target }})"
          cargo fuzz cmin --sanitizer none --debug-assertions \
            --target "$(rustc -vV | sed -n 's/^host: //p')" ${{ matrix.target }} \
            corpus/${{ matrix.target }} -- -timeout="$unit_timeout" -rss_limit_mb=4096
      - name: Save the corpus
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
