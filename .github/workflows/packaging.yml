name: packaging
# Checks the package-manager channels against the latest published release: install.sh (Linux,
# macOS) and install.ps1 (Windows), the Homebrew formula rendered by
# tools/render_packages.py, each installed for real and run. Nothing is published from here; the
# release workflow publishes. See docs/tools/package-managers.md.
on:
  push:
    paths:
      - install.sh
      - install.ps1
      - packaging/**
      - tools/render_packages.py
      - .github/workflows/packaging.yml
  pull_request:
    paths:
      - install.sh
      - install.ps1
      - packaging/**
      - tools/render_packages.py
      - .github/workflows/packaging.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint install.sh as POSIX sh
        run: shellcheck --version && shellcheck -s sh install.sh

  install-sh:
    name: install.sh (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Releases up to 0.4.1 have no Intel macOS or arm64 Linux archive: there install.sh must
      # pick the platform and then say the release has no build for it.
      - name: Does the latest release have this platform's archive?
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$(uname -s)-$(uname -m)" in
            Darwin-arm64) plat=macos-arm64 ;;
            Darwin-x86_64) plat=macos-x64 ;;
            Linux-x86_64) plat=linux-x64 ;;
            Linux-aarch64) plat=linux-arm64 ;;
          esac
          echo "PLATFORM=$plat" >> "$GITHUB_ENV"
          assets="$(gh release view --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')"
          if echo "$assets" | grep -Eqx "jaic?-$plat\.tar\.gz"; then has=true; else has=false; fi
          echo "$plat in the latest release: $has"
          echo "has=$has" >> "$GITHUB_OUTPUT"
      - name: Without one, install.sh names the missing archive
        if: steps.release.outputs.has == 'false'
        run: |
          if ./install.sh 2> err.txt; then exit 1; fi
          cat err.txt
          grep -Eq "has no jaic?-$PLATFORM\.tar\.gz" err.txt
      - name: Install an older release, then upgrade to the latest through a pipe
        if: steps.release.outputs.has == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --json tagName -q '.[1].tagName')"
          latest="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)"
          echo "previous=$previous latest=$latest"
          JAIC_VERSION="$previous" ./install.sh
          test -d "$HOME/.local/share/jai/${previous#v}"
          # A PATH without the bin folder (the runners already have ~/.local/bin on theirs).
          PATH=/usr/bin:/bin sh < install.sh | tee out.txt
          grep -q "is not on your PATH" out.txt
          test -d "$HOME/.local/share/jai/${latest#v}"
          test ! -e "$HOME/.local/share/jai/${previous#v}"
          test "$(readlink "$HOME/.local/bin/jaic")" = "$HOME/.local/share/jai/${latest#v}/jaic"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run the installed toolchain outside the checkout
        if: steps.release.outputs.has == 'true'
        run: |
          cd "$RUNNER_TEMP"
          printf '#import "Basic";\n\nmain :: () {\n    print("hello from install.sh\\n");\n}\n' > hello.jai
          test "$(jaic run hello.jai)" = "hello from install.sh"
          jailint hello.jai
          test "$(echo 'main::(){x:=1;}' | jaifmt --stdin)" = "$(printf 'main :: () {\n    x := 1;\n}')"
          command -v jailsp
      - name: Custom directories (the JAI_* names; the steps around use JAIC_*), and a re-run of the same version
        if: steps.release.outputs.has == 'true'
        run: |
          export JAI_INSTALL_DIR="$RUNNER_TEMP/custom/share" JAI_BIN_DIR="$RUNNER_TEMP/custom/bin"
          ./install.sh
          ./install.sh
          test "$(find "$JAI_INSTALL_DIR" -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')" = 1
          cd "$RUNNER_TEMP" && "$JAI_BIN_DIR/jaic" run hello.jai
      - name: Bad versions and occupied commands fail with a message
        run: |
          if JAIC_VERSION=0.0.0-missing JAIC_INSTALL_DIR="$RUNNER_TEMP/x" JAIC_BIN_DIR="$RUNNER_TEMP/xb" ./install.sh 2> err.txt; then exit 1; fi
          cat err.txt && grep -q "could not download" err.txt
          # (Without an archive for this platform, install.sh stops before looking at the links.)
          if [ "${{ steps.release.outputs.has }}" != true ]; then exit 0; fi
          mkdir -p "$RUNNER_TEMP/occupied" && touch "$RUNNER_TEMP/occupied/jaic"
          if JAIC_BIN_DIR="$RUNNER_TEMP/occupied" ./install.sh 2> err.txt; then exit 1; fi
          cat err.txt && grep -q "is not a symlink" err.txt

  install-ps1:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Windows PowerShell 5.1, the way `irm ... | iex` runs it on a stock machine.
      - name: Install the latest release twice (the second run is an upgrade in place)
        shell: powershell
        run: |
          Get-Content -Raw install.ps1 | Invoke-Expression
          Get-Content -Raw install.ps1 | Invoke-Expression
          $current = Join-Path $env:LOCALAPPDATA 'Programs\jai\current'
          if (-not (Test-Path (Join-Path $current 'stdlib\prelude\module.jai'))) { throw 'no stdlib next to jaic.exe' }
          if (([Environment]::GetEnvironmentVariable('Path', 'User') -split ';') -notcontains $current) { throw 'user PATH lacks the install' }
          @(Get-ChildItem -Directory (Join-Path $env:LOCALAPPDATA 'Programs\jai')).Count
          $current | Out-File -Encoding ascii -Append $env:GITHUB_PATH
      - name: Run the installed toolchain outside the checkout
        shell: pwsh
        run: |
          Set-Location $env:RUNNER_TEMP
          "#import `"Basic`";`n`nmain :: () {`n    print(`"hello from install.ps1\n`");`n}`n" | Set-Content -NoNewline hello.jai
          $out = jaic run hello.jai
          if ($LASTEXITCODE -ne 0 -or $out -ne 'hello from install.ps1') { throw "jaic run printed '$out'" }
          jailint hello.jai
          if ($LASTEXITCODE -ne 0) { throw 'jailint failed' }
          (Get-Command jaifmt, jailsp).Source

  homebrew:
    name: homebrew (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      HOMEBREW_NO_ENV_HINTS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Render the formula for the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" -p SHA256SUMS -D "$RUNNER_TEMP"
          python3 tools/render_packages.py --version "$tag" --sums "$RUNNER_TEMP/SHA256SUMS" --out "$RUNNER_TEMP/packages"
          cat "$RUNNER_TEMP/packages/homebrew/jai.rb"
      # Every platform's url and sha256 from synthetic checksums: the formula a release after
      # 0.4.1 gets, with Intel macOS and arm64 Linux builds and no `depends_on arch:`.
      - name: Render and audit a formula for all four platforms
        run: |
          sums="$RUNNER_TEMP/all-platforms.SHA256SUMS"
          for asset in macos-arm64.tar.gz macos-x64.tar.gz linux-x64.tar.gz linux-arm64.tar.gz; do
            echo "$(printf '%s' "$asset" | shasum -a 256 | cut -d ' ' -f 1)  jai-$asset"
          done > "$sums"
          python3 tools/render_packages.py --version 99.0.0 --sums "$sums" --out "$RUNNER_TEMP/all-platforms"
          formula="$RUNNER_TEMP/all-platforms/homebrew/jai.rb"
          cat "$formula"
          grep -q 'jai-macos-x64.tar.gz' "$formula" && grep -q 'jai-linux-arm64.tar.gz' "$formula"
          if grep -q 'depends_on arch: :' "$formula"; then echo "the formula still restricts the architecture"; exit 1; fi
          if [ "$RUNNER_OS" = Linux ]; then eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"; fi
          brew tap-new --no-git jaiall/local
          cp "$formula" "$(brew --repository jaiall/local)/Formula/jai.rb"
          brew trust jaiall/local 2> /dev/null || true
          brew style jaiall/local/jai
          brew audit --formula --strict jaiall/local/jai
          brew untap jaiall/local
      - name: Install the formula from a local tap and run its test
        run: |
          if [ "$RUNNER_OS" = Linux ]; then eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"; fi
          brew --version
          brew tap-new --no-git jaitest/local
          cp "$RUNNER_TEMP/packages/homebrew/jai.rb" "$(brew --repository jaitest/local)/Formula/jai.rb"
          brew trust jaitest/local 2> /dev/null || true
          brew style jaitest/local/jai
          brew audit --formula --strict --online jaitest/local/jai
          brew install --build-from-source jaitest/local/jai
          brew test jaitest/local/jai
          brew linkage jaitest/local/jai || true
          brew uninstall jaitest/local/jai
          brew untap jaitest/local
