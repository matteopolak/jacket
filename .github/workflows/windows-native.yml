name: windows native
# Native Windows executables from `jaic build`: built on Windows with the MSVC toolchain, and
# cross-built from Linux with MinGW-w64 then run on Windows. See docs/native/windows.md.
on:
  push:
    branches: ['wip/windows-native']
    paths:
      - 'crates/**'
      - 'stdlib/**'
      - 'prelude/**'
      - 'tests/**'
      - 'tools/windows_cross.py'
      - '.github/workflows/windows-native.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: '0'
  LLVM_VERSION: 22.1.8
jobs:
  cross:
    name: cross-build (Linux, MinGW-w64)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install nightly-2026-08-29 --profile minimal
      - name: Install LLVM 22 and MinGW-w64
        run: |
          bash tools/install_ci_llvm_linux.sh
          echo "LLVM_SYS_221_PREFIX=/usr/lib/llvm-22" >> "$GITHUB_ENV"
          sudo apt-get install -y gcc-mingw-w64-x86-64
          x86_64-w64-mingw32-gcc --version
      - name: Build jaic
        run: cargo build --locked -p jaic-cli
      - name: Cross-build the Windows test programs
        run: python3 tools/windows_cross.py build --jaic target/debug/jaic --out cross-exes
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cross-exes
          path: cross-exes
          if-no-files-found: error

  run-cross:
    name: run cross-built programs (Windows)
    needs: cross
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cross-exes
          path: cross-exes
      - name: Run
        run: python tools/windows_cross.py run --dir cross-exes

  native:
    name: jaic build on Windows (MSVC)
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install nightly-2026-08-29 --profile minimal
      - name: Install the official LLVM release
        run: |
          curl -fsSL -o llvm.tar.xz "https://github.com/llvm/llvm-project/releases/download/llvmorg-$LLVM_VERSION/clang+llvm-$LLVM_VERSION-x86_64-pc-windows-msvc.tar.xz"
          # GNU tar reads `D:\...` as a remote host: extract to the POSIX spelling of the path.
          llvm="$(cygpath -u "$RUNNER_TEMP")/llvm"
          mkdir -p "$llvm"
          tar -xJf llvm.tar.xz -C "$llvm" --strip-components=1
          rm llvm.tar.xz
          echo "LLVM_SYS_221_PREFIX=$(cygpath -m "$llvm")" >> "$GITHUB_ENV"
          echo "$(cygpath -w "$llvm/bin")" >> "$GITHUB_PATH"
          "$llvm/bin/llvm-config" --version
          echo "system libraries: $("$llvm/bin/llvm-config" --link-static --system-libs)"
          # llvm-config names the static libxml2 the release was built with (`xml2s.lib`), which
          # it does not ship. Only LLVMWindowsManifest (lld, llvm-mt) uses it, and jaic links
          # nothing from there, so an empty library satisfies the linker.
          echo "" > "$RUNNER_TEMP/empty.c"
          "$llvm/bin/clang" -c "$RUNNER_TEMP/empty.c" -o "$RUNNER_TEMP/empty.obj"
          "$llvm/bin/llvm-lib" "/out:$(cygpath -w "$llvm/lib/xml2s.lib")" "$(cygpath -w "$RUNNER_TEMP/empty.obj")"
      - name: Build jaic with the LLVM backend
        run: cargo build --locked -p jaic-cli --no-default-features --features static-llvm
      - name: Build and run the Windows test programs natively
        run: |
          mkdir -p native-exes
          python tools/windows_cross.py build --jaic target/debug/jaic.exe --out native-exes --host --keep-going
          python tools/windows_cross.py run --dir native-exes
      - name: Native backend tests
        run: cargo test --locked -p jaic-cli --no-default-features --features static-llvm --test native -- --test-threads 2
