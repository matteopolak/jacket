name: windows native
# Native Windows executables from `jaic build`, for x64 and arm64: built on Windows with the MSVC
# toolchain, and cross-built from Linux with MinGW-w64 (llvm-mingw for arm64) then run on
# Windows. See docs/native/windows.md.
on:
  push:
    branches: ['wip/windows-native', 'ci/windows-arm64']
    paths:
      - 'crates/**'
      - 'stdlib/**'
      - 'prelude/**'
      - 'tests/**'
      - 'tools/windows_cross.py'
      - 'tools/stdlib_runtime.py'
      - 'tools/build_native_libs.py'
      - 'tools/native-libs.json'
      - 'tools/install_ci_mesa_windows.sh'
      - 'tools/fetch_wgpu_native.py'
      - 'tools/test_webgpu_native.py'
      - 'tools/webgpu.json'
      - 'tools/windows-llvm/**'
      - '.github/workflows/windows-native.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: '0'
  LLVM_VERSION: 23.1.2
  # llvm-mingw (https://github.com/mstorsjo/llvm-mingw): the MinGW-w64 toolchain for arm64.
  LLVM_MINGW_VERSION: '20260922'
  # Mesa's llvmpipe software OpenGL for the window tests (the runners only have GDI's OpenGL
  # 1.1): the MSVC build of https://github.com/pal1000/mesa-dist-win, which has x64 and x86
  # DLLs but none for arm64. Its opengl32.dll goes next to the programs (and jaic.exe), which
  # Windows searches before System32.
  MESA_VERSION: 26.1.8
  MESA_SHA256: 4c6d32e653e0ff9ad07796e40c0bcfabf2764d849e3ce4f3b1590112c87e42f9
  GALLIUM_DRIVER: llvmpipe
jobs:
  cross:
    name: cross-build (Linux, MinGW-w64)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install nightly-2026-08-29 --profile minimal
      - name: Install LLVM 23 and MinGW-w64
        timeout-minutes: 15
        run: |
          bash tools/install_ci_llvm_linux.sh
          echo "LLVM_SYS_231_PREFIX=/usr/lib/llvm-23" >> "$GITHUB_ENV"
          sudo apt-get install -y gcc-mingw-w64-x86-64
          x86_64-w64-mingw32-gcc --version
      - name: Build jaic
        run: cargo build --locked -p jaic-cli
      - name: Cross-build the Windows test programs
        run: python3 tools/windows_cross.py build --stdlib --jaic target/debug/jaic --out cross-exes
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cross-exes
          path: cross-exes
          if-no-files-found: error

  run-cross:
    name: run cross-built programs (Windows)
    needs: cross
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cross-exes
          path: cross-exes
      - name: Install Mesa's software OpenGL
        run: bash tools/install_ci_mesa_windows.sh "$RUNNER_TEMP/mesa"
      - name: Run
        run: |
          cp "$RUNNER_TEMP"/mesa/*.dll cross-exes/
          python tools/windows_cross.py run --dir cross-exes

  native:
    name: jaic build on Windows (MSVC)
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      # The official LLVM release is built against the static C runtime (/MT); mixing it with
      # Rust's default dynamic CRT crashes at run time. An explicit target keeps the flag off
      # build scripts and proc macros.
      CARGO_BUILD_TARGET: x86_64-pc-windows-msvc
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install nightly-2026-08-29 --profile minimal
      - name: Install the official LLVM release
        run: |
          curl -fsSL -o llvm.tar.xz "https://github.com/llvm/llvm-project/releases/download/llvmorg-$LLVM_VERSION/clang+llvm-$LLVM_VERSION-x86_64-pc-windows-msvc.tar.xz"
          # GNU tar reads `D:\...` as a remote host: extract to the POSIX spelling of the path.
          llvm="$(cygpath -u "$RUNNER_TEMP")/llvm"
          mkdir -p "$llvm"
          tar -xJf llvm.tar.xz -C "$llvm" --strip-components=1
          rm llvm.tar.xz
          echo "LLVM_SYS_231_PREFIX=$(cygpath -m "$llvm")" >> "$GITHUB_ENV"
          echo "$(cygpath -w "$llvm/bin")" >> "$GITHUB_PATH"
          "$llvm/bin/llvm-config" --version
          echo "system libraries: $("$llvm/bin/llvm-config" --link-static --system-libs)"
          # Supply the static libraries llvm-config names but the archive lacks (libxml2, zstd)
          # and the llvm-config front that llvm-sys needs (docs/tools/llvm-setup.md).
          bash tools/windows-llvm/prepare.sh "$llvm"
      - name: Build jaic with the LLVM backend
        run: cargo build --locked -p jaic-cli --no-default-features --features static-llvm
      - name: Build and run the Windows test programs natively
        run: |
          mkdir -p native-exes
          target/x86_64-pc-windows-msvc/debug/jaic.exe build tests/corpus/positive/integer-control.jai -o native-exes/smoke || echo "jaic exit $?"
          python -u tools/windows_cross.py build --jaic target/x86_64-pc-windows-msvc/debug/jaic.exe --out native-exes --host --keep-going
          python -u tools/windows_cross.py run --dir native-exes
      - name: Install Mesa's software OpenGL
        if: success() || failure()
        run: bash tools/install_ci_mesa_windows.sh "$RUNNER_TEMP/mesa"
      - name: Stdlib runtime tests (interpreter and native) and coverage
        # docs/tools/stdlib-runtime-tests.md; skips for windows-x64 in tests/stdlib-runtime-skips.txt.
        # The third-party libraries (FreeType, stb_*...) are built first (tools/build_native_libs.py).
        if: success() || failure()
        run: |
          cp "$RUNNER_TEMP"/mesa/*.dll target/x86_64-pc-windows-msvc/debug/
          python -u tools/stdlib_runtime.py --jaic target/x86_64-pc-windows-msvc/debug/jaic.exe --platform windows-x64 --modes interp,native --strict --coverage target/stdlib-coverage.txt --dlls "$RUNNER_TEMP/mesa"
          python -u tools/stdlib_coverage.py --record target/stdlib-coverage.txt --platform windows-x64 --check --print-baseline
      - name: A Simp game's metaprogram build without Clang on PATH
        # tests/native/simp-game: first.jai builds src/main.jai (Simp, GL, Input, stb_image) in a
        # workspace and runs build/game.exe. Without LLVM on PATH, and with Git's coreutils
        # `link` in /usr/bin, jaic must skip that `link` and use Visual Studio's link.exe with
        # the LIB it works out (0.4.2 failed with `link: extra operand`). The stb libraries come
        # from the stdlib runtime step's tools/build_native_libs.py run.
        if: success() || failure()
        run: |
          jaic="$PWD/target/x86_64-pc-windows-msvc/debug/jaic.exe"
          game="$RUNNER_TEMP/simp-game"
          cp -R tests/native/simp-game "$game"
          mkdir -p "$game/build"
          cp "$RUNNER_TEMP"/mesa/*.dll "$game/build/"
          cd "$game"
          PATH="$(echo "$PATH" | tr ':' '\n' | grep -vi llvm | paste -sd:)"
          export PATH
          if command -v clang; then echo "clang is still on PATH"; exit 1; fi
          which -a link
          # First with the runner's older Clang in Program Files\LLVM (found off PATH), then
          # with that and Visual Studio's bundled Clang moved away, so link.exe links.
          "$jaic" run first.jai
          vs="$(cygpath -u "$("/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe" -latest -property installationPath)")"
          hidden=()
          for dir in "/c/Program Files/LLVM" "$vs/VC/Tools/Llvm"; do
            if [ -d "$dir" ]; then mv "$dir" "$dir.hidden"; hidden+=("$dir"); fi
          done
          rm -f build/game.exe
          set +e
          "$jaic" run first.jai
          status=$?
          set -e
          for dir in "${hidden[@]}"; do mv "$dir.hidden" "$dir"; done
          test "$status" = 0
          ls -l build
          # The same program under the interpreter (Mesa's opengl32.dll is beside jaic.exe).
          "$jaic" run src/main.jai
      - name: WebGPU without a window (wgpu-native on D3D12's WARP adapter)
        # tests/webgpu/headless.jai interpreted and built; docs/stdlib/webgpu.md#tests.
        if: success() || failure()
        run: python -u tools/test_webgpu_native.py --jaic target/x86_64-pc-windows-msvc/debug/jaic.exe --platform windows-x64 --require-adapter
      - name: WebGPU in a window (HWND surface on WARP, presented)
        # tests/webgpu/window.jai: a Window_Creation window in the runner's interactive desktop
        # session, a DXGI swap chain through wgpu-native's D3D12 backend, frames presented and read back.
        if: success() || failure()
        run: python -u tools/test_webgpu_native.py --jaic target/x86_64-pc-windows-msvc/debug/jaic.exe --platform windows-x64 --require-adapter --test window --frames 120
      - name: Native backend tests
        if: success() || failure()
        run: cargo test --locked -p jaic-cli --no-default-features --features static-llvm --test native -- --test-threads 2

  cross-arm64:
    name: cross-build arm64 (Linux, llvm-mingw)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install nightly-2026-08-29 --profile minimal
      - name: Install LLVM 23 and llvm-mingw
        timeout-minutes: 15
        run: |
          bash tools/install_ci_llvm_linux.sh
          echo "LLVM_SYS_231_PREFIX=/usr/lib/llvm-23" >> "$GITHUB_ENV"
          name="llvm-mingw-$LLVM_MINGW_VERSION-ucrt-ubuntu-22.04-x86_64"
          curl -fsSL -o llvm-mingw.tar.xz "https://github.com/mstorsjo/llvm-mingw/releases/download/$LLVM_MINGW_VERSION/$name.tar.xz"
          mkdir -p "$RUNNER_TEMP/llvm-mingw"
          tar -xJf llvm-mingw.tar.xz -C "$RUNNER_TEMP/llvm-mingw" --strip-components=1
          rm llvm-mingw.tar.xz
          echo "$RUNNER_TEMP/llvm-mingw/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/llvm-mingw/bin/aarch64-w64-mingw32-clang" --version
      - name: Build jaic
        run: cargo build --locked -p jaic-cli
      - name: Cross-build the Windows test programs for arm64
        run: python3 tools/windows_cross.py build --stdlib --cpu arm64 --jaic target/debug/jaic --out cross-arm64-exes
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cross-arm64-exes
          path: cross-arm64-exes
          if-no-files-found: error

  run-cross-arm64:
    name: run cross-built programs (Windows arm64)
    needs: cross-arm64
    runs-on: windows-11-arm
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cross-arm64-exes
          path: cross-arm64-exes
      - name: Run
        run: python tools/windows_cross.py run --dir cross-arm64-exes

  native-arm64:
    name: jaic build on Windows arm64 (MSVC)
    runs-on: windows-11-arm
    timeout-minutes: 90
    env:
      # As on x64: the official LLVM release uses the static C runtime.
      CARGO_BUILD_TARGET: aarch64-pc-windows-msvc
      CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install rustup and the pinned toolchain
        run: |
          if ! command -v rustup > /dev/null; then
            curl -fsSL -o "$RUNNER_TEMP/rustup-init.exe" https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe
            "$RUNNER_TEMP/rustup-init.exe" -y --default-toolchain none --profile minimal
            echo "$USERPROFILE\\.cargo\\bin" >> "$GITHUB_PATH"
            export PATH="$PATH:$(cygpath -u "$USERPROFILE")/.cargo/bin"
          fi
          rustup toolchain install nightly-2026-08-29 --profile minimal
      - name: Install the official LLVM release (arm64)
        run: |
          curl -fsSL -o llvm.tar.xz "https://github.com/llvm/llvm-project/releases/download/llvmorg-$LLVM_VERSION/clang+llvm-$LLVM_VERSION-aarch64-pc-windows-msvc.tar.xz"
          llvm="$(cygpath -u "$RUNNER_TEMP")/llvm"
          mkdir -p "$llvm"
          tar -xJf llvm.tar.xz -C "$llvm" --strip-components=1
          rm llvm.tar.xz
          echo "LLVM_SYS_231_PREFIX=$(cygpath -m "$llvm")" >> "$GITHUB_ENV"
          echo "$(cygpath -w "$llvm/bin")" >> "$GITHUB_PATH"
          "$llvm/bin/llvm-config" --version
          echo "system libraries: $("$llvm/bin/llvm-config" --link-static --system-libs)"
          # As on x64 (see the x64 job).
          bash tools/windows-llvm/prepare.sh "$llvm"
      - name: Build jaic with the LLVM backend
        run: cargo build --locked -p jaic-cli --no-default-features --features static-llvm
      - name: Build and run the Windows test programs natively
        run: |
          mkdir -p native-exes
          target/aarch64-pc-windows-msvc/debug/jaic.exe build tests/corpus/positive/integer-control.jai -o native-exes/smoke || echo "jaic exit $?"
          python -u tools/windows_cross.py build --jaic target/aarch64-pc-windows-msvc/debug/jaic.exe --out native-exes --host --keep-going
          python -u tools/windows_cross.py run --dir native-exes
      - name: Interpreter variadic foreign calls
        if: success() || failure()
        run: |
          out="$(target/aarch64-pc-windows-msvc/debug/jaic.exe run tests/native/windows/variadic.jai | tr -d '\r')"
          echo "$out"
          test "$out" = ok
      - name: Stdlib runtime tests (interpreter and native) and coverage
        # As on x64, with the windows-arm64 skips.
        if: success() || failure()
        run: |
          python -u tools/stdlib_runtime.py --jaic target/aarch64-pc-windows-msvc/debug/jaic.exe --platform windows-arm64 --modes interp,native --strict --coverage target/stdlib-coverage.txt
          python -u tools/stdlib_coverage.py --record target/stdlib-coverage.txt --platform windows-arm64 --check --print-baseline
      - name: WebGPU without a window (wgpu-native on D3D12's WARP adapter)
        if: success() || failure()
        run: python -u tools/test_webgpu_native.py --jaic target/aarch64-pc-windows-msvc/debug/jaic.exe --platform windows-arm64 --require-adapter
      - name: WebGPU in a window (HWND surface on WARP, presented)
        if: success() || failure()
        run: python -u tools/test_webgpu_native.py --jaic target/aarch64-pc-windows-msvc/debug/jaic.exe --platform windows-arm64 --require-adapter --test window --frames 120
      - name: Native backend tests
        if: success() || failure()
        run: cargo test --locked -p jaic-cli --no-default-features --features static-llvm --test native -- --test-threads 2
