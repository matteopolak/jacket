name: windows native
# Native Windows executables from `jaic`, for x64 and arm64: built on Windows with the MSVC
# toolchain, and cross-built from Linux with MinGW-w64 (llvm-mingw for arm64) then run on
# Windows. See docs/native/windows.md.
#
# Pushes to the two branches run everything their `paths` filter admits. Pushes to `main` pass
# the same (broad) filter, which cannot differ per branch, and are then narrowed by the `changes`
# job to the Io, Io_Uring, Http, Json, Tls, Windows, jaic-llvm, interpreter, CLI and native test paths
# plus this file, so the Windows runners are not spent on every stdlib or compiler change.
on:
  push:
    branches: ['main', 'wip/windows-native', 'ci/windows-arm64', 'codex/cleanroom-integration']
    paths:
      - 'crates/**'
      - 'stdlib/**'
      - 'tests/**'
      - 'tools/windows_cross.py'
      - 'tools/test_windows_resource_fixture.py'
      - 'tools/build_windows_resource_fixture.py'
      - 'tools/install_ci_native_linux.sh'
      - 'tools/check_windows_d3dcompiler_provider.py'
      - 'tools/test_windows_d3dcompiler_provider.py'
      - 'tools/test_windows_d3dcompiler_ci.py'
      - 'tools/check_file_watcher_platforms.py'
      - 'tools/check_windows_time_zone.py'
      - 'tools/stdlib_runtime.py'
      - 'tools/build_native_libs.py'
      - 'tools/test_windows_dynamic_package.py'
      - 'tools/native-libs.json'
      - 'tools/install_ci_mesa_windows.sh'
      - 'tools/fetch_wgpu_native.py'
      - 'tools/test_webgpu_native.py'
      - 'tools/webgpu.json'
      - 'tools/windows-llvm/**'
      - 'tools/upstream_smoke.py'
      - 'tools/audio_build_native.py'
      - 'tools/build_portable_runtime.py'
      - 'tools/upstream_native.py'
      - 'tools/upstream-smoke.json'
      - 'tools/fetch_upstreams.py'
      - '.github/workflows/windows-native.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_INCREMENTAL: '0'
  LLVM_VERSION: 23.1.2
  # llvm-mingw (https://github.com/mstorsjo/llvm-mingw): the MinGW-w64 toolchain for arm64.
  LLVM_MINGW_VERSION: '20260922'
  # Mesa's llvmpipe software OpenGL for the window tests (the runners only have GDI's OpenGL
  # 1.1): the MSVC build of https://github.com/pal1000/mesa-dist-win, which has x64 and x86
  # DLLs but none for arm64. Its opengl32.dll goes next to the programs (and jaic.exe), which
  # Windows searches before System32.
  MESA_VERSION: 26.1.8
  MESA_SHA256: 4c6d32e653e0ff9ad07796e40c0bcfabf2764d849e3ce4f3b1590112c87e42f9
  GALLIUM_DRIVER: llvmpipe
jobs:
  changes:
    # Gate for pushes to main: run the Windows jobs only when a path that main's Windows coverage
    # is for changed. Other refs and manual runs always run. If the range cannot be diffed (a new
    # branch, a forced push), run rather than skip.
    name: select what runs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.select.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compare the pushed range with the main-only paths
        id: select
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" != push ] || [ "$REF" != refs/heads/main ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! files="$(git diff --name-only "$BEFORE" "$SHA" 2>/dev/null)"; then
            echo "cannot diff $BEFORE..$SHA; running"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$files"
          if echo "$files" | grep -Eq '^(stdlib/Extensions/(Io|Io_Uring|Http|Json|Tls)/|tools/native/mbedtls/|stdlib/Windows/|stdlib/File_Watcher/|stdlib/internal/watching/|tools/check_(file_watcher_platforms|windows_time_zone)\.py$|tools/(build_windows_resource_fixture|test_windows_resource_fixture|install_ci_native_linux|upstream_native|upstream_smoke|build_portable_runtime|audio_build_native|build_native_libs|stdlib_runtime|test_windows_dynamic_package)\.(py|sh)$|crates/jaic-llvm/|crates/jaic/src/interp/|crates/jaic-cli/src/|crates/jaic-cli/tests/native\.rs$|tests/native/|\.github/workflows/windows-native\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "no Io, Http, Json, Tls, Windows, LLVM backend, interpreter or native test change; skipping"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  cross:
    name: cross-build (Linux, MinGW-w64)
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_TARGET_DIR: target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install nightly-2026-08-29 --profile minimal
      - name: Install LLVM 23 and MinGW-w64
        timeout-minutes: 15
        run: |
          bash tools/install_ci_llvm_linux.sh
          bash tools/install_ci_native_linux.sh
          echo "LLVM_SYS_231_PREFIX=/usr/lib/llvm-23" >> "$GITHUB_ENV"
          sudo apt-get install -y gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64
          x86_64-w64-mingw32-gcc --version
          x86_64-w64-mingw32-g++ --version
      - name: Build jaic
        run: cargo build --locked -p jaic-cli
      - name: Build the real x64 resource-only PE fixture
        run: python3 tools/build_windows_resource_fixture.py --cpu x64 --out cross-exes/resource-fixture --rc /usr/lib/llvm-23/bin/llvm-rc --linker /usr/lib/llvm-23/bin/lld-link --readobj /usr/lib/llvm-23/bin/llvm-readobj
      - name: Cross-build the Windows test programs
        # --stdlib first cross-builds the third-party C libraries (stb_*, FreeType, lz4, ...) with
        # MinGW-w64 as static archives (tools/build_native_libs.py --platform windows-x64-mingw).
        run: python3 tools/windows_cross.py build --stdlib --jaic target/debug/jaic --out cross-exes
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cross-exes
          path: cross-exes
          if-no-files-found: error

  run-cross:
    name: run cross-built programs (Windows)
    needs: cross
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cross-exes
          path: cross-exes
      - name: Install Mesa's software OpenGL
        run: bash tools/install_ci_mesa_windows.sh "$RUNNER_TEMP/mesa"
      - name: Verify downloaded x64 resource fixture
        run: |
          python -c 'import hashlib,json,pathlib; p=pathlib.Path("cross-exes/resource-fixture"); r=json.loads((p/"fixture-receipt.json").read_text()); assert r["status"]=="verified_cross_build" and r["cpu"]=="x64"; assert all(hashlib.sha256((p/n).read_bytes()).hexdigest()==v["sha256"] for n,v in r["artifacts"].items())'
          printf 'JAIC_TEST_WINDOWS_RESOURCE_DIR=%s\n' "$(cygpath -m "$PWD/cross-exes/resource-fixture")" >> "$GITHUB_ENV"
      - name: Run
        run: |
          cp "$RUNNER_TEMP"/mesa/*.dll cross-exes/
          python tools/windows_cross.py run --dir cross-exes

  native:
    name: jaic on Windows (MSVC)
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      # The official LLVM release is built against the static C runtime (/MT); mixing it with
      # Rust's default dynamic CRT crashes at run time. An explicit target keeps the flag off
      # build scripts and proc macros.
      CARGO_BUILD_TARGET: x86_64-pc-windows-msvc
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install nightly-2026-08-29 --profile minimal
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Verify the WASI runner prerequisite
        run: node --version
      - name: Install the official LLVM release
        run: |
          curl -fsSL -o llvm.tar.xz "https://github.com/llvm/llvm-project/releases/download/llvmorg-$LLVM_VERSION/clang+llvm-$LLVM_VERSION-x86_64-pc-windows-msvc.tar.xz"
          # GNU tar reads `D:\...` as a remote host: extract to the POSIX spelling of the path.
          llvm="$(cygpath -u "$RUNNER_TEMP")/llvm"
          mkdir -p "$llvm"
          tar -xJf llvm.tar.xz -C "$llvm" --strip-components=1
          rm llvm.tar.xz
          echo "LLVM_SYS_231_PREFIX=$(cygpath -m "$llvm")" >> "$GITHUB_ENV"
          cygpath -w "$llvm/bin" >> "$GITHUB_PATH"
          test -x "$llvm/bin/wasm-ld.exe"
          echo "JAIC_WASM_LD=$(cygpath -m "$llvm/bin/wasm-ld.exe")" >> "$GITHUB_ENV"
          "$llvm/bin/llvm-config" --version
          echo "system libraries: $("$llvm/bin/llvm-config" --link-static --system-libs)"
          # Supply the static libraries llvm-config names but the archive lacks (libxml2, zstd)
          # and the llvm-config front that llvm-sys needs (docs/tools/llvm-setup.md).
          bash tools/windows-llvm/prepare.sh "$llvm"
      - name: Build jaic with the LLVM backend
        run: cargo build --locked -p jaic-cli -p jailint --no-default-features --features static-llvm
      - name: Check Windows dynamic package identities
        run: TMPDIR="$RUNNER_TEMP" PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tools -p test_windows_dynamic_package.py -v
      - name: Build matching Windows runtime provider and expose normal DLL search
        run: |
          python -u tools/build_platform_io_runtime.py --stdlib stdlib --cpu x64
          python -u tools/build_developer_debug.py
          sha256sum stdlib/internal/runtime/crash-native/runtime-windows.c stdlib/internal/runtime/crash-native/stack-iteration.h stdlib/internal/runtime/crash-native/platform_io_windows_crash.dll stdlib/internal/runtime/crash-native/platform_io_windows_crash.lib
          cygpath -w "$PWD/stdlib/internal/runtime/crash-native" >> "$GITHUB_PATH"
      - name: Check normal Windows runtime provider loading
        run: |
          mkdir -p target/provider-load
          clang --target=x86_64-pc-windows-msvc -std=c11 -Wall -Wextra -Werror tests/native-provider/windows-provider-load.c -o target/provider-load/provider-load.exe
          target/provider-load/provider-load.exe "$(cygpath -m "$PWD/stdlib/internal/runtime/crash-native/platform_io_windows_crash.dll")" platform_io_windows_crash_prepare
      - name: Platform I/O (interpreter and native O0/O2)
        if: success() || failure()
        run: python -u tools/check_platform_io.py --jaic target/x86_64-pc-windows-msvc/debug/jaic.exe --stdlib stdlib --native --windows-crash
      - name: Reviewed Windows Socket calendar and shared-channel execution
        if: success() || failure()
        run: |
          python -u tools/check_portable_windows_socket.py --jaic target/x86_64-pc-windows-msvc/debug/jaic.exe --stdlib stdlib --native
          python -u tools/check_portable_windows_calendar.py --jaic target/x86_64-pc-windows-msvc/debug/jaic.exe --stdlib stdlib --native
          python -u tools/check_portable_windows_channel.py --jaic target/x86_64-pc-windows-msvc/debug/jaic.exe --stdlib stdlib --native
      - name: Build matching caller-owned Windows resource fixture
        run: |
          python tools/build_windows_resource_fixture.py --cpu x64 --out "$RUNNER_TEMP/windows-resources-x64"
          printf 'JAIC_TEST_WINDOWS_RESOURCE_DIR=%s\n' "$(cygpath -m "$RUNNER_TEMP/windows-resources-x64")" >> "$GITHUB_ENV"
      - name: Build and run the Windows test programs natively
        run: |
          mkdir -p native-exes
          target/x86_64-pc-windows-msvc/debug/jaic.exe tests/corpus/positive/integer-control.jai -exe native-exes/smoke
          python -u tools/windows_cross.py build --jaic target/x86_64-pc-windows-msvc/debug/jaic.exe --out native-exes --host --keep-going
          python -u tools/windows_cross.py run --dir native-exes
      - name: Install Mesa's software OpenGL
        if: success() || failure()
        run: bash tools/install_ci_mesa_windows.sh "$RUNNER_TEMP/mesa"
      - name: Stdlib runtime tests (interpreter and native) and coverage
        # Reviewed contracts and retained independent regressions; all supported cases are required.
        # The third-party libraries (FreeType, stb_*...) are built first (tools/build_native_libs.py).
        if: success() || failure()
        run: |
          cp "$RUNNER_TEMP"/mesa/*.dll target/x86_64-pc-windows-msvc/debug/
          python -u tools/stdlib_runtime.py --jaic target/x86_64-pc-windows-msvc/debug/jaic.exe --platform windows-x64 --modes interp,native --strict --coverage target/stdlib-coverage.txt --dlls "$RUNNER_TEMP/mesa"
          python -u tools/stdlib_coverage.py --record target/stdlib-coverage.txt --platform windows-x64
      - name: Reviewed contract native O2
        if: success() || failure()
        run: python -u tests/stdlib-contract/run.py --jaic "$PWD/target/x86_64-pc-windows-msvc/debug/jaic.exe" --stdlib-root "$PWD/stdlib" --mode native --opt O2
      - name: Reviewed data resource discovery and Icon effects
        if: success() || failure()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installation = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'Visual Studio native SDK tools are required' }
          & (Join-Path $installation 'Common7/Tools/Launch-VsDevShell.ps1') -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          $env:JAIC_STDLIB = (Resolve-Path stdlib).Path
          $compiler = 'target/x86_64-pc-windows-msvc/debug/jaic.exe'
          & $compiler jaifmt/main.jai -O2 -exe target/jaifmt.exe
          if ($LASTEXITCODE -ne 0) { throw 'Production formatter build failed' }
          python tests/portable-data/build_windows_images.py --cpu x64
          if ($LASTEXITCODE -ne 0) { throw 'Pinned native image SDK build failed' }
          python -u tests/portable-data/run.py --compiler $compiler --linter target/x86_64-pc-windows-msvc/debug/jailint.exe --formatter target/jaifmt.exe
          if ($LASTEXITCODE -ne 0) { throw 'Native data/resource suite failed' }
      - name: A Simp game's metaprogram build without Clang on PATH
        # tests/native/simp-game: first.jai builds src/main.jai (Simp, GL, Input, stb_image) in a
        # workspace and runs build/game.exe. Without LLVM on PATH, and with Git's coreutils
        # `link` in /usr/bin, jaic must skip that `link` and use Visual Studio's link.exe with
        # the LIB it works out (0.4.2 failed with `link: extra operand`). The stb libraries come
        # from the stdlib runtime step's tools/build_native_libs.py run.
        if: success() || failure()
        run: |
          jaic="$PWD/target/x86_64-pc-windows-msvc/debug/jaic.exe"
          game="$RUNNER_TEMP/simp-game"
          cp -R tests/native/simp-game "$game"
          mkdir -p "$game/build"
          cp "$RUNNER_TEMP"/mesa/*.dll "$game/build/"
          cd "$game"
          PATH="$(echo "$PATH" | tr ':' '\n' | grep -vi llvm | paste -sd:)"
          export PATH
          if command -v clang; then echo "clang is still on PATH"; exit 1; fi
          which -a link
          # First with the runner's older Clang in Program Files\LLVM (found off PATH), then
          # with that and Visual Studio's bundled Clang moved away, so link.exe links.
          "$jaic" first.jai -interp
          vs="$(cygpath -u "$("/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe" -latest -property installationPath)")"
          hidden=()
          for dir in "/c/Program Files/LLVM" "$vs/VC/Tools/Llvm"; do
            if [ -d "$dir" ]; then mv "$dir" "$dir.hidden"; hidden+=("$dir"); fi
          done
          rm -f build/game.exe
          set +e
          "$jaic" first.jai -interp
          status=$?
          set -e
          for dir in "${hidden[@]}"; do mv "$dir.hidden" "$dir"; done
          test "$status" = 0
          ls -l build
          # The same program under the interpreter (Mesa's opengl32.dll is beside jaic.exe).
          "$jaic" src/main.jai -interp
      - name: Actual SDK D3DCompiler provider and interpreter identity
        if: success() || failure()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m unittest discover -s tools -p 'test_windows_d3dcompiler*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'D3DCompiler diagnostic policy tests failed' }
          $installation = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'Visual Studio native SDK tools are required' }
          & (Join-Path $installation 'Common7/Tools/Launch-VsDevShell.ps1') -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          $importLibrary = $env:LIB.Split(';') | ForEach-Object { Join-Path $_ 'd3dcompiler.lib' } | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if (-not $importLibrary) { throw 'Selected SDK LIB search has no d3dcompiler.lib' }
          python -u tools/check_windows_d3dcompiler_provider.py --jaic target/x86_64-pc-windows-msvc/debug/jaic.exe --stdlib stdlib --import-library "$importLibrary" --report target/d3dcompiler-amd64/provider.json
          if ($LASTEXITCODE -ne 0) { throw 'Actual D3DCompiler provider interpreter/native check failed' }
      - name: WebGPU without a window (wgpu-native on D3D12's WARP adapter)
        # tests/webgpu/headless.jai interpreted and built; docs/extensions/webgpu.md#tests.
        if: success() || failure()
        run: python -u tools/test_webgpu_native.py --jaic target/x86_64-pc-windows-msvc/debug/jaic.exe --platform windows-x64 --require-adapter
      - name: WebGPU in a window (HWND surface on WARP, presented)
        # tests/webgpu/window.jai: a Window_Creation window in the runner's interactive desktop
        # session, a DXGI swap chain through wgpu-native's D3D12 backend, frames presented and read back.
        if: success() || failure()
        run: python -u tools/test_webgpu_native.py --jaic target/x86_64-pc-windows-msvc/debug/jaic.exe --platform windows-x64 --require-adapter --test window --frames 120
      - name: Native WGL driver diagnostics and public rendering
        if: success() || failure()
        run: |
          mkdir -p artifacts/native-libs/windows-x64
          python -u tools/window_render_wgl_ci.py --jaic target/x86_64-pc-windows-msvc/debug/jaic.exe --jailint target/x86_64-pc-windows-msvc/debug/jailint.exe --stdlib stdlib --native-libs artifacts/native-libs/windows-x64 --driver-dir "$RUNNER_TEMP/mesa" --consumer-dir native-exes
      - name: Signed mouse wheel event propagation (issue 1)
        if: success() || failure()
        run: |
          target/x86_64-pc-windows-msvc/debug/jaic.exe tests/window-render/signed-wheel-windows.jai -interp
          target/x86_64-pc-windows-msvc/debug/jaic.exe tests/window-render/signed-wheel-windows.jai -exe native-exes/signed-wheel
          native-exes/signed-wheel.exe
      - name: Public renderer wheel propagation interpreter (issue 1)
        if: success() || failure()
        run: target/x86_64-pc-windows-msvc/debug/jaic.exe tests/window-render/windows-render-events.jai -interp
      - name: Public renderer wheel propagation native O0 (issue 1)
        if: success() || failure()
        run: |
          target/x86_64-pc-windows-msvc/debug/jaic.exe tests/window-render/windows-render-events.jai -O0 -exe native-exes/render-wheel-O0
          native-exes/render-wheel-O0.exe
      - name: Public renderer wheel propagation native O2 (issue 1)
        if: success() || failure()
        run: |
          target/x86_64-pc-windows-msvc/debug/jaic.exe tests/window-render/windows-render-events.jai -O2 -exe native-exes/render-wheel-O2
          native-exes/render-wheel-O2.exe
      - name: Native backend tests
        if: success() || failure()
        run: cargo test --locked -p jaic-cli --no-default-features --features static-llvm --test native -- --test-threads 2
      - name: Native File_Watcher and Windows time-zone SDK ABI fixtures
        if: success() || failure()
        shell: pwsh
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          $ErrorActionPreference = 'Stop'
          $installation = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'Visual Studio native SDK tools are required' }
          & (Join-Path $installation 'Common7/Tools/Launch-VsDevShell.ps1') -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          python -u tools/check_file_watcher_platforms.py --compiler target/x86_64-pc-windows-msvc/debug/jaic.exe --linter target/x86_64-pc-windows-msvc/debug/jailint.exe --formatter target/jaifmt.exe --native-runtime
          $watcherExit = $LASTEXITCODE
          python -u tools/check_windows_time_zone.py --compiler target/x86_64-pc-windows-msvc/debug/jaic.exe --linter target/x86_64-pc-windows-msvc/debug/jailint.exe --formatter target/jaifmt.exe --sdk-runtime
          $abiExit = $LASTEXITCODE
          if ($watcherExit -ne 0 -or $abiExit -ne 0) { throw 'Native File_Watcher or SDK time-zone ABI suite failed' }

  upstream-smoke:
    # The third-party projects of ci.yml's job of the same name, built and run on Windows with the
    # interactive desktop and Mesa's software OpenGL (docs/tools/third-party-smoke-test.md).
    name: third-party projects (Windows x64)
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      CARGO_BUILD_TARGET: x86_64-pc-windows-msvc
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install nightly-2026-08-29 --profile minimal
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Verify the WASI runner prerequisite
        run: node --version
      - name: Install the official LLVM release
        run: |
          curl -fsSL -o llvm.tar.xz "https://github.com/llvm/llvm-project/releases/download/llvmorg-$LLVM_VERSION/clang+llvm-$LLVM_VERSION-x86_64-pc-windows-msvc.tar.xz"
          llvm="$(cygpath -u "$RUNNER_TEMP")/llvm"
          mkdir -p "$llvm"
          tar -xJf llvm.tar.xz -C "$llvm" --strip-components=1
          rm llvm.tar.xz
          echo "LLVM_SYS_231_PREFIX=$(cygpath -m "$llvm")" >> "$GITHUB_ENV"
          cygpath -w "$llvm/bin" >> "$GITHUB_PATH"
          test -x "$llvm/bin/wasm-ld.exe"
          echo "JAIC_WASM_LD=$(cygpath -m "$llvm/bin/wasm-ld.exe")" >> "$GITHUB_ENV"
          bash tools/windows-llvm/prepare.sh "$llvm"
      - name: Build jaic with the LLVM backend
        run: cargo build --release --locked -p jaic-cli --no-default-features --features static-llvm
      - name: Check Windows dynamic package identities
        run: TMPDIR="$RUNNER_TEMP" PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tools -p test_windows_dynamic_package.py -v
      - name: Build matching Windows runtime provider and expose normal DLL search
        run: |
          python -u tools/build_platform_io_runtime.py --stdlib stdlib --cpu x64
          python -u tools/build_developer_debug.py
          sha256sum stdlib/internal/runtime/crash-native/runtime-windows.c stdlib/internal/runtime/crash-native/stack-iteration.h stdlib/internal/runtime/crash-native/platform_io_windows_crash.dll stdlib/internal/runtime/crash-native/platform_io_windows_crash.lib
          cygpath -w "$PWD/stdlib/internal/runtime/crash-native" >> "$GITHUB_PATH"
      - name: Check normal Windows runtime provider loading
        run: |
          mkdir -p target/provider-load
          clang --target=x86_64-pc-windows-msvc -std=c11 -Wall -Wextra -Werror tests/native-provider/windows-provider-load.c -o target/provider-load/provider-load.exe
          target/provider-load/provider-load.exe "$(cygpath -m "$PWD/stdlib/internal/runtime/crash-native/platform_io_windows_crash.dll")" platform_io_windows_crash_prepare
      - name: Install Mesa's software OpenGL
        run: bash tools/install_ci_mesa_windows.sh "$RUNNER_TEMP/mesa"
      - name: Fetch the pinned projects
        run: |
          project_list="$(python tools/upstream_smoke.py --jaic x --projects)"
          read -r -a project_names <<< "$project_list"
          python tools/fetch_upstreams.py --only "${project_names[@]}"
      - name: Build and run the projects
        run: python -u tools/upstream_smoke.py --jaic target/x86_64-pc-windows-msvc/release/jaic.exe --platform windows-x64 --dlls "$RUNNER_TEMP/mesa"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() && !cancelled() }}
        with:
          name: smoke-screenshots-windows-x64
          path: target/smoke-screenshots
          if-no-files-found: ignore

  cross-arm64:
    name: cross-build arm64 (Linux, llvm-mingw)
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_TARGET_DIR: target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install nightly-2026-08-29 --profile minimal
      - name: Install LLVM 23 and llvm-mingw
        timeout-minutes: 15
        run: |
          bash tools/install_ci_llvm_linux.sh
          bash tools/install_ci_native_linux.sh
          echo "LLVM_SYS_231_PREFIX=/usr/lib/llvm-23" >> "$GITHUB_ENV"
          name="llvm-mingw-$LLVM_MINGW_VERSION-ucrt-ubuntu-22.04-x86_64"
          curl -fsSL -o llvm-mingw.tar.xz "https://github.com/mstorsjo/llvm-mingw/releases/download/$LLVM_MINGW_VERSION/$name.tar.xz"
          mkdir -p "$RUNNER_TEMP/llvm-mingw"
          tar -xJf llvm-mingw.tar.xz -C "$RUNNER_TEMP/llvm-mingw" --strip-components=1
          rm llvm-mingw.tar.xz
          echo "$RUNNER_TEMP/llvm-mingw/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/llvm-mingw/bin/aarch64-w64-mingw32-clang" --version
      - name: Build jaic
        run: cargo build --locked -p jaic-cli
      - name: Build the real arm64 resource-only PE fixture
        run: python3 tools/build_windows_resource_fixture.py --cpu arm64 --out cross-arm64-exes/resource-fixture --rc /usr/lib/llvm-23/bin/llvm-rc --linker /usr/lib/llvm-23/bin/lld-link --readobj /usr/lib/llvm-23/bin/llvm-readobj
      - name: Cross-build the Windows test programs for arm64
        # The third-party C libraries are cross-built with llvm-mingw first (--platform windows-arm64-mingw).
        run: python3 tools/windows_cross.py build --stdlib --cpu arm64 --jaic target/debug/jaic --out cross-arm64-exes
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cross-arm64-exes
          path: cross-arm64-exes
          if-no-files-found: error

  run-cross-arm64:
    name: run cross-built programs (Windows arm64)
    needs: cross-arm64
    runs-on: windows-11-arm
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cross-arm64-exes
          path: cross-arm64-exes
      - name: Verify downloaded arm64 resource fixture
        run: |
          python -c 'import hashlib,json,pathlib; p=pathlib.Path("cross-arm64-exes/resource-fixture"); r=json.loads((p/"fixture-receipt.json").read_text()); assert r["status"]=="verified_cross_build" and r["cpu"]=="arm64"; assert all(hashlib.sha256((p/n).read_bytes()).hexdigest()==v["sha256"] for n,v in r["artifacts"].items())'
          printf 'JAIC_TEST_WINDOWS_RESOURCE_DIR=%s\n' "$(cygpath -m "$PWD/cross-arm64-exes/resource-fixture")" >> "$GITHUB_ENV"
      - name: Run
        run: python tools/windows_cross.py run --dir cross-arm64-exes

  native-arm64:
    name: jaic on Windows arm64 (MSVC)
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: windows-11-arm
    timeout-minutes: 120
    env:
      # As on x64: the official LLVM release uses the static C runtime.
      CARGO_BUILD_TARGET: aarch64-pc-windows-msvc
      CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install rustup and the pinned toolchain
        run: |
          if ! command -v rustup > /dev/null; then
            curl -fsSL -o "$RUNNER_TEMP/rustup-init.exe" https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe
            "$RUNNER_TEMP/rustup-init.exe" -y --default-toolchain none --profile minimal
            printf '%s\n' "$USERPROFILE\\.cargo\\bin" >> "$GITHUB_PATH"
            user_cargo="$(cygpath -u "$USERPROFILE")/.cargo/bin"
            export PATH="$PATH:$user_cargo"
          fi
          rustup toolchain install nightly-2026-08-29 --profile minimal
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Verify the WASI runner prerequisite
        run: node --version
      - name: Install the official LLVM release (arm64)
        run: |
          curl -fsSL -o llvm.tar.xz "https://github.com/llvm/llvm-project/releases/download/llvmorg-$LLVM_VERSION/clang+llvm-$LLVM_VERSION-aarch64-pc-windows-msvc.tar.xz"
          llvm="$(cygpath -u "$RUNNER_TEMP")/llvm"
          mkdir -p "$llvm"
          tar -xJf llvm.tar.xz -C "$llvm" --strip-components=1
          rm llvm.tar.xz
          echo "LLVM_SYS_231_PREFIX=$(cygpath -m "$llvm")" >> "$GITHUB_ENV"
          cygpath -w "$llvm/bin" >> "$GITHUB_PATH"
          test -x "$llvm/bin/wasm-ld.exe"
          echo "JAIC_WASM_LD=$(cygpath -m "$llvm/bin/wasm-ld.exe")" >> "$GITHUB_ENV"
          "$llvm/bin/llvm-config" --version
          echo "system libraries: $("$llvm/bin/llvm-config" --link-static --system-libs)"
          # As on x64 (see the x64 job).
          bash tools/windows-llvm/prepare.sh "$llvm"
      - name: Build jaic with the LLVM backend
        run: cargo build --locked -p jaic-cli -p jailint --no-default-features --features static-llvm
      - name: Check Windows dynamic package identities
        run: TMPDIR="$RUNNER_TEMP" PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tools -p test_windows_dynamic_package.py -v
      - name: Build matching Windows runtime provider and expose normal DLL search
        run: |
          python -u tools/build_platform_io_runtime.py --stdlib stdlib --cpu arm64
          python -u tools/build_developer_debug.py
          sha256sum stdlib/internal/runtime/crash-native/runtime-windows-arm64.c stdlib/internal/runtime/crash-native/platform_io_windows_crash.dll stdlib/internal/runtime/crash-native/platform_io_windows_crash.lib
          cygpath -w "$PWD/stdlib/internal/runtime/crash-native" >> "$GITHUB_PATH"
      - name: Check normal Windows runtime provider loading
        run: |
          mkdir -p target/provider-load
          clang --target=aarch64-pc-windows-msvc -std=c11 -Wall -Wextra -Werror tests/native-provider/windows-provider-load.c -o target/provider-load/provider-load.exe
          target/provider-load/provider-load.exe "$(cygpath -m "$PWD/stdlib/internal/runtime/crash-native/platform_io_windows_crash.dll")" platform_io_arm64_crash_init
      - name: Platform I/O (interpreter and native O0/O2)
        if: success() || failure()
        run: python -u tools/check_platform_io.py --jaic target/aarch64-pc-windows-msvc/debug/jaic.exe --stdlib stdlib --native --windows-crash
      - name: Reviewed Windows Socket calendar and shared-channel execution
        if: success() || failure()
        run: |
          python -u tools/check_portable_windows_socket.py --jaic target/aarch64-pc-windows-msvc/debug/jaic.exe --stdlib stdlib --native
          python -u tools/check_portable_windows_calendar.py --jaic target/aarch64-pc-windows-msvc/debug/jaic.exe --stdlib stdlib --native
          python -u tools/check_portable_windows_channel.py --jaic target/aarch64-pc-windows-msvc/debug/jaic.exe --stdlib stdlib --native
      - name: Build matching caller-owned Windows resource fixture
        run: |
          python tools/build_windows_resource_fixture.py --cpu arm64 --out "$RUNNER_TEMP/windows-resources-arm64"
          printf 'JAIC_TEST_WINDOWS_RESOURCE_DIR=%s\n' "$(cygpath -m "$RUNNER_TEMP/windows-resources-arm64")" >> "$GITHUB_ENV"
      - name: Build and run the Windows test programs natively
        run: |
          mkdir -p native-exes
          target/aarch64-pc-windows-msvc/debug/jaic.exe tests/corpus/positive/integer-control.jai -exe native-exes/smoke
          python -u tools/windows_cross.py build --jaic target/aarch64-pc-windows-msvc/debug/jaic.exe --out native-exes --host --keep-going
          python -u tools/windows_cross.py run --dir native-exes
      - name: Interpreter variadic foreign calls
        if: success() || failure()
        run: |
          out="$(target/aarch64-pc-windows-msvc/debug/jaic.exe tests/native/windows/variadic.jai -interp | tr -d '\r')"
          echo "$out"
          test "$out" = ok
      - name: Actual SDK D3DCompiler provider and interpreter identity
        if: success() || failure()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m unittest discover -s tools -p 'test_windows_d3dcompiler*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'D3DCompiler diagnostic policy tests failed' }
          $installation = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'Visual Studio native SDK tools are required' }
          & (Join-Path $installation 'Common7/Tools/Launch-VsDevShell.ps1') -Arch arm64 -HostArch amd64 -SkipAutomaticLocation
          $importLibrary = $env:LIB.Split(';') | ForEach-Object { Join-Path $_ 'd3dcompiler.lib' } | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if (-not $importLibrary) { throw 'Selected SDK LIB search has no d3dcompiler.lib' }
          python -u tools/check_windows_d3dcompiler_provider.py --jaic target/aarch64-pc-windows-msvc/debug/jaic.exe --stdlib stdlib --import-library "$importLibrary" --report target/d3dcompiler-arm64/provider.json
          if ($LASTEXITCODE -ne 0) { throw 'Actual D3DCompiler provider interpreter/native check failed' }
      - name: WebGPU without a window (wgpu-native on D3D12's WARP adapter)
        if: success() || failure()
        run: python -u tools/test_webgpu_native.py --jaic target/aarch64-pc-windows-msvc/debug/jaic.exe --platform windows-arm64 --require-adapter
      - name: WebGPU in a window (HWND surface on WARP, presented)
        if: success() || failure()
        run: python -u tools/test_webgpu_native.py --jaic target/aarch64-pc-windows-msvc/debug/jaic.exe --platform windows-arm64 --require-adapter --test window --frames 120
      - name: Restore verified native LLVM installations
        if: success() || failure()
        id: mesa-llvm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/window-mesa-cache
          key: windows-arm64-mesa-llvm-${{ hashFiles('tools/window_render_mesa_windows.py') }}-${{ github.run_id }}
          restore-keys: |
            windows-arm64-mesa-llvm-${{ hashFiles('tools/window_render_mesa_windows.py') }}-
      - name: Build native ARM64 Mesa from pinned upstream sources
        if: success() || failure()
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 -property installationPath
          if (-not $installation) { throw 'Visual Studio ARM64 C++ tools are required' }
          & (Join-Path $installation 'Common7/Tools/Launch-VsDevShell.ps1') -Arch arm64 -HostArch amd64 -SkipAutomaticLocation
          if ($env:VSCMD_ARG_TGT_ARCH -ne 'arm64') { throw 'ARM64 developer environment was not initialized' }
          python -m venv target/mesa-python
          $python = Join-Path $PWD 'target/mesa-python/Scripts/python.exe'
          & $python -m pip install cmake==3.31.6 ninja==1.13.2 meson==1.8.3 Mako==1.3.10 MarkupSafe==3.0.3 packaging==25.0 PyYAML==6.0.3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PATH = (Join-Path $PWD 'target/mesa-python/Scripts') + ';' + $env:PATH
          & $python -u tools/window_render_mesa_windows.py --out target/window-mesa-arm64 --jobs 4
          exit $LASTEXITCODE
      - name: Inspect completed native LLVM cache
        if: always() && !cancelled()
        id: mesa-llvm-completion
        shell: pwsh
        run: |
          $planPath = 'target/window-mesa-arm64/source-build.json'
          $save = $false
          if (Test-Path $planPath) {
            $plan = Get-Content -Raw $planPath | ConvertFrom-Json
            if ($plan.llvm_cache -and -not $plan.llvm_cache.hit) {
              $receipt = Join-Path 'target/window-mesa-cache' ($plan.llvm_cache.key + '/complete.json')
              $save = Test-Path $receipt
            }
          }
          "save=$($save.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - name: Save verified native LLVM installation
        if: always() && !cancelled() && steps.mesa-llvm-completion.outputs.save == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/window-mesa-cache
          key: ${{ steps.mesa-llvm-cache.outputs.cache-primary-key }}
      - name: Native WGL driver diagnostics and public rendering
        if: success() || failure()
        run: |
          mkdir -p artifacts/native-libs/windows-arm64
          python -u tools/window_render_wgl_ci.py --jaic target/aarch64-pc-windows-msvc/debug/jaic.exe --jailint target/aarch64-pc-windows-msvc/debug/jailint.exe --stdlib stdlib --native-libs artifacts/native-libs/windows-arm64 --driver-dir target/window-mesa-arm64/driver --consumer-dir native-exes
      - name: Stdlib runtime tests (interpreter and native) and coverage
        # Reviewed contracts and retained regressions; no legacy expected-failure baseline.
        if: success() || failure()
        run: |
          python -u tools/stdlib_runtime.py --jaic target/aarch64-pc-windows-msvc/debug/jaic.exe --platform windows-arm64 --modes interp,native --strict --coverage target/stdlib-coverage.txt --dlls target/window-mesa-arm64/driver
          python -u tools/stdlib_coverage.py --record target/stdlib-coverage.txt --platform windows-arm64
      - name: Reviewed contract native O2
        if: success() || failure()
        run: python -u tests/stdlib-contract/run.py --jaic "$PWD/target/aarch64-pc-windows-msvc/debug/jaic.exe" --stdlib-root "$PWD/stdlib" --mode native --opt O2
      - name: Reviewed data resource discovery and Icon effects
        if: success() || failure()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installation = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'Visual Studio native SDK tools are required' }
          & (Join-Path $installation 'Common7/Tools/Launch-VsDevShell.ps1') -Arch arm64 -HostArch amd64 -SkipAutomaticLocation
          $env:JAIC_STDLIB = (Resolve-Path stdlib).Path
          $compiler = 'target/aarch64-pc-windows-msvc/debug/jaic.exe'
          & $compiler jaifmt/main.jai -O2 -exe target/jaifmt.exe
          if ($LASTEXITCODE -ne 0) { throw 'Production formatter build failed' }
          python tests/portable-data/build_windows_images.py --cpu arm64
          if ($LASTEXITCODE -ne 0) { throw 'Pinned native image SDK build failed' }
          python -u tests/portable-data/run.py --compiler $compiler --linter target/aarch64-pc-windows-msvc/debug/jailint.exe --formatter target/jaifmt.exe
          if ($LASTEXITCODE -ne 0) { throw 'Native data/resource suite failed' }
      - name: Signed mouse wheel event propagation (issue 1)
        if: success() || failure()
        run: |
          target/aarch64-pc-windows-msvc/debug/jaic.exe tests/window-render/signed-wheel-windows.jai -interp
          target/aarch64-pc-windows-msvc/debug/jaic.exe tests/window-render/signed-wheel-windows.jai -exe native-exes/signed-wheel
          native-exes/signed-wheel.exe
      - name: Public renderer wheel propagation interpreter (issue 1)
        if: success() || failure()
        run: target/aarch64-pc-windows-msvc/debug/jaic.exe tests/window-render/windows-render-events.jai -interp
      - name: Public renderer wheel propagation native O0 (issue 1)
        if: success() || failure()
        run: |
          target/aarch64-pc-windows-msvc/debug/jaic.exe tests/window-render/windows-render-events.jai -O0 -exe native-exes/render-wheel-O0
          native-exes/render-wheel-O0.exe
      - name: Public renderer wheel propagation native O2 (issue 1)
        if: success() || failure()
        run: |
          target/aarch64-pc-windows-msvc/debug/jaic.exe tests/window-render/windows-render-events.jai -O2 -exe native-exes/render-wheel-O2
          native-exes/render-wheel-O2.exe
      - name: Native backend tests
        if: success() || failure()
        run: cargo test --locked -p jaic-cli --no-default-features --features static-llvm --test native -- --test-threads 2
      - name: Native File_Watcher and Windows time-zone SDK ABI fixtures
        if: success() || failure()
        shell: pwsh
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          $ErrorActionPreference = 'Stop'
          $installation = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'Visual Studio native SDK tools are required' }
          & (Join-Path $installation 'Common7/Tools/Launch-VsDevShell.ps1') -Arch arm64 -HostArch amd64 -SkipAutomaticLocation
          python -u tools/check_file_watcher_platforms.py --compiler target/aarch64-pc-windows-msvc/debug/jaic.exe --linter target/aarch64-pc-windows-msvc/debug/jailint.exe --formatter target/jaifmt.exe --native-runtime
          $watcherExit = $LASTEXITCODE
          python -u tools/check_windows_time_zone.py --compiler target/aarch64-pc-windows-msvc/debug/jaic.exe --linter target/aarch64-pc-windows-msvc/debug/jailint.exe --formatter target/jaifmt.exe --sdk-runtime
          $abiExit = $LASTEXITCODE
          if ($watcherExit -ne 0 -or $abiExit -ne 0) { throw 'Native File_Watcher or SDK time-zone ABI suite failed' }
