name: performance gate
# Allocation counts (`jaic -timings`) and instructions executed (valgrind cachegrind) of a few fixed
# compiles must stay within a few percent of tools/bench/gate-baseline.json. Unlike wall-clock time
# (compile-bench.yml) they do not move with runner noise. docs/tools/perf-gate.md explains how to
# update the baseline, which "update" does on the runner so the numbers match the gate's.
on:
  pull_request:
    paths:
      - 'crates/**'
      - 'stdlib/**'
      - 'Cargo.*'
      - 'rust-toolchain.toml'
      - 'tools/bench/gate*.py'
      - 'tools/bench/gate-baseline.json'
      - 'tools/benchgen.py'
      - 'tools/corpus-shape.json'
      - '.github/workflows/perf-gate.yml'
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'stdlib/**'
      - 'Cargo.*'
      - 'rust-toolchain.toml'
      - 'tools/bench/gate*.py'
      - 'tools/bench/gate-baseline.json'
      - 'tools/benchgen.py'
      - 'tools/corpus-shape.json'
  workflow_dispatch:
    inputs:
      update:
        description: Measure and upload a new baseline (gate-baseline.json) instead of comparing
        type: boolean
        default: false
permissions:
  contents: read
env:
  # tools/ holds the folders the Python scripts import from (`from toolkit.repo import ROOT`).
  PYTHONPATH: ${{ github.workspace }}/tools
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gate:
    name: performance gate (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-unix
        with:
          native-libs: 'false'
          font: 'false'
      - name: Install valgrind
        run: bash tools/ci/apt_install.sh valgrind
      - name: Build the release compiler
        run: cargo build --locked --release -p jaic-cli
      - name: Compare with the baseline
        if: ${{ !inputs.update }}
        run: python3 tools/bench/gate.py --jaic target/release/jaic
      - name: Measure a new baseline
        if: ${{ inputs.update }}
        run: python3 tools/bench/gate.py --jaic target/release/jaic --update
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ inputs.update }}
        with:
          name: gate-baseline
          path: tools/bench/gate-baseline.json
