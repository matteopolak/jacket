name: http conformance
# The HTTP codec against llhttp's fixtures, the smuggling table and the chunking tests, in all four
# stdlib runtime modes (tools/stdlib/http_conformance.py, docs/extensions/http-codec.md). It runs when the
# Http module or this harness changes, and by hand; every push already runs the same tests among
# the stdlib runtime tests, so this adds the focused report and the optional external suites.
on:
  push:
    branches: [main]
    paths:
      - stdlib/Extensions/Http/**
      - tools/stdlib/http_conformance.py
      - tools/native/http_native.py
      - tools/corpus/gen_http_corpus.py
      - tools/corpus/http_deviations.json
      - .github/workflows/http-conformance.yml
  pull_request:
    paths:
      - stdlib/Extensions/Http/**
      - tools/stdlib/http_conformance.py
      - tools/native/http_native.py
      - tools/corpus/gen_http_corpus.py
      - tools/corpus/http_deviations.json
      - .github/workflows/http-conformance.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  conformance:
    name: codec conformance (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        # macOS only by hand (every push already runs these tests on macOS among the stdlib runtime tests)
        runner: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["ubuntu-24.04","macos-15"]' || '["ubuntu-24.04"]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      CARGO_INCREMENTAL: '0'
      JAIC_NATIVE_LIBS: ${{ github.workspace }}/target/http-native-libs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install nightly-2026-08-29 --profile minimal
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      # node 24: Memory64 without a flag, for the wasm64 modules `jaic -os wasm` writes.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install LLVM 23 (macOS)
        if: runner.os == 'macOS'
        run: tools/ci/install_ci_llvm_macos.sh --lld
      - name: Install LLVM 23 (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: |
          bash tools/ci/install_ci_llvm_linux.sh
          echo "LLVM_SYS_231_PREFIX=/usr/lib/llvm-23" >> "$GITHUB_ENV"
          echo "/usr/lib/llvm-23/bin" >> "$GITHUB_PATH"
      - name: Check HTTP native dependency setup
        run: python3 tools/run_tests.py -p test_http_native.py
      - name: Build pinned HTTP TLS SDK (static and shared)
        run: python3 tools/native/http_native.py --out "$JAIC_NATIVE_LIBS"
      - name: Build jaic
        run: cargo build --locked -p jaic-cli
      - name: Corpus, llhttp fixtures, smuggling and chunking tests
        run: python3 -u tools/stdlib/http_conformance.py --jaic target/debug/jaic --modes interp,native,wasm-interp,wasm-native
      - name: Io and Http tests under load (default, -O2, ASan on Linux)
        run: |
          python3 tools/run_tests.py -p test_io_stress_diagnostics.py -v
          python3 tools/run_tests.py -p test_ci_test_scratch.py -v
          python3 tools/run_tests.py -p test_http_observer_artifacts.py -v
          python3 tools/run_tests.py -p test_io_stress_observation.py -v
          python3 tools/run_tests.py -p test_io_burst_diagnostics.py -v
          python3 tools/run_tests.py -p test_io_failure_observer.py -v
          python3 tools/run_tests.py -p test_io_failure_wiring.py -v
          observe=()
          if [ "$RUNNER_OS" = Linux ]; then
            observe=(--copies 12 --observe-failures-report "$RUNNER_TEMP/io-observed-copy")
          fi
          python3 -u tools/stdlib/io_stress.py --jaic target/debug/jaic --rounds 3 "${observe[@]}"
      - name: Retain the selected Linux observer capture
        if: ${{ always() && !cancelled() && runner.os == 'Linux' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: io-observed-copy-linux
          path: |
            ${{ runner.temp }}/io-observed-copy/receipt.json
          retention-days: 7
          if-no-files-found: warn
