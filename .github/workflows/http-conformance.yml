name: http conformance
# The HTTP codec against llhttp's fixtures, the smuggling table and the chunking tests, in all four
# stdlib runtime modes (tools/http_conformance.py, docs/stdlib/http-codec.md). It runs when the
# Http module or its tooling changes, and by hand; every push already runs the same tests among
# the stdlib runtime tests, so this adds the focused report and the optional external suites.
on:
  push:
    paths:
      - stdlib/Extensions/Http/**
      - stdlib/Extensions/SIMD/**
      - stdlib/Extensions/Io/**
      - stdlib/Extensions/Tls/**
      - tools/native/mbedtls/**
      - tests/stdlib/http-codec-*.jai
      - tools/http_conformance.py
      - tools/io_stress.py
      - tools/gen_http_corpus.py
      - tools/http_deviations.json
      - .github/workflows/http-conformance.yml
  pull_request:
    paths:
      - stdlib/Extensions/Http/**
      - stdlib/Extensions/SIMD/**
      - stdlib/Extensions/Io/**
      - stdlib/Extensions/Tls/**
      - tools/native/mbedtls/**
      - tests/stdlib/http-codec-*.jai
      - tools/http_conformance.py
      - tools/io_stress.py
      - tools/gen_http_corpus.py
      - tools/http_deviations.json
      - .github/workflows/http-conformance.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  conformance:
    name: codec conformance (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install nightly-2026-08-29 --profile minimal
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      # node 24: Memory64 without a flag, for the wasm64 modules `jaic build -os wasm` writes.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install LLVM 23 (macOS)
        if: runner.os == 'macOS'
        run: tools/install_ci_llvm_macos.sh --lld
      - name: Install LLVM 23 (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: |
          bash tools/install_ci_llvm_linux.sh
          echo "LLVM_SYS_231_PREFIX=/usr/lib/llvm-23" >> "$GITHUB_ENV"
          echo "/usr/lib/llvm-23/bin" >> "$GITHUB_PATH"
      - name: Build jaic
        run: cargo build --locked -p jaic-cli
      - name: Corpus, llhttp fixtures, smuggling and chunking tests
        run: python3 -u tools/http_conformance.py --jaic target/debug/jaic --modes interp,native,wasm-interp,wasm-native
      - name: Io and Http tests under load (default, -O2, ASan on Linux)
        run: python3 -u tools/io_stress.py --jaic target/debug/jaic --rounds 3
