name: lsp-oracle
# Nightly language-server oracle checks over every file `jaic -check` accepts (docs/tools/lsp-oracle.md).
# A finding missing from tools/lsp/oracle-known.json fails the shard.
on:
  schedule:
    - cron: '47 4 * * *'
  workflow_dispatch:
    inputs:
      sets:
        description: Comma list of stdlib, compiler, examples, jaigen
        default: 'stdlib,compiler,examples,jaigen'
permissions:
  contents: read
env:
  # tools/ holds the folders the Python scripts import from (`from toolkit.repo import ROOT`).
  PYTHONPATH: ${{ github.workspace }}/tools
jobs:
  oracle:
    name: oracle shard ${{ matrix.shard }}/4
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      CARGO_INCREMENTAL: '0'
      SETS: ${{ inputs.sets || 'stdlib,compiler,examples,jaigen' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: ./.github/actions/setup-unix
        with:
          alsa: 'true'
      - name: Build jaic, jaifmt and the oracle
        run: |
          python3 tools/dev/dev.py build --release --no-native
          cargo build --release --locked -p jai-language-server --example lsp_oracle
      - name: Run the oracle
        run: python3 tools/lsp/oracle.py --sets "$SETS" --shard ${{ matrix.shard }}/4 --jobs "$(nproc)" --out target/lsp-oracle
      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lsp-oracle-${{ matrix.shard }}
          path: target/lsp-oracle
          if-no-files-found: ignore
  graph-fixtures:
    # The inclusion-graph audit over the repository's own two-entry project and metaprogram
    # workspace, in shuffled open orders (docs/tools/lsp-graph-audit.md).
    name: graph audit fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: ./.github/actions/setup-unix
        with:
          alsa: 'true'
      - name: Build jaic and the audit
        run: |
          python3 tools/dev/dev.py build --release --no-native
          cargo build --release --locked -p jai-language-server --example ide_coverage
      - name: Audit the fixtures
        run: |
          fixtures=tools/lsp/fixtures/graph
          python3 tools/lsp/project_graph.py --project $fixtures/two-entry --entry first.jai --jaic target/release/jaic --out target/graph-audit/first
          python3 tools/lsp/project_graph.py --project $fixtures/two-entry --entry second.jai --jaic target/release/jaic --out target/graph-audit/second
          python3 tools/lsp/project_graph.py --project $fixtures/metaprogram --entry main.jai --jaic target/release/jaic --out target/graph-audit/metaprogram
      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: graph-audit-fixtures
          path: target/graph-audit
          if-no-files-found: ignore
