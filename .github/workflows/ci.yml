          formula="$RUNNER_TEMP/all-platforms/homebrew/jacket.rb"
          cat "$formula"
          grep -q 'jacket-macos-x64.tar.gz' "$formula" && grep -q 'jacket-linux-arm64.tar.gz' "$formula"
          if grep -q 'depends_on arch: :' "$formula"; then echo "the formula still restricts the architecture"; exit 1; fi
          if [ "$RUNNER_OS" = Linux ]; then eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"; fi
          brew tap-new --no-git jaiall/local
          cp "$formula" "$(brew --repository jaiall/local)/Formula/jacket.rb"
          brew trust jaiall/local 2> /dev/null || true
          brew style jaiall/local/jacket
          brew audit --formula --strict jaiall/local/jacket
          brew untap jaiall/local
      - name: Install the formula from a local tap and run its test
        if: steps.released.outputs.published == 'true'
        run: |
          if [ "$RUNNER_OS" = Linux ]; then eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"; fi
          brew --version
          brew tap-new --no-git jaitest/local
          cp "$RUNNER_TEMP/packages/homebrew/jacket.rb" "$(brew --repository jaitest/local)/Formula/jacket.rb"
          brew trust jaitest/local 2> /dev/null || true
          brew style jaitest/local/jacket
          brew audit --formula --strict --online jaitest/local/jacket
          brew install --build-from-source jaitest/local/jacket
          brew test jaitest/local/jacket
          brew linkage jaitest/local/jacket || true
          brew uninstall jaitest/local/jacket
          brew untap jaitest/local
  # Native Windows executables from `jaic` for x64 and arm64: built on Windows with the MSVC
  # toolchain, and cross-built from Linux with MinGW-w64 (llvm-mingw for arm64) then run on
  # Windows (docs/native/windows.md). Runs on manual runs, on the Windows work branches, and on
  # main when a path its coverage is about changes (tools/ci_changes.py).
  windows-cross:
    name: cross-build ${{ matrix.cpu }} (Linux, ${{ matrix.mingw }})
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {cpu: x64, mingw: MinGW-w64}
          - {cpu: arm64, mingw: llvm-mingw}
    concurrency:
      group: ${{ github.workflow }}-windows-cross-${{ github.ref }}-${{ matrix.cpu }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_TARGET_DIR: target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-unix
        with:
          font: 'false'
      - name: Install MinGW-w64
        if: matrix.cpu == 'x64'
        run: |
          sudo apt-get install -y gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64
          x86_64-w64-mingw32-gcc --version
      - name: Install llvm-mingw
        if: matrix.cpu == 'arm64'
        run: |
          name="llvm-mingw-$LLVM_MINGW_VERSION-ucrt-ubuntu-22.04-x86_64"
          curl -fsSL -o llvm-mingw.tar.xz "https://github.com/mstorsjo/llvm-mingw/releases/download/$LLVM_MINGW_VERSION/$name.tar.xz"
          mkdir -p "$RUNNER_TEMP/llvm-mingw"
          tar -xJf llvm-mingw.tar.xz -C "$RUNNER_TEMP/llvm-mingw" --strip-components=1
          rm llvm-mingw.tar.xz
          echo "$RUNNER_TEMP/llvm-mingw/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/llvm-mingw/bin/aarch64-w64-mingw32-clang" --version
      - name: Build jaic
        run: cargo build --locked -p jaic-cli
      - name: Build the resource-only PE fixture
        run: python3 tools/build_windows_resource_fixture.py --cpu ${{ matrix.cpu }} --out cross-${{ matrix.cpu }}/resource-fixture --rc /usr/lib/llvm-23/bin/llvm-rc --linker /usr/lib/llvm-23/bin/lld-link --readobj /usr/lib/llvm-23/bin/llvm-readobj
      - name: Cross-build the Windows test programs
        # --stdlib first cross-builds the third-party C libraries (stb_*, FreeType, lz4, ...) with
        # MinGW-w64 or llvm-mingw as static archives (tools/build_native_libs.py).
        run: python3 tools/windows_cross.py build --stdlib --cpu ${{ matrix.cpu }} --jaic target/debug/jaic --out cross-${{ matrix.cpu }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cross-${{ matrix.cpu }}
          path: cross-${{ matrix.cpu }}
          if-no-files-found: error
  windows-run-cross:
    name: run cross-built programs (Windows ${{ matrix.cpu }})
    needs: windows-cross
    strategy:
      fail-fast: false
      matrix:
        include:
          - {cpu: x64, runner: windows-2025}
          - {cpu: arm64, runner: windows-11-arm}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cross-${{ matrix.cpu }}
          path: cross-${{ matrix.cpu }}
      - name: Install Mesa's software OpenGL
        if: matrix.cpu == 'x64'
        run: |
          bash tools/install_ci_mesa_windows.sh "$RUNNER_TEMP/mesa"
          cp "$RUNNER_TEMP"/mesa/*.dll cross-x64/
      - name: Run
        run: |
          JAIC_TEST_WINDOWS_RESOURCE_DIR="$(cygpath -m "$PWD/cross-${{ matrix.cpu }}/resource-fixture")"
          export JAIC_TEST_WINDOWS_RESOURCE_DIR
          python tools/windows_cross.py run --dir cross-${{ matrix.cpu }}
  windows-native:
    name: jaic on Windows ${{ matrix.cpu }} (MSVC)
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - cpu: x64
            runner: windows-2025
            triple: x86_64-pc-windows-msvc
            vs_arch: amd64
            mesa_dir: target/mesa-driver
            timeout: 60
          - cpu: arm64
            runner: windows-11-arm
            triple: aarch64-pc-windows-msvc
            vs_arch: arm64
            mesa_dir: target/window-mesa-arm64/driver
            timeout: 120
    concurrency:
      group: ${{ github.workflow }}-windows-native-${{ github.ref }}-${{ matrix.cpu }}
      cancel-in-progress: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    env:
      JAIC: target/${{ matrix.triple }}/debug/jaic.exe
      JAILINT: target/${{ matrix.triple }}/debug/jailint.exe
      MESA_DIR: ${{ matrix.mesa_dir }}
      CPU: ${{ matrix.cpu }}
      VS_ARCH: ${{ matrix.vs_arch }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-windows
        with:
          cpu: ${{ matrix.cpu }}
          triple: ${{ matrix.triple }}
      - name: Build jaic with the LLVM backend
        run: cargo build --locked -p jaic-cli -p jailint --no-default-features --features static-llvm
      - name: Windows dynamic package tests
        run: TMPDIR="$RUNNER_TEMP" PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tools -p test_windows_dynamic_package.py -v
      - uses: ./.github/actions/windows-provider
        with:
          cpu: ${{ matrix.cpu }}
          triple: ${{ matrix.triple }}
      - name: Platform I/O (interpreter and native O0/O2)
        if: ${{ !cancelled() }}
        run: python -u tools/check_platform_io.py --jaic "$JAIC" --stdlib stdlib --native --windows-crash
      - name: Socket, calendar and shared-channel execution
        if: ${{ !cancelled() }}
        run: |
          for check in socket calendar channel; do
            python -u tools/check_portable_windows_$check.py --jaic "$JAIC" --stdlib stdlib --native
          done
      - name: Build the caller-owned Windows resource fixture
        run: |
          python tools/build_windows_resource_fixture.py --cpu "$CPU" --out "$RUNNER_TEMP/windows-resources"
          printf 'JAIC_TEST_WINDOWS_RESOURCE_DIR=%s\n' "$(cygpath -m "$RUNNER_TEMP/windows-resources")" >> "$GITHUB_ENV"
      - name: Build and run the Windows test programs natively
        run: |
          mkdir -p native-exes
          "$JAIC" tests/corpus/positive/integer-control.jai -exe native-exes/smoke
          python -u tools/windows_cross.py build --jaic "$JAIC" --out native-exes --host --keep-going
          python -u tools/windows_cross.py run --dir native-exes
      - name: Interpreter variadic foreign calls
        if: ${{ !cancelled() && matrix.cpu == 'arm64' }}
        run: test "$("$JAIC" tests/native/windows/variadic.jai -interp | tr -d '\r')" = ok
      - name: Install Mesa's software OpenGL
        if: ${{ !cancelled() && matrix.cpu == 'x64' }}
        run: bash tools/install_ci_mesa_windows.sh "$MESA_DIR"
      - name: Restore the native LLVM installation for the Mesa build
        if: ${{ !cancelled() && matrix.cpu == 'arm64' }}
        id: mesa-llvm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/window-mesa-cache
          key: windows-arm64-mesa-llvm-${{ hashFiles('tools/window_render_mesa_windows.py') }}-${{ github.run_id }}
          restore-keys: |
            windows-arm64-mesa-llvm-${{ hashFiles('tools/window_render_mesa_windows.py') }}-
      - name: Build native arm64 Mesa from pinned upstream sources
        if: ${{ !cancelled() && matrix.cpu == 'arm64' }}
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 -property installationPath
          if (-not $installation) { throw 'Visual Studio ARM64 C++ tools are required' }
          & (Join-Path $installation 'Common7/Tools/Launch-VsDevShell.ps1') -Arch arm64 -HostArch amd64 -SkipAutomaticLocation
          if ($env:VSCMD_ARG_TGT_ARCH -ne 'arm64') { throw 'ARM64 developer environment was not initialized' }
          python -m venv target/mesa-python
          $python = Join-Path $PWD 'target/mesa-python/Scripts/python.exe'
          & $python -m pip install cmake==3.31.6 ninja==1.13.2 meson==1.8.3 Mako==1.3.10 MarkupSafe==3.0.3 packaging==25.0 PyYAML==6.0.3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PATH = (Join-Path $PWD 'target/mesa-python/Scripts') + ';' + $env:PATH
          & $python -u tools/window_render_mesa_windows.py --out target/window-mesa-arm64 --jobs 4
          exit $LASTEXITCODE
      - name: Check whether the native LLVM installation is complete
        if: ${{ always() && !cancelled() && matrix.cpu == 'arm64' }}
        id: mesa-llvm-completion
        shell: pwsh
        run: |
          $planPath = 'target/window-mesa-arm64/source-build.json'
          $save = $false
          if (Test-Path $planPath) {
            $plan = Get-Content -Raw $planPath | ConvertFrom-Json
            if ($plan.llvm_cache -and -not $plan.llvm_cache.hit) {
              $save = Test-Path (Join-Path 'target/window-mesa-cache' ($plan.llvm_cache.key + '/complete.json'))
            }
          }
          "save=$($save.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - name: Save the native LLVM installation
        if: ${{ always() && !cancelled() && steps.mesa-llvm-completion.outputs.save == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/window-mesa-cache
          key: ${{ steps.mesa-llvm-cache.outputs.cache-primary-key }}
      - name: Stdlib runtime tests (interpreter and native) and coverage
        # The third-party libraries (FreeType, stb_*...) are built first (tools/build_native_libs.py).
        if: ${{ !cancelled() }}
        run: |
          if [ "$CPU" = x64 ]; then cp "$MESA_DIR"/*.dll "$(dirname "$JAIC")/"; fi
          python -u tools/stdlib_runtime.py --jaic "$JAIC" --platform windows-${{ matrix.cpu }} --modes interp,native --strict --coverage target/stdlib-coverage.txt --dlls "$MESA_DIR"
          python -u tools/stdlib_coverage.py --record target/stdlib-coverage.txt --platform windows-${{ matrix.cpu }}
      - name: Stdlib contract tests, native O2
        if: ${{ !cancelled() }}
        run: python -u tests/stdlib-contract/run.py --jaic "$PWD/$JAIC" --stdlib-root "$PWD/stdlib" --mode native --opt O2
      - name: Data resource discovery and Icon effects
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installation = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'Visual Studio native SDK tools are required' }
          & (Join-Path $installation 'Common7/Tools/Launch-VsDevShell.ps1') -Arch $env:VS_ARCH -HostArch amd64 -SkipAutomaticLocation
          $env:JAIC_STDLIB = (Resolve-Path stdlib).Path
          & $env:JAIC jaifmt/main.jai -O2 -exe target/jaifmt.exe
          if ($LASTEXITCODE -ne 0) { throw 'jaifmt build failed' }
          python tests/portable-data/build_windows_images.py --cpu $env:CPU
          if ($LASTEXITCODE -ne 0) { throw 'Native image SDK build failed' }
          python -u tests/portable-data/run.py --compiler $env:JAIC --linter $env:JAILINT --formatter target/jaifmt.exe
          if ($LASTEXITCODE -ne 0) { throw 'Native data/resource suite failed' }
      - name: A Simp game's metaprogram build without Clang on PATH
        # tests/native/simp-game: first.jai builds src/main.jai (Simp, GL, Input, stb_image) in a
        # workspace and runs build/game.exe. Without LLVM on PATH, and with Git's coreutils
        # `link` in /usr/bin, jaic must skip that `link` and use Visual Studio's link.exe with
        # the LIB it works out. The stb libraries come from the stdlib runtime step.
        if: ${{ !cancelled() && matrix.cpu == 'x64' }}
        run: |
          jaic="$PWD/$JAIC"
          game="$RUNNER_TEMP/simp-game"
          cp -R tests/native/simp-game "$game"
          mkdir -p "$game/build"
          cp "$MESA_DIR"/*.dll "$game/build/"
          cd "$game"
          PATH="$(echo "$PATH" | tr ':' '\n' | grep -vi llvm | paste -sd:)"
          export PATH
          if command -v clang; then echo "clang is still on PATH"; exit 1; fi
          which -a link
          # First with the runner's older Clang in Program Files\LLVM (found off PATH), then
          # with that and Visual Studio's bundled Clang moved away, so link.exe links.
          "$jaic" first.jai -interp
          vs="$(cygpath -u "$("/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe" -latest -property installationPath)")"
          hidden=()
          for dir in "/c/Program Files/LLVM" "$vs/VC/Tools/Llvm"; do
            if [ -d "$dir" ]; then mv "$dir" "$dir.hidden"; hidden+=("$dir"); fi
          done
          rm -f build/game.exe
          set +e
          "$jaic" first.jai -interp
          status=$?
          set -e
          for dir in "${hidden[@]}"; do mv "$dir.hidden" "$dir"; done
          test "$status" = 0
          ls -l build
          # The same program under the interpreter (Mesa's opengl32.dll is beside jaic.exe).
          "$jaic" src/main.jai -interp
      - name: D3DCompiler provider and interpreter identity
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m unittest discover -s tools -p 'test_windows_d3dcompiler*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'D3DCompiler diagnostic tests failed' }
          $installation = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'Visual Studio native SDK tools are required' }
          & (Join-Path $installation 'Common7/Tools/Launch-VsDevShell.ps1') -Arch $env:VS_ARCH -HostArch amd64 -SkipAutomaticLocation
          $importLibrary = $env:LIB.Split(';') | ForEach-Object { Join-Path $_ 'd3dcompiler.lib' } | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if (-not $importLibrary) { throw 'Selected SDK LIB search has no d3dcompiler.lib' }
          python -u tools/check_windows_d3dcompiler_provider.py --jaic $env:JAIC --stdlib stdlib --import-library "$importLibrary" --report "target/d3dcompiler-$env:CPU/provider.json"
          if ($LASTEXITCODE -ne 0) { throw 'D3DCompiler provider interpreter/native check failed' }
      - name: WebGPU without a window (wgpu-native on D3D12's WARP adapter)
        # tests/webgpu/headless.jai interpreted and built; docs/extensions/webgpu.md#tests.
        if: ${{ !cancelled() }}
        run: python -u tools/test_webgpu_native.py --jaic "$JAIC" --platform windows-${{ matrix.cpu }} --require-adapter
      - name: WebGPU in a window (HWND surface on WARP, presented)
        # tests/webgpu/window.jai: a Window_Creation window in the runner's interactive desktop
        # session, a DXGI swap chain through wgpu-native's D3D12 backend, frames read back.
        if: ${{ !cancelled() }}
        run: python -u tools/test_webgpu_native.py --jaic "$JAIC" --platform windows-${{ matrix.cpu }} --require-adapter --test window --frames 120
      - name: Native WGL driver diagnostics and public rendering
        if: ${{ !cancelled() }}
        run: |
          mkdir -p target/native-libs/windows-${{ matrix.cpu }}
          python -u tools/window_render_wgl_ci.py --jaic "$JAIC" --jailint "$JAILINT" --stdlib stdlib --native-libs target/native-libs/windows-${{ matrix.cpu }} --driver-dir "$MESA_DIR" --consumer-dir native-exes
      - name: Signed mouse wheel events reach the program (interpreter, O0, O2)
        if: ${{ !cancelled() }}
        run: |
          "$JAIC" tests/window-render/signed-wheel-windows.jai -interp
          "$JAIC" tests/window-render/signed-wheel-windows.jai -exe native-exes/signed-wheel
          native-exes/signed-wheel.exe
          "$JAIC" tests/window-render/windows-render-events.jai -interp
          for opt in O0 O2; do
            "$JAIC" tests/window-render/windows-render-events.jai -$opt -exe native-exes/render-wheel-$opt
            native-exes/render-wheel-$opt.exe
          done
      - name: Native backend tests
        if: ${{ !cancelled() }}
        run: cargo test --locked -p jaic-cli --no-default-features --features static-llvm --test native -- --test-threads 2
      - name: Native File_Watcher and Windows time-zone SDK ABI fixtures
        if: ${{ !cancelled() }}
        shell: pwsh
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          $ErrorActionPreference = 'Stop'
          $installation = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'Visual Studio native SDK tools are required' }
          & (Join-Path $installation 'Common7/Tools/Launch-VsDevShell.ps1') -Arch $env:VS_ARCH -HostArch amd64 -SkipAutomaticLocation
          python -u tools/check_file_watcher_platforms.py --compiler $env:JAIC --linter $env:JAILINT --formatter target/jaifmt.exe --native-runtime
          $watcherExit = $LASTEXITCODE
          python -u tools/check_windows_time_zone.py --compiler $env:JAIC --linter $env:JAILINT --formatter target/jaifmt.exe --sdk-runtime
          $abiExit = $LASTEXITCODE
          if ($watcherExit -ne 0 -or $abiExit -ne 0) { throw 'Native File_Watcher or SDK time-zone ABI suite failed' }
  windows-smoke:
    # The third-party projects of `upstream-smoke`, built and run on Windows with the interactive
    # desktop and Mesa's software OpenGL (docs/tools/upstream-corpus.md).
    name: third-party projects (Windows x64)
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    concurrency:
      group: ${{ github.workflow }}-windows-smoke-${{ github.ref }}
      cancel-in-progress: true
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-windows
        with:
          cpu: x64
          triple: x86_64-pc-windows-msvc
      - name: Build jaic with the LLVM backend
        run: cargo build --release --locked -p jaic-cli --no-default-features --features static-llvm
      - uses: ./.github/actions/windows-provider
        with:
          cpu: x64
          triple: x86_64-pc-windows-msvc
      - name: Install Mesa's software OpenGL
        run: bash tools/install_ci_mesa_windows.sh "$RUNNER_TEMP/mesa"
      - name: Fetch the pinned projects
        run: |
          project_list="$(python tools/upstream_smoke.py --jaic x --projects)"
          read -r -a project_names <<< "$project_list"
          python tools/fetch_upstreams.py --only "${project_names[@]}"
      - name: Build and run the projects
        run: python -u tools/upstream_smoke.py --jaic target/x86_64-pc-windows-msvc/release/jaic.exe --platform windows-x64 --dlls "$RUNNER_TEMP/mesa"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() && !cancelled() }}
        with:
          name: smoke-screenshots-windows-x64
          path: target/smoke-screenshots
          if-no-files-found: ignore
