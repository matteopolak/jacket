name: compiler checks
on:
  push:
    branches: [main, staging]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  LLVM_VERSION: 23.1.2
  # llvm-mingw (https://github.com/mstorsjo/llvm-mingw): the MinGW-w64 toolchain for Windows arm64.
  LLVM_MINGW_VERSION: '20260922'
  # Mesa's llvmpipe software OpenGL for the Windows window tests (the runners only have GDI's
  # OpenGL 1.1): the MSVC build of https://github.com/pal1000/mesa-dist-win, which has no arm64
  # DLLs. Its opengl32.dll goes next to the programs, which Windows searches before System32.
  MESA_VERSION: 26.1.8
  MESA_SHA256: 4c6d32e653e0ff9ad07796e40c0bcfabf2764d849e3ce4f3b1590112c87e42f9
  GALLIUM_DRIVER: llvmpipe
# A newer push to a branch supersedes the older run there. On main the light jobs (compiler
# tests, lint, wasm, VS Code) finish for every push, while the heavy ones (stdlib runtime,
# third-party projects, sanitizers, macOS Intel) set their own concurrency so a newer push to
# main supersedes them. Cancel a run by hand with `gh run cancel` when it is not needed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    # Which of the path-gated jobs below run (tools/ci_changes.py lists the paths).
    name: select what runs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sdl3: ${{ steps.select.outputs.sdl3 }}
      clipboard: ${{ steps.select.outputs.clipboard }}
      nix: ${{ steps.select.outputs.nix }}
      packaging: ${{ steps.select.outputs.packaging }}
      windows: ${{ steps.select.outputs.windows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: select
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SHA: ${{ github.sha }}
        run: python3 tools/ci_changes.py
  fuzz-regressions:
    # Replays the saved crash inputs so fixed crashes stay fixed (nightly fuzzing: fuzz.yml).
    name: replay fuzz regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install nightly-2026-08-29 --profile minimal
      - name: Validate fuzz dependency ages
        run: python3 tools/check_dependency_age.py --lockfile fuzz/Cargo.lock
      - name: Replay fuzz/regressions through the harnesses
        run: cargo test --locked --manifest-path fuzz/harness/Cargo.toml
  scripting-wasm:
    name: scripting interpreter (LLVM-free WebAssembly)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # node 24: JSPI's WebAssembly.Suspending (behind --experimental-wasm-jspi) for the WebGPU host test.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install the pinned Rust toolchain and wasm target
        run: |
          rustup toolchain install nightly-2026-08-29 --profile minimal --component rustfmt --component clippy
          rustup target add wasm32-unknown-unknown --toolchain nightly-2026-08-29
      - name: Validate dependency ages and public source inputs
        # Read-only GitHub API access for the commit dates of pinned git dependencies.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 tools/check_dependency_age.py
          python3 tools/check_ci_sources.py
      - name: Verify the wasm boundary and language server
        run: cargo test --locked -j 1 -p jai-language-server -p jai-wasm
      - name: Build and stage the real WebAssembly compiler without the native backend
        run: python3 tools/build_scripting_wasm.py --release --output target/ci-wasm
      - name: Execute the real WebAssembly module
        run: |
          node --version
          node tools/check_scripting_wasm.mjs target/ci-wasm/jai_wasm.wasm
          node tools/check_jai_format_wasm.mjs target/ci-wasm/jai_wasm.wasm
      - name: WebGPU host bridge (mock WebGPU; the engine suspends through JSPI)
        # docs/extensions/webgpu.md#tests. Node 24 has JSPI behind a V8 flag, so the file runs
        # directly (node:test in this process) rather than in a `--test` child without the flag.
        run: JAI_WASM_DIR=target/ci-wasm node --experimental-wasm-jspi tools/test_webgpu_host.mjs
      - name: Run every stdlib test in the browser engine
        # because they need what the browser lacks (native libraries, windows); a test that only
        # partly does skips that part itself under `OS == .WASM`. The browser release runs the same check.
        run: node tools/check_playground_stdlib.mjs target/ci-wasm
      - name: Interpreter and browser engine agree (corpus and generated programs)
        # docs/tools/testing.md; the host jaic needs no LLVM to interpret.
        run: |
          cargo build --locked -j 2 -p jaic-cli --no-default-features
          python3 tools/jaic-diff.py --jaic target/debug/jaic --backends interp,wasm --wasm target/ci-wasm corpus gen:1:40
  test:
    name: compiler (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        # macos-15-intel only on pushes to main (its runners queue for a long time); see docs/tools/development.md
        include: ${{ fromJSON(github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/cleanroom-integration') && '[{"runner":"macos-15","architecture":"arm64"},{"runner":"ubuntu-24.04","architecture":"x86_64"},{"runner":"ubuntu-24.04-arm","architecture":"aarch64"},{"runner":"macos-15-intel","architecture":"x86_64"}]' || '[{"runner":"macos-15","architecture":"arm64"},{"runner":"ubuntu-24.04","architecture":"x86_64"},{"runner":"ubuntu-24.04-arm","architecture":"aarch64"}]') }}
    concurrency:
      group: ${{ github.workflow }}-test-${{ github.ref }}-${{ matrix.runner }}-${{ matrix.runner == 'macos-15-intel' && 'newest' || github.sha }}
      cancel-in-progress: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: '0'
      # The wasm target tests fail, rather than skip, without node or wasm-ld.
      JAIC_REQUIRE_WASM_TESTS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-unix
        with:
          lld: 'true'
          font: 'false'
      # The format and lint steps below run the Justfile's recipes (docs/tools/development.md).
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: '1.58.0'
      # node 24: Memory64 without a flag, for the wasm64 modules `jaic -os wasm` writes.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Validate dependency ages before building
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/check_dependency_age.py
      - name: Validate public checkout compilation inputs
        run: python3 tools/check_ci_sources.py
      - name: Verify native host and LLVM
        run: |
          uname -sm
          test "$(uname -m)" = "${{ matrix.architecture }}"
          llvm-config --version
          clang --version
          node --version
      - name: Build the native helper libraries
        run: |
          if [ "$RUNNER_OS" = Linux ]; then bash tools/ci_native_deps.sh clipboard; fi
          bash tools/ci_native_deps.sh developer
      - name: Format check
        id: format
        continue-on-error: true
        run: just fmt --check --lang rust
      - name: Lint
        id: lint
        continue-on-error: true
        run: just lint --lang rust
      - name: Rust and native execution tests
        id: correctness
        continue-on-error: true
        # The full reference lexer requires the separately supplied sources.
        # Protected-tool rejection remains active without original native files.
        run: |
          ulimit -c 0
          cargo test --workspace --no-fail-fast --locked -- --skip lex_entire_reference_without_executing_it --skip every_stdlib_module_checks_for_every_target --skip selectors_take_the_arguments_they_are_sent_with --skip selectors_exist_in_the_objective_c_runtime
      - name: Native tests with every program divided into parts
        id: split-native
        continue-on-error: true
        # JAIC_CODEGEN_UNITS=4 divides each native build into four codegen units (call-graph parts
        # when optimized), so a code generation bug that only shows across parts fails here
        # (docs/native/llvm-backend.md). Tests about a single module pin one unit themselves.
        run: JAIC_CODEGEN_UNITS=4 cargo test -p jaic-cli --locked --test native --test optimized_split --test debug_info --test embedded_data
      - name: Stdlib type-checks and Objective-C selectors
        id: stdlib-targets
        continue-on-error: true
        # Every stdlib module with -no_dce for linux, macos, windows and wasm, against
        # tests/stdlib-targets.txt (docs/tools/testing.md); every Objective-C selector
        # against its arguments and, on macOS, the runtime (docs/tools/testing.md).
        run: cargo test -p jaic-cli --locked --test stdlib_targets --test objc_selectors
      - name: Prepare hash-pinned SDL Python test inputs
        run: python3 tools/prepare_sdl_python_tests.py --scratch "$RUNNER_TEMP/sdl-python" --cache "$RUNNER_TEMP/sdl-python-cache" >> "$GITHUB_ENV"
      - name: Policy tests
        id: policy
        continue-on-error: true
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      # Reports doc rules without a test; fails only when a test cites an unknown rule ID.
      - name: Rule coverage
        id: rule-coverage
        continue-on-error: true
        run: python3 tools/check_rule_coverage.py --list-uncovered
      # The repository's Jai code must be formatted (settings: jaifmt.toml).
      - name: Jai format check
        id: jai-format
        continue-on-error: true  # recorded, then enforced by the last step like the other checks
        run: just fmt --check --lang jai
      # The repository's Jai code must be lint-free (settings: jailint.toml).
      - name: Jai lint
        id: jai-lint
        continue-on-error: true
        run: just lint --lang jai
      - name: Backend agreement
        id: backends
        continue-on-error: true
        # The interpreter, -O0 and -O2 native builds must print the same for the corpus and a
        # fixed set of generated programs (docs/tools/testing.md has the full run).
        run: |
          cargo build --locked -p jaic-cli
          python3 tools/jaic-diff.py --jaic target/debug/jaic --backends interp,native,native-O2 corpus gen:1:40
      - name: WebAssembly target
        id: wasm-target
        continue-on-error: true
        # jaifmt compiled to wasm64 must format every golden case exactly like native jaifmt (built
        # by the Jai format check), and WASI modules must behave like the interpreter
        # (docs/native/wasm-target.md).
        run: |
          cargo build --locked -p jaic-cli
          python3 tools/check_platform_io.py --jaic target/debug/jaic --stdlib stdlib --wasm --case file-contract
          target/debug/jaic jaifmt/wasm.jai -os wasm -O2 -no_debug_info -exe target/jaifmt.wasm
          ls -l target/jaifmt.wasm
          node --no-warnings tools/check_jaifmt_wasm.mjs target/jaifmt.wasm target/jaifmt
          python3 tools/jaic-diff.py --jaic target/debug/jaic --backends interp,wasm-native corpus gen:1:40
      - name: Native Linux File_Watcher ownership and notifications
        if: runner.os == 'Linux'
        id: file-watcher-native
        continue-on-error: true
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          cargo build --locked -p jaic-cli -p jailint
          test -x target/jaifmt
          python3 tools/check_file_watcher_platforms.py --compiler target/debug/jaic --linter target/debug/jailint --formatter target/jaifmt --native-runtime
      - name: Enforce all recorded checks
        if: ${{ always() && !cancelled() && (steps.format.outcome == 'failure' || steps.jai-format.outcome == 'failure' || steps.jai-lint.outcome == 'failure' || steps.lint.outcome == 'failure' || steps.correctness.outcome == 'failure' || steps.split-native.outcome == 'failure' || steps.policy.outcome == 'failure' || steps.backends.outcome == 'failure' || steps.wasm-target.outcome == 'failure' || steps.rule-coverage.outcome == 'failure' || steps.stdlib-targets.outcome == 'failure' || steps.file-watcher-native.outcome == 'failure') }}
        run: |
          echo "One or more checks failed; see their original step diagnostics."
          exit 1
  vscode-extension:
    # editors/vscode: lint, unit and grammar tests, VS Code integration tests against a debug
    # jailsp, and the .vsix (docs/tools/vscode-extension.md).
    name: VS Code extension
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: '0'
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install the pinned toolchain
        run: rustup toolchain install nightly-2026-08-29 --profile minimal
      - name: Validate dependency ages before installing or building
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 ../../tools/check_dependency_age.py --lockfile ../../Cargo.lock
          node scripts/check-dependency-age.ts
      # The pnpm version comes from package.json's packageManager, which the age check covers.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: editors/vscode/package.json
      - name: Install npm dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Lint (oxlint, tsc, generated grammar and schemas up to date)
        run: pnpm run lint
      - name: Unit and grammar tests
        # The grammar must also get through every .jai file in examples/ and stdlib/ without
        # ending inside a string or comment.
        run: pnpm test
      - name: Build jailsp
        working-directory: .
        run: cargo build --locked -j 2 -p jai-language-server
      - name: Integration tests in VS Code
        env:
          JAILSP: ${{ github.workspace }}/target/debug/jailsp
        run: xvfb-run -a pnpm run test:e2e
      - name: Package the .vsix
        run: pnpm run package -o jacket-vscode.vsix
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vscode-extension
          path: editors/vscode/jacket-vscode.vsix
          if-no-files-found: error
  neovim-plugin:
    # editors/nvim: the headless tests, including an end-to-end run against a debug jailsp
    # (docs/tools/neovim-plugin.md).
    name: Neovim plugin
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: '0'
      NVIM_VERSION: v0.12.4
      NVIM_SHA256: 012bf3fcac5ade43914df3f174668bf64d05e049a4f032a388c027b1ebd78628
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Neovim (pinned release, checksum verified)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/nvim.tar.gz" "https://github.com/neovim/neovim/releases/download/${NVIM_VERSION}/nvim-linux-x86_64.tar.gz"
          echo "${NVIM_SHA256}  $RUNNER_TEMP/nvim.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/nvim"
          tar -xzf "$RUNNER_TEMP/nvim.tar.gz" -C "$RUNNER_TEMP/nvim" --strip-components=1
          echo "$RUNNER_TEMP/nvim/bin" >> "$GITHUB_PATH"
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: '1.58.0'
      - name: Install the pinned toolchain
        run: rustup toolchain install nightly-2026-08-29 --profile minimal
      - name: Run the plugin tests (builds only jailsp)
        run: just nvim-test -j 2
  stdlib-runtime:
    name: stdlib runtime tests (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        # macos-15-intel only on pushes to main, as in `test`
        include: ${{ fromJSON(github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/cleanroom-integration') && '[{"runner":"macos-15","platform":"macos-arm64"},{"runner":"ubuntu-24.04","platform":"linux-x64"},{"runner":"ubuntu-24.04-arm","platform":"linux-arm64"},{"runner":"macos-15-intel","platform":"macos-x64"}]' || '[{"runner":"macos-15","platform":"macos-arm64"},{"runner":"ubuntu-24.04","platform":"linux-x64"},{"runner":"ubuntu-24.04-arm","platform":"linux-arm64"}]') }}
    concurrency:
      group: ${{ github.workflow }}-stdlib-runtime-${{ github.ref }}-${{ matrix.platform }}
      cancel-in-progress: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-unix
        with:
          lld: 'true'
          # The stdlib's FreeType is built by tools/build_native_libs.py and found first;
          # Homebrew's stays for projects that link it themselves. SDL2 is not built there:
          # tests/native-regressions/sdl2-geometry-timer.jai uses Homebrew's.
          brew: freetype sdl2
          alsa: 'true'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Build production compiler and lint tools
        run: |
          cargo build --locked -p jaic-cli -p jailint
          cargo build --locked --release -p jaic-cli
          target/debug/jaic jaifmt/main.jai -O2 -exe target/jaifmt
      - name: Build private native dependencies from source
        run: bash tools/ci_native_deps.sh full
      - name: Run reviewed contracts and retained regressions
        run: |
          ulimit -c 0
          run=()
          [[ "$RUNNER_OS" == Linux ]] && run=(xvfb-run -a -s "-screen 0 1280x1024x24")
          "${run[@]}" python3 -u tools/stdlib_runtime.py --jaic target/release/jaic --platform ${{ matrix.platform }} \
            --modes interp,native,wasm-interp,wasm-native --strict --coverage target/stdlib-coverage.txt
      - name: Reviewed contract native O2
        if: ${{ always() && !cancelled() }}
        run: python3 tests/stdlib-contract/run.py --jaic "$PWD/target/release/jaic" --stdlib-root "$PWD/stdlib" --mode native --opt O2
      - name: NEW producer behavior suites against production
        if: ${{ always() && !cancelled() }}
        run: |
          run=()
          if [[ "$RUNNER_OS" == Linux ]]; then
            run=(xvfb-run -a -s "-screen 0 1280x1024x24")
            font=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
          else
            font="/System/Library/Fonts/Supplemental/Arial.ttf"
          fi
          display=()
          [[ "$RUNNER_OS" == Linux ]] && display=(--private-x11-display)
          native="$(python3 -c 'import sys;sys.path.insert(0,"tools");import build_native_libs;print(build_native_libs.output_dir())')"
          "${run[@]}" python3 -u tools/check_stdlib_suites.py --jaic target/release/jaic --stdlib stdlib \
            --jailint target/debug/jailint --jaifmt target/jaifmt --native-libs "$native" --bindings-native-libs target/production-bindings/native --font "$font" "${display[@]}"
      - name: WebGPU without a window (wgpu-native, interpreted and built)
        # Renders offscreen, runs a compute shader, uploads a texture, maps buffers and checks
        # an error scope (tests/webgpu/headless.jai). Linux has Mesa's lavapipe; the macOS
        # runners are VMs whose Metal device may be missing, so there no adapter is a skip.
        if: ${{ always() && !cancelled() }}
        run: |
          require=()
          [[ "$RUNNER_OS" == Linux ]] && require=(--require-adapter)
          python3 -u tools/test_webgpu_native.py --jaic target/debug/jaic "${require[@]}"
      - name: WebGPU in a window (surface, configure, present, read back)
        # tests/webgpu/window.jai opens a Window_Creation window and presents frames to its
        # surface: on Linux an X11 surface on Xvfb, presented by lavapipe through Vulkan's Xlib WSI.
        if: ${{ always() && !cancelled() }}
        run: |
          run=() require=()
          [[ "$RUNNER_OS" == Linux ]] && run=(xvfb-run -a -s "-screen 0 1280x1024x24") require=(--require-adapter)
          "${run[@]}" python3 -u tools/test_webgpu_native.py --jaic target/debug/jaic --test window --frames 120 "${require[@]}"
      - name: Informational interpreter reachability
        if: ${{ always() && !cancelled() }}
        run: python3 tools/stdlib_coverage.py --record target/stdlib-coverage.txt --platform ${{ matrix.platform }}
  upstream-smoke:
    # Open-source Jai projects built with their own entry points (first.jai, build.jai and the
    # arguments their READMEs document) and run: CLIs and libraries answer a real request or pass
    # their tests, games and editors open a window on a virtual display for a few seconds and must
    # draw something (docs/tools/upstream-corpus.md). `windows-smoke` runs the same checks on
    # Windows.
    name: third-party projects (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: macos-arm64
          - runner: ubuntu-24.04
            platform: linux-x64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
    concurrency:
      group: ${{ github.workflow }}-upstream-smoke-${{ github.ref }}-${{ matrix.platform }}
      cancel-in-progress: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-unix
        with:
          brew: freetype
          alsa: 'true'
      - name: Build jaic
        run: cargo build --release --locked -p jaic-cli
      - name: Build the native helper libraries
        run: |
          if [ "$RUNNER_OS" = Linux ]; then bash tools/ci_native_deps.sh clipboard; fi
          bash tools/ci_native_deps.sh developer
      - name: Fetch the pinned projects
        run: |
          project_list="$(python3 tools/upstream_smoke.py --jaic x --projects)"
          read -r -a project_names <<< "$project_list"
          python3 tools/fetch_upstreams.py --only "${project_names[@]}"
      - name: Build and run the projects
        run: |
          ulimit -c 0
          run=()
          [[ "$RUNNER_OS" == Linux ]] && run=(xvfb-run -a -s "-screen 0 1280x1024x24")
          "${run[@]}" python3 -u tools/upstream_smoke.py --jaic target/release/jaic --platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() && !cancelled() }}
        with:
          name: smoke-screenshots-${{ matrix.platform }}
          path: target/smoke-screenshots
          if-no-files-found: ignore
  sanitizers:
    # Native builds of the test programs under AddressSanitizer and the IR-level UBSan checks,
    # with the interpreter's expectations; any sanitizer report fails the case
    # (docs/native/sanitizers.md).
    name: native tests under ASan and UBSan (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15]
    concurrency:
      group: ${{ github.workflow }}-sanitizers-${{ github.ref }}-${{ matrix.runner }}
      cancel-in-progress: true
    runs-on: ${{ matrix.runner }}
