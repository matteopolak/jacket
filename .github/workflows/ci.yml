  # Package channels against the latest published release: install.sh, install.ps1 and the
  # Homebrew formula rendered by tools/render_packages.py, each installed for real and run. Nothing
  # is published from here (release.yml publishes); see docs/tools/releases.md.
  shellcheck:
    needs: changes
    if: needs.changes.outputs.packaging == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint install.sh as POSIX sh
        run: shellcheck --version && shellcheck -s sh install.sh
  install-sh:
    needs: changes
    if: needs.changes.outputs.packaging == 'true'
    name: install.sh (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No release yet (a new repository, or before the first tag): the steps that install a
      # published release are skipped with a notice. Any other failure of `gh` still fails the job.
      - name: Is there a published release?
        id: released
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName 2> "$RUNNER_TEMP/gh-err.txt")"; then
            echo "Latest release: $tag"
            echo "published=true" >> "$GITHUB_OUTPUT"
          elif grep -qi 'release not found' "$RUNNER_TEMP/gh-err.txt"; then
            msg="$GITHUB_REPOSITORY has no published release yet, so the steps that install a published release are skipped; the locally built archive steps still run."
            echo "::notice title=No published release::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            cat "$RUNNER_TEMP/gh-err.txt"
            exit 1
          fi
      # A release may lack this platform's archive: then install.sh must pick the platform and
      # say the release has no build for it.
      - name: Does the latest release have this platform's archive?
        id: release
        if: steps.released.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$(uname -s)-$(uname -m)" in
            Darwin-arm64) plat=macos-arm64 ;;
            Darwin-x86_64) plat=macos-x64 ;;
            Linux-x86_64) plat=linux-x64 ;;
            Linux-aarch64) plat=linux-arm64 ;;
          esac
          echo "PLATFORM=$plat" >> "$GITHUB_ENV"
          assets="$(gh release view --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')"
          if echo "$assets" | grep -Eqx "jacket-$plat\.tar\.gz"; then has=true; else has=false; fi
          echo "$plat in the latest release: $has"
          echo "has=$has" >> "$GITHUB_OUTPUT"
      # Stub toolchains in archives laid out like a release's (SHA256SUMS, jai-<platform>.tar.gz),
      # served through JAI_BASE_URL=file://...: install, upgrade, a bad checksum and an occupied
      # command are exercised whether or not a release exists.
      - name: Install from locally built archives
        run: |
          case "$(uname -s)-$(uname -m)" in
            Darwin-arm64) plat=macos-arm64 ;;
            Darwin-x86_64) plat=macos-x64 ;;
            Linux-x86_64) plat=linux-x64 ;;
            Linux-aarch64) plat=linux-arm64 ;;
          esac
          root="$RUNNER_TEMP/local-release"
          build() { # version
            stage="$RUNNER_TEMP/stage-$1"
            rm -rf "$stage"
            mkdir -p "$stage/jacket-$plat/stdlib/prelude" "$root/v$1"
            for tool in jaic jailsp jailint jaifmt; do
              printf '#!/bin/sh\necho "%s %s"\n' "$tool" "$1" > "$stage/jacket-$plat/$tool"
              chmod +x "$stage/jacket-$plat/$tool"
            done
            : > "$stage/jacket-$plat/stdlib/prelude/module.jai"
            tar -czf "$root/v$1/jacket-$plat.tar.gz" -C "$stage" "jacket-$plat"
            (cd "$root/v$1" && shasum -a 256 "jacket-$plat.tar.gz" > SHA256SUMS)
          }
          build 9.0.1
          build 9.0.2
          export JAI_BASE_URL="file://$root" JAI_INSTALL_DIR="$RUNNER_TEMP/local/share" JAI_BIN_DIR="$RUNNER_TEMP/local/bin"
          JAI_VERSION=9.0.1 ./install.sh
          test "$("$JAI_BIN_DIR/jaic")" = "jaic 9.0.1"
          JAI_VERSION=9.0.2 ./install.sh
          test "$("$JAI_BIN_DIR/jaifmt")" = "jaifmt 9.0.2"
          test -d "$JAI_INSTALL_DIR/9.0.2" && test ! -e "$JAI_INSTALL_DIR/9.0.1"
          test "$(readlink "$JAI_BIN_DIR/jaic")" = "$JAI_INSTALL_DIR/9.0.2/jaic"
          # A damaged download is refused before anything is unpacked.
          echo damaged >> "$root/v9.0.2/jacket-$plat.tar.gz"
          if JAI_VERSION=9.0.2 ./install.sh 2> "$RUNNER_TEMP/err.txt"; then exit 1; fi
          cat "$RUNNER_TEMP/err.txt" && grep -q "checksum mismatch" "$RUNNER_TEMP/err.txt"
          # A command that is not one of our symlinks is never replaced.
          mkdir -p "$RUNNER_TEMP/occupied" && touch "$RUNNER_TEMP/occupied/jaic"
          if JAI_VERSION=9.0.1 JAI_BIN_DIR="$RUNNER_TEMP/occupied" ./install.sh 2> "$RUNNER_TEMP/err.txt"; then exit 1; fi
          cat "$RUNNER_TEMP/err.txt" && grep -q "is not a symlink" "$RUNNER_TEMP/err.txt"
          # An override needs an explicit version.
          if ./install.sh 2> "$RUNNER_TEMP/err.txt"; then exit 1; fi
          grep -q "JAI_BASE_URL needs JAI_VERSION" "$RUNNER_TEMP/err.txt"
      - name: Without one, install.sh names the missing archive
        if: steps.release.outputs.has == 'false'
        run: |
          if ./install.sh 2> err.txt; then exit 1; fi
          cat err.txt
          grep -Eq "has no jacket-$PLATFORM\.tar\.gz" err.txt
      - name: Install an older release, then upgrade to the latest through a pipe
        if: steps.release.outputs.has == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --json tagName -q '.[1].tagName')"
          latest="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)"
          echo "previous=$previous latest=$latest"
          JAIC_VERSION="$previous" ./install.sh
          test -d "$HOME/.local/share/jai/${previous#v}"
          # A PATH without the bin folder (the runners already have ~/.local/bin on theirs).
          PATH=/usr/bin:/bin sh < install.sh | tee out.txt
          grep -q "is not on your PATH" out.txt
          test -d "$HOME/.local/share/jai/${latest#v}"
          test ! -e "$HOME/.local/share/jai/${previous#v}"
          test "$(readlink "$HOME/.local/bin/jaic")" = "$HOME/.local/share/jai/${latest#v}/jaic"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run the installed toolchain outside the checkout
        if: steps.release.outputs.has == 'true'
        run: |
          cd "$RUNNER_TEMP"
          printf '#import "Basic";\n\nmain :: () {\n    print("hello from install.sh\\n");\n}\n' > hello.jai
          test "$(jaic hello.jai -interp)" = "hello from install.sh"
          jailint hello.jai
          test "$(echo 'main::(){x:=1;}' | jaifmt --stdin)" = "$(printf 'main :: () {\n    x := 1;\n}')"
          command -v jailsp
      - name: Custom directories (the JAI_* names; the steps around use JAIC_*), and a re-run of the same version
        if: steps.release.outputs.has == 'true'
        run: |
          export JAI_INSTALL_DIR="$RUNNER_TEMP/custom/share" JAI_BIN_DIR="$RUNNER_TEMP/custom/bin"
          ./install.sh
          ./install.sh
          test "$(find "$JAI_INSTALL_DIR" -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')" = 1
          cd "$RUNNER_TEMP" && "$JAI_BIN_DIR/jaic" hello.jai -interp
      - name: Bad versions and occupied commands fail with a message
        run: |
          if JAIC_VERSION=0.0.0-missing JAIC_INSTALL_DIR="$RUNNER_TEMP/x" JAIC_BIN_DIR="$RUNNER_TEMP/xb" ./install.sh 2> err.txt; then exit 1; fi
          cat err.txt && grep -q "could not download" err.txt
          # (Without an archive for this platform, install.sh stops before looking at the links.)
          if [ "${{ steps.release.outputs.has }}" != true ]; then exit 0; fi
          mkdir -p "$RUNNER_TEMP/occupied" && touch "$RUNNER_TEMP/occupied/jaic"
          if JAIC_BIN_DIR="$RUNNER_TEMP/occupied" ./install.sh 2> err.txt; then exit 1; fi
          cat err.txt && grep -q "is not a symlink" err.txt
  install-ps1:
    needs: changes
    if: needs.changes.outputs.packaging == 'true'
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No release yet (a new repository, or before the first tag): the steps that install a
      # published release are skipped with a notice. Any other failure of `gh` still fails the job.
      - name: Is there a published release?
        id: released
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName 2> "$RUNNER_TEMP/gh-err.txt")"; then
            echo "Latest release: $tag"
            echo "published=true" >> "$GITHUB_OUTPUT"
          elif grep -qi 'release not found' "$RUNNER_TEMP/gh-err.txt"; then
            msg="$GITHUB_REPOSITORY has no published release yet, so the steps that install a published release are skipped; the locally built archive steps still run."
            echo "::notice title=No published release::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            cat "$RUNNER_TEMP/gh-err.txt"
            exit 1
          fi
      # A stub toolchain in a release-shaped zip, served through JAI_BASE_URL=file:///...: runs
      # whether or not a release exists.
      - name: Install from a locally built archive
        shell: powershell
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'local-release'
          function Build($version) {
            $stage = Join-Path $env:RUNNER_TEMP "stage-$version"
            $top = Join-Path $stage 'jacket-windows-x64'
            New-Item -ItemType Directory -Force (Join-Path $top 'stdlib\prelude') | Out-Null
            foreach ($tool in 'jaic', 'jailsp', 'jailint', 'jaifmt') { "stub $version" | Set-Content (Join-Path $top "$tool.exe") }
            $dir = Join-Path $root "v$version"
            New-Item -ItemType Directory -Force $dir | Out-Null
            $zip = Join-Path $dir 'jacket-windows-x64.zip'
            Compress-Archive -Path $top -DestinationPath $zip -Force
            $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
            "$hash  jacket-windows-x64.zip" | Set-Content (Join-Path $dir 'SHA256SUMS')
          }
          Build '9.0.1'
          Build '9.0.2'
          $env:JAI_BASE_URL = ([Uri]$root).AbsoluteUri
          $env:JAI_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'local-install'
          $env:JAI_VERSION = '9.0.1'
          Get-Content -Raw install.ps1 | Invoke-Expression
          $env:JAI_VERSION = '9.0.2'
          Get-Content -Raw install.ps1 | Invoke-Expression
          if (-not (Test-Path (Join-Path $env:JAI_INSTALL_DIR '9.0.2\jaic.exe'))) { throw '9.0.2 was not installed' }
          if (Test-Path (Join-Path $env:JAI_INSTALL_DIR '9.0.1')) { throw '9.0.1 was not removed by the upgrade' }
          if (-not (Test-Path (Join-Path $env:JAI_INSTALL_DIR 'current\jaic.exe'))) { throw 'the current junction is broken' }
          # A damaged download is refused.
          Add-Content (Join-Path $root 'v9.0.2\jacket-windows-x64.zip') 'damaged'
          $rejected = $false
          try { Get-Content -Raw install.ps1 | Invoke-Expression } catch { $rejected = "$_" -match 'checksum mismatch' }
          if (-not $rejected) { throw 'a damaged archive was not rejected with a checksum error' }
      # Windows PowerShell 5.1, the way `irm ... | iex` runs it on a stock machine.
      - name: Install the latest release twice (the second run is an upgrade in place)
        if: steps.released.outputs.published == 'true'
        shell: powershell
        run: |
          Get-Content -Raw install.ps1 | Invoke-Expression
          Get-Content -Raw install.ps1 | Invoke-Expression
          $current = Join-Path $env:LOCALAPPDATA 'Programs\jai\current'
          if (-not (Test-Path (Join-Path $current 'stdlib\prelude\module.jai'))) { throw 'no stdlib next to jaic.exe' }
          if (([Environment]::GetEnvironmentVariable('Path', 'User') -split ';') -notcontains $current) { throw 'user PATH lacks the install' }
          @(Get-ChildItem -Directory (Join-Path $env:LOCALAPPDATA 'Programs\jai')).Count
          $current | Out-File -Encoding ascii -Append $env:GITHUB_PATH
      - name: Run the installed toolchain outside the checkout
        if: steps.released.outputs.published == 'true'
        shell: pwsh
        run: |
          Set-Location $env:RUNNER_TEMP
          "#import `"Basic`";`n`nmain :: () {`n    print(`"hello from install.ps1\n`");`n}`n" | Set-Content -NoNewline hello.jai
          $out = jaic hello.jai -interp
          if ($LASTEXITCODE -ne 0 -or $out -ne 'hello from install.ps1') { throw "jaic -interp printed '$out'" }
          jailint hello.jai
          if ($LASTEXITCODE -ne 0) { throw 'jailint failed' }
          (Get-Command jaifmt, jailsp).Source
  homebrew:
