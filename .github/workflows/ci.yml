name: compiler checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  scripting-wasm:
    name: scripting interpreter (LLVM-free WebAssembly)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain and wasm target
        run: |
          rustup toolchain install nightly-2026-08-29 --profile minimal --component rustfmt --component clippy
          rustup target add wasm32-unknown-unknown --toolchain nightly-2026-08-29
      - name: Validate dependency ages and public source inputs
        # Read-only GitHub API access for the commit dates of pinned git dependencies.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 tools/check_dependency_age.py
          python3 tools/check_ci_sources.py
      - name: Verify the wasm boundary and language server
        run: cargo test --locked -j 1 -p jai-language-server -p jai-wasm
      - name: Build and stage the real WebAssembly compiler without the native backend
        run: python3 tools/build_scripting_wasm.py --release --output artifacts/ci-wasm
      - name: Execute the real WebAssembly module
        run: |
          node --version
          node tools/check_scripting_wasm.mjs artifacts/ci-wasm/jai_wasm.wasm
          node tools/check_jai_format_wasm.mjs artifacts/ci-wasm/jai_wasm.wasm
      - name: Run every stdlib test in the browser engine
        # Every test must pass: one that needs what the browser lacks (processes, native libraries,
        # windows) skips that part itself under `OS == .WASM`. The browser release runs the same check.
        run: node tools/check_playground_stdlib.mjs artifacts/ci-wasm
      - name: Interpreter and browser engine agree (corpus and generated programs)
        # docs/tools/differential-testing.md; the host jaic needs no LLVM to interpret.
        run: |
          cargo build --locked -j 2 -p jaic-cli --no-default-features
          python3 tools/jaic-diff.py --jaic target/debug/jaic --backends interp,wasm --wasm artifacts/ci-wasm corpus gen:1:40
  test:
    name: compiler (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
          - runner: ubuntu-24.04
            architecture: x86_64
          - runner: ubuntu-24.04-arm
            architecture: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: '0'
      # The wasm target tests fail, rather than skip, without node or wasm-ld.
      JAIC_REQUIRE_WASM_TESTS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install nightly-2026-08-29 --profile minimal --component rustfmt --component clippy
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      # node 24: Memory64 without a flag, for the wasm64 modules `jaic build -os wasm` writes.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Validate dependency ages before building
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/check_dependency_age.py
      - name: Validate public checkout compilation inputs
        run: python3 tools/check_ci_sources.py
      - name: Install LLVM 23 (macOS)
        if: runner.os == 'macOS'
        run: |
          # lld@23: wasm-ld, which `jaic build -os wasm` links with (docs/native/wasm-target.md).
          brew install llvm@23 lld@23
          echo "LLVM_SYS_231_PREFIX=$(brew --prefix llvm@23)" >> "$GITHUB_ENV"
          echo "$(brew --prefix llvm@23)/bin" >> "$GITHUB_PATH"
      - name: Install LLVM 23 (Linux)
        if: runner.os == 'Linux'
        run: |
          bash tools/install_ci_llvm_linux.sh
          echo "LLVM_SYS_231_PREFIX=/usr/lib/llvm-23" >> "$GITHUB_ENV"
          echo "/usr/lib/llvm-23/bin" >> "$GITHUB_PATH"
      - name: Verify native host and LLVM
        run: |
          uname -sm
          test "$(uname -m)" = "${{ matrix.architecture }}"
          llvm-config --version
          clang --version
          node --version
      - name: Format check
        id: format
        continue-on-error: true
        run: python3 tools/check_rust_format.py
      - name: Lint
        id: lint
        continue-on-error: true
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Rust and native execution tests
        id: correctness
        continue-on-error: true
        # The full reference lexer requires the separately supplied sources.
        # Protected-tool rejection remains active without original native files.
        run: |
          ulimit -c 0
          cargo test --workspace --no-fail-fast --locked -- --skip lex_entire_reference_without_executing_it
      - name: Policy tests
        id: policy
        continue-on-error: true
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      # Reports doc rules without a test; fails only when a test cites an unknown rule ID.
      - name: Rule coverage
        id: rule-coverage
        continue-on-error: true
        run: python3 tools/check_rule_coverage.py --list-uncovered
      # The repository's Jai code must be formatted (settings: jaifmt.toml).
      - name: Jai format check
        id: jai-format
        continue-on-error: true  # recorded, then enforced by the last step like the other checks
        run: |
          cargo build --locked -p jaic-cli
          target/debug/jaic build tools/jaifmt/main.jai -O2 -o target/jaifmt
          target/jaifmt --check prelude stdlib tests benchmarks tools examples
      # The repository's Jai code must be lint-free (settings: jailint.toml).
      - name: Jai lint
        id: jai-lint
        continue-on-error: true
        run: |
          cargo build --locked -p jailint
          target/debug/jailint -D warnings -j 2 prelude stdlib examples tools tests benchmarks
      - name: Backend agreement
        id: backends
        continue-on-error: true
        # The interpreter, -O0 and -O2 native builds must print the same for the corpus and a
        # fixed set of generated programs (docs/tools/differential-testing.md has the full run).
        run: |
          cargo build --locked -p jaic-cli
          python3 tools/jaic-diff.py --jaic target/debug/jaic --backends interp,native,native-O2 corpus gen:1:40
      - name: WebAssembly target
        id: wasm-target
        continue-on-error: true
        # jaifmt compiled to wasm64 must format every golden case exactly like native jaifmt (built
        # by the Jai format check), and WASI modules must behave like the interpreter
        # (docs/native/wasm-target.md).
        run: |
          cargo build --locked -p jaic-cli
          target/debug/jaic build tools/jaifmt/wasm.jai -os wasm -O2 --no-debug-info -o target/jaifmt.wasm
          ls -l target/jaifmt.wasm
          node --no-warnings tools/check_jaifmt_wasm.mjs target/jaifmt.wasm target/jaifmt
          python3 tools/jaic-diff.py --jaic target/debug/jaic --backends interp,wasm-native corpus gen:1:40
      - name: Enforce all recorded checks
        if: ${{ always() && !cancelled() && (steps.format.outcome == 'failure' || steps.jai-format.outcome == 'failure' || steps.jai-lint.outcome == 'failure' || steps.lint.outcome == 'failure' || steps.correctness.outcome == 'failure' || steps.policy.outcome == 'failure' || steps.backends.outcome == 'failure' || steps.wasm-target.outcome == 'failure' || steps.rule-coverage.outcome == 'failure') }}
        run: |
          echo "One or more checks failed; see their original step diagnostics."
          exit 1
  sanitizers:
    # Native builds of the test programs under AddressSanitizer and the IR-level UBSan checks,
    # with the interpreter's expectations; any sanitizer report fails the case
    # (docs/native/sanitizers.md).
    name: native tests under ASan and UBSan (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install nightly-2026-08-29 --profile minimal
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Install LLVM 23 and its sanitizer runtimes (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm@23
          echo "LLVM_SYS_231_PREFIX=$(brew --prefix llvm@23)" >> "$GITHUB_ENV"
          echo "$(brew --prefix llvm@23)/bin" >> "$GITHUB_PATH"
      - name: Install LLVM 23 and its sanitizer runtimes (Linux)
        if: runner.os == 'Linux'
        run: |
          bash tools/install_ci_llvm_linux.sh
          echo "LLVM_SYS_231_PREFIX=/usr/lib/llvm-23" >> "$GITHUB_ENV"
          echo "/usr/lib/llvm-23/bin" >> "$GITHUB_PATH"
      - name: Install the libraries Simp and GetRect link (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends libx11-dev libgl-dev libegl-dev libfreetype-dev
      - name: Build jaic
        run: cargo build --locked -p jaic-cli
      # Runners have no display or GPU, so programs that open windows are built but not run
      # (--headless). Unoptimized code keeps every value in memory, so ASan sees each access;
      # -O2 is where LLVM acts on undefined behaviour and the bounds checks see the most objects.
      - name: Corpus, stdlib and module tests under ASan and UBSan (-O0)
        run: python3 tools/jaic-sweep.py --jaic target/debug/jaic --jobs 4 --timeout 300 --opt O0 --headless --sanitize address,undefined corpus stdlib modules
      - name: Corpus, stdlib and module tests under ASan and UBSan (-O2)
        if: ${{ always() && !cancelled() }}
        run: python3 tools/jaic-sweep.py --jaic target/debug/jaic --jobs 4 --timeout 300 --opt O2 --headless --sanitize address,undefined corpus stdlib modules
