name: compiler checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  scripting-wasm:
    name: scripting interpreter (LLVM-free WebAssembly)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain and wasm target
        run: |
          rustup toolchain install nightly-2026-08-29 --profile minimal --component rustfmt --component clippy
          rustup target add wasm32-unknown-unknown --toolchain nightly-2026-08-29
      - name: Validate dependency ages and public source inputs
        run: |
          python3 tools/check_dependency_age.py
          python3 tools/check_ci_sources.py
      - name: Verify the native scripting API and wasm boundary
        run: cargo test --locked -j 1 -p jai-runtime -p jai-wasm
      - name: Build the real WebAssembly interpreter without the native backend
        run: cargo build --locked -j 1 -p jai-wasm --target wasm32-unknown-unknown
      - name: Execute the real WebAssembly module
        run: |
          node --version
          node tools/check_scripting_wasm.mjs target/wasm32-unknown-unknown/debug/jai_wasm.wasm
  test:
    name: compiler (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
          - runner: ubuntu-24.04
            architecture: x86_64
          - runner: ubuntu-24.04-arm
            architecture: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install nightly-2026-08-29 --profile minimal --component rustfmt --component clippy
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Validate dependency ages before building
        run: python3 tools/check_dependency_age.py
      - name: Validate public checkout compilation inputs
        run: python3 tools/check_ci_sources.py
      - name: Install LLVM 22 (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm@22
          echo "LLVM_SYS_221_PREFIX=$(brew --prefix llvm@22)" >> "$GITHUB_ENV"
          echo "$(brew --prefix llvm@22)/bin" >> "$GITHUB_PATH"
      - name: Install LLVM 22 (Linux)
        if: runner.os == 'Linux'
        run: |
          bash tools/install_ci_llvm_linux.sh
          echo "LLVM_SYS_221_PREFIX=/usr/lib/llvm-22" >> "$GITHUB_ENV"
          echo "/usr/lib/llvm-22/bin" >> "$GITHUB_PATH"
      - name: Verify native host and LLVM
        run: |
          uname -sm
          test "$(uname -m)" = "${{ matrix.architecture }}"
          llvm-config --version
          clang --version
      - name: Format check
        id: format
        continue-on-error: true
        run: python3 tools/check_rust_format.py
      - name: Lint
        id: lint
        continue-on-error: true
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Rust and native execution tests
        id: correctness
        continue-on-error: true
        # The full reference lexer requires the separately supplied sources.
        # Protected-tool rejection remains active without original native files.
        run: |
          ulimit -c 0
          cargo test --workspace --no-fail-fast --locked -- --skip lex_entire_reference_without_executing_it
      - name: Policy tests
        id: policy
        continue-on-error: true
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Benchmark smoke checks (no timing gate on shared runners)
        id: benchmarks
        continue-on-error: true
        run: cargo bench -p jai-bench --bench compiler --bench vm --bench discovery --locked -- --test --skip reference_lex
      - name: Enforce all recorded checks
        if: ${{ always() && !cancelled() && (steps.format.outcome == 'failure' || steps.lint.outcome == 'failure' || steps.correctness.outcome == 'failure' || steps.policy.outcome == 'failure' || steps.benchmarks.outcome == 'failure') }}
        run: |
          echo "One or more checks failed; see their original step diagnostics."
          exit 1
