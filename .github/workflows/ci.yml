name: compiler checks
on:
  push:
    branches: [main]
  pull_request:
  # The full matrix (macOS Intel, packaging on macOS) runs nightly and by hand; see
  # docs/tools/development.md.
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      jobs:
        description: 'Comma-separated job ids to run (empty runs everything); select needed jobs together'
        required: false
        default: ''
      tier:
        description: 'fast: what pushes run; full: the nightly set (tools/ci/ci_changes.py)'
        type: choice
        options: [full, fast]
        default: full
permissions:
  contents: read
env:
  # tools/ holds the folders the Python scripts import from (`from toolkit.repo import ROOT`).
  PYTHONPATH: ${{ github.workspace }}/tools
  LLVM_VERSION: 23.1.2
  # llvm-mingw (https://github.com/mstorsjo/llvm-mingw): the MinGW-w64 toolchain for Windows arm64.
  LLVM_MINGW_VERSION: '20260922'
  # Mesa's llvmpipe software OpenGL for the Windows window tests (the runners only have GDI's
  # OpenGL 1.1): the prebuilt https://github.com/mmozeiko/build-mesa release, one opengl32.dll per
  # CPU. It goes next to the programs, which Windows searches before System32.
  MESA_VERSION: 26.2.5
  MESA_SHA256_X64: d1b713ca2a7fba47a50c058099f13c435ddb76a16a422c334e4d787f9755a31d
  MESA_SHA256_ARM64: e7df75398d50e07a68bbffa5cff2ece4c85e5f8ef8bda497f560dd04fe60cbbd
  GALLIUM_DRIVER: llvmpipe
# A newer push to a branch supersedes the older run there. On main the light jobs (compiler
# tests, lint, wasm, VS Code) finish for every push, while the heavy ones (stdlib runtime,
# third-party projects, sanitizers, macOS Intel) set their own concurrency so a newer push to
# main supersedes them. Cancel a run by hand with `gh run cancel` when it is not needed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    # Which of the path-gated jobs below run (tools/ci/ci_changes.py lists the paths).
    name: select what runs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      jobs: ${{ steps.select.outputs.jobs }}
      full: ${{ steps.select.outputs.full }}
      test_matrix: ${{ steps.select.outputs.test_matrix }}
      stdlib_matrix: ${{ steps.select.outputs.stdlib_matrix }}
      sanitizer_matrix: ${{ steps.select.outputs.sanitizer_matrix }}
      windows_stdlib_matrix: ${{ steps.select.outputs.windows_stdlib_matrix }}
      windows_native_matrix: ${{ steps.select.outputs.windows_native_matrix }}
      windows_cross_matrix: ${{ steps.select.outputs.windows_cross_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: select
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SHA: ${{ github.sha }}
          JOBS: ${{ inputs.jobs }}
          TIER: ${{ inputs.tier }}
        run: python3 tools/ci/ci_changes.py
  docs:
    # Runs for every change, docs-only ones too: the rule IDs that tests cite must exist in the
    # language docs. Also lists the doc rules no test cites (tools/dev/check_rule_coverage.py).
    if: contains(fromJSON(needs.changes.outputs.jobs), 'docs')
    name: rule coverage
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 tools/dev/check_rule_coverage.py --list-uncovered
      # ruff's default rules over the Python tooling (ruff.toml; the version is pinned in .github/pins.json).
      - name: Python lint
        run: |
          python3 -m pip install ruff==0.14.14
          ruff check tools .github
  fuzz-regressions:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'fuzz-regressions')
    # Replays the saved crash inputs so fixed crashes stay fixed (nightly fuzzing: fuzz.yml).
    name: replay fuzz regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: python3 tools/ci/install_pinned.py rust
      - uses: ./.github/actions/rust-cache
        with:
          workspaces: fuzz
      - uses: ./.github/actions/dependency-age-cache
      - name: Validate fuzz dependency ages
        run: python3 tools/ci/check_dependency_age.py --lockfile fuzz/Cargo.lock
      - name: Replay fuzz/regressions through the harnesses
        run: cargo test --locked --manifest-path fuzz/harness/Cargo.toml
  scripting-wasm:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'scripting-wasm')
    name: scripting interpreter (LLVM-free WebAssembly)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # node 24: JSPI's WebAssembly.Suspending (behind --experimental-wasm-jspi) for the WebGPU host test.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install the pinned Rust toolchain and wasm target
        run: python3 tools/ci/install_pinned.py rust --component rustfmt --component clippy --target wasm32-unknown-unknown
      - uses: ./.github/actions/rust-cache
      - uses: ./.github/actions/dependency-age-cache
      - name: Validate dependency ages before building
        # Read-only GitHub API access for the commit dates of pinned git dependencies. Every job
        # that compiles the crates checks their ages first; the repo checks run on the `jai` leg.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/ci/check_dependency_age.py
      - name: Fetch the locked crates
        # The wasm build below runs offline.
        run: cargo fetch --locked
      - name: Build and stage the real WebAssembly compiler without the native backend
        run: python3 tools/browser/build_scripting_wasm.py --release --output target/ci-wasm
      - name: Execute the real WebAssembly module
        run: |
          node --version
          node tools/browser/check_scripting_wasm.mjs target/ci-wasm/jai_wasm.wasm
          node tools/browser/check_jaifmt_wasm.mjs engine target/ci-wasm/jai_wasm.wasm
          node --test tools/browser/test_*.mjs
      - name: WebGPU host bridge (mock WebGPU; the engine suspends through JSPI)
        # docs/extensions/webgpu.md#tests. Node 24 has JSPI behind a V8 flag, so the file runs
        # directly (node:test in this process) rather than in a `--test` child without the flag.
        run: JAI_WASM_DIR=target/ci-wasm node --experimental-wasm-jspi tools/bindings/test_webgpu_host.mjs
      - name: Run every stdlib test in the browser engine
        # Some tests are skipped because they need what the browser lacks (native libraries, windows); a test that only
        # partly does skips that part itself under `OS == .WASM`. The browser release runs the same check.
        run: node tools/browser/check_playground_stdlib.mjs target/ci-wasm
      - name: Interpreter and browser engine agree (corpus and generated programs)
        # docs/tools/testing.md; the host jaic needs no LLVM to interpret.
        run: |
          cargo build --locked -j 2 -p jaic-cli --no-default-features
          python3 tools/differential/jaic_diff.py --jaic target/debug/jaic --backends interp,wasm --wasm target/ci-wasm corpus gen:1:40
  test:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'test')
    name: compiler (${{ matrix.runner }}, ${{ matrix.part }}${{ matrix.shard != '1/1' && format(' {0}', matrix.shard) || '' }})
    strategy:
      fail-fast: false
      matrix:
        # The legs and their `part`s come from tools/ci/ci_changes.py (test_matrix): pushes run the
        # fast tier, nightly and manual runs the full one.
        include: ${{ fromJSON(needs.changes.outputs.test_matrix) }}
    concurrency:
      group: ${{ github.workflow }}-test-${{ github.ref }}-${{ matrix.runner }}-${{ matrix.part }}-${{ matrix.shard }}-${{ github.sha }}
      cancel-in-progress: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: '0'
      # The wasm target tests fail, rather than skip, without node or wasm-ld.
      JAIC_REQUIRE_WASM_TESTS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-unix
        with:
          lld: 'true'
          font: 'false'
      # The format and lint steps below run the Justfile's recipes (docs/tools/development.md).
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: '1.58.0'
      # node 24: Memory64 without a flag, for the wasm64 modules `jaic -os wasm` writes.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      # Platform-neutral checks run once, on the Linux x64 `jai` leg.
      - uses: ./.github/actions/dependency-age-cache
        if: ${{ matrix.runner == 'ubuntu-24.04' && matrix.part == 'jai' }}
      - name: Validate dependency ages before building
        if: ${{ matrix.runner == 'ubuntu-24.04' && matrix.part == 'jai' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/ci/check_dependency_age.py
      - name: Validate public checkout compilation inputs
        if: ${{ matrix.runner == 'ubuntu-24.04' && matrix.part == 'jai' }}
        run: |
          just repo-checks
          python3 tools/ci/check_diagnostics_covered.py
      - name: Verify native host and LLVM
        run: |
          uname -sm
          test "$(uname -m)" = "${{ matrix.architecture }}"
          llvm-config --version
          clang --version
          node --version
      - uses: ./.github/actions/native-libs-cache
      - name: Build the native helper libraries
        id: setup
        run: |
          if [ "$RUNNER_OS" = Linux ]; then bash tools/native/ci_native_deps.sh clipboard; fi
          bash tools/native/ci_native_deps.sh developer
      # Each check runs even when an earlier one failed (once setup has
      # succeeded), so every failure shows as its own red step and fails the job.
      # `just fmt`, `just lint` and the jailint they run use every core instead of the local default of 3.
      - name: Use every core for fmt and lint
        run: echo "JAI_JOBS=$(getconf _NPROCESSORS_ONLN)" >> "$GITHUB_ENV"
      # The Rust format and clippy checks run on the first Rust shard of each platform.
      - name: Format check
        id: format
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && matrix.part == 'rust' && startsWith(matrix.shard, '1/') }}
        run: just fmt --check --lang rust
      - name: Lint
        id: lint
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && matrix.part == 'rust' && startsWith(matrix.shard, '1/') }}
        run: just lint --lang rust
      - name: Rust and native execution tests
        id: correctness
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && matrix.part == 'rust' }}
        # One share of the tests (nextest's slice partition; doctests run in the first). The full
        # reference lexer requires the separately supplied sources. On Linux the step stops itself
        # before the job's timeout and runs under a memory limit, so a runaway test fails by name
        # instead of freezing the runner (tools/ci/run_watched.sh).
        env:
          EXPR: ${{ matrix.expr }}
        run: |
          ulimit -c 0
          tools/ci/run_watched.sh 29 -- python3 tools/dev/dev.py test --suite cargo -j "$(getconf _NPROCESSORS_ONLN)" \
            --partition "slice:${{ matrix.shard }}" --expr "$EXPR"
      # Per-test durations, for planning the shards (docs/tools/testing.md).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && matrix.part == 'rust' }}
        with:
          name: rust-test-durations-${{ matrix.runner }}-${{ strategy.job-index }}
          path: target/nextest/ci/junit.xml
          retention-days: 14
          if-no-files-found: ignore
      - name: Native tests with every program divided into parts
        id: split-native
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && matrix.part == 'split' }}
        # JACKET_TEST_CODEGEN_UNITS=4 (the tests start jaic with -codegen_units 4) divides each native build into four codegen units (call-graph parts
        # when optimized), so a code generation bug that only shows across parts fails here
        # (docs/native/llvm-backend.md). Tests about a single module pin one unit themselves.
        run: JACKET_TEST_CODEGEN_UNITS=4 cargo nextest run --profile ci -p jaic-cli --locked --test native --test optimized_split --test debug_info --test embedded_data
      - name: Stdlib type-checks and Objective-C selectors
        id: stdlib-targets
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && matrix.part == 'targets' }}
        # Every stdlib module with -no_dce for linux, macos, windows and wasm, against
        # tests/compiler/stdlib-targets.txt, one share of the module and target pairs per shard
        # (JACKET_STDLIB_TARGETS_PART); every Objective-C selector against its arguments and, on
        # macOS, the runtime (docs/tools/testing.md), in the first shard.
        env:
          JACKET_STDLIB_TARGETS_PART: ${{ matrix.shard }}
        run: |
          objc=()
          [[ "$JACKET_STDLIB_TARGETS_PART" == 1/* ]] && objc=(--test objc_selectors)
          cargo nextest run --profile ci --ignore-default-filter -p jaic-cli --locked --test stdlib_targets "${objc[@]}"
      - name: Prepare hash-pinned SDL Python test inputs
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && matrix.part == 'jai' }}
        run: python3 tools/bindings/prepare_sdl_python_tests.py --scratch "$RUNNER_TEMP/sdl-python" --cache "$RUNNER_TEMP/sdl-python-cache" >> "$GITHUB_ENV"
      # The repository's Jai code must be formatted (settings: jacket.toml).
      - name: Jai format check
        id: jai-format
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && matrix.part == 'jai' }}
        run: just fmt --check --lang jai
      # After the Jai format check, which builds the jaifmt binary the generator tests format with.
      - name: Policy tests
        id: policy
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && matrix.part == 'jai' }}
        # tools/run_tests.py discovers each tools/ folder (tools/ has no __init__.py), native_bindings/ and bench/ included.
        run: |
          python3 tools/run_tests.py
      # The checked-in native bindings must be exactly what the reviewed specs generate.
      - name: Generated bindings check
        id: bindings-check
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && matrix.part == 'jai' && matrix.runner == 'ubuntu-24.04' }}
        working-directory: tools/native_bindings
        run: python3 generate.py --check --formatter ../../target/jaifmt
      # Every other generator must reproduce its checked-in files (docs/tools/tools-layout.md).
      # The generators' pinned downloads (toolkit.download), kept between runs because
      # raw.githubusercontent.com and unicode.org rate-limit runners.
      - name: Cache generator downloads
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && matrix.part == 'jai' && matrix.runner == 'ubuntu-24.04' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/generator-downloads
          key: generator-downloads-${{ hashFiles('tools/generators/gen_*.py') }}
          restore-keys: generator-downloads-
      - name: Generated sources check
        id: generated-check
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && matrix.part == 'jai' && matrix.runner == 'ubuntu-24.04' }}
        env:
          XDG_CACHE_HOME: ${{ runner.temp }}/generator-downloads
        run: python3 tools/generators/check_generated.py --formatter target/jaifmt
      - name: Native Linux File_Watcher ownership and notifications
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && runner.os == 'Linux' && matrix.part == 'jai' }}
        id: file-watcher-native
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          cargo build --locked -p jaic-cli -p jailint
          test -x target/jaifmt
          python3 tools/stdlib/check_file_watcher_platforms.py --compiler target/debug/jaic --linter target/debug/jailint --formatter target/jaifmt --native-runtime
      # The repository's Jai code must be lint-free (settings: jacket.toml). An optimized
      # jailint: the debug build needs longer than the job's whole timeout to lint the tree.
      # Portable code (settings: [lint.portability] in jacket.toml) is compiled once per target
      # OS, so an import of an OS-only module fails here rather than in a build for that OS.
      - name: Jai lint
        id: jai-lint
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && matrix.part == 'lint' }}
        run: just lint --lang jai --release
      - name: Jai portability lint
        id: jai-portability
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && matrix.part == 'portability' }}
        run: |
          cargo build --locked --release -p jailint
          target/release/jailint -A all -D platform_leak -j "$(nproc)" --allow-incomplete stdlib
      # One runner lints each other target's modules: the host lint skips what only compiles for
      # another OS, so a Windows-only finding would otherwise never surface.
      - name: Jai lint for another target
        id: jai-lint-targets
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && startsWith(matrix.part, 'lint-') }}
        run: just lint --lang jai --release --os "${MATRIX_PART#lint-}"
        env:
          MATRIX_PART: ${{ matrix.part }}
      - name: Backend agreement
        id: backends
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && matrix.part == 'diff' }}
        # The interpreter, -O0 and -O2 native builds and (on Linux x64) wasm must print the same for
        # the corpus and a fixed set of generated programs (docs/tools/testing.md has the full run).
        run: |
          cargo build --locked -p jaic-cli
          backends=interp,native,native-O2
          if [ "$RUNNER_OS" = Linux ] && [ "${{ matrix.architecture }}" = x86_64 ]; then backends=$backends,wasm-native; fi
          python3 tools/differential/jaic_diff.py --jaic target/debug/jaic --backends "$backends" corpus gen:1:40
      - name: WebAssembly target
        id: wasm-target
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && matrix.part == 'diff' && runner.os == 'Linux' && matrix.architecture == 'x86_64' }}
        # jaifmt compiled to wasm64 must format every golden case exactly like native jaifmt, and WASI
        # modules must behave like the interpreter (docs/native/wasm-target.md).
        run: |
          cargo build --locked -p jaic-cli
          target/debug/jaic jaifmt/main.jai -O2 -exe target/jaifmt
          python3 tools/stdlib/check_platform_io.py --jaic target/debug/jaic --stdlib stdlib --wasm --case File/tests/unicode-paths
          target/debug/jaic jaifmt/wasm.jai -os wasm -O2 -no_debug_info -exe target/jaifmt.wasm
          ls -l target/jaifmt.wasm
          node --no-warnings tools/browser/check_jaifmt_wasm.mjs wasi target/jaifmt.wasm target/jaifmt
  vscode-extension:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'vscode-extension')
    # editors/vscode: lint, unit and grammar tests, VS Code integration tests against a debug
    # jailsp, and the .vsix (docs/tools/vscode-extension.md).
    name: VS Code extension
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: '0'
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install the pinned toolchain
        working-directory: .
        run: python3 tools/ci/install_pinned.py rust
      - uses: ./.github/actions/dependency-age-cache
      - name: Validate dependency ages before installing or building
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 ../../tools/ci/check_dependency_age.py --lockfile ../../Cargo.lock
          node scripts/check-dependency-age.ts
      # The pnpm version comes from package.json's packageManager, which the age check covers.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: editors/vscode/package.json
      - name: Install npm dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Lint (oxlint, tsc, generated grammar and schemas up to date)
        run: pnpm run lint
      - name: Unit and grammar tests
        # The grammar must also get through every .jai file in examples/ and stdlib/ without
        # ending inside a string or comment.
        run: pnpm test
      - name: Build jailsp
        working-directory: .
        run: cargo build --locked -j 2 -p jai-language-server
      - name: Integration tests in VS Code
        env:
          JAILSP: ${{ github.workspace }}/target/debug/jailsp
        run: xvfb-run -a pnpm run test:e2e
      - name: Package the .vsix
        run: pnpm run package -o jacket-vscode.vsix
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vscode-extension
          path: editors/vscode/jacket-vscode.vsix
          if-no-files-found: error
  neovim-plugin:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'neovim-plugin')
    # editors/nvim: the headless tests, including an end-to-end run against a debug jailsp
    # (docs/tools/neovim-plugin.md).
    name: Neovim plugin
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: '0'
      NVIM_VERSION: v0.12.4
      NVIM_SHA256: 012bf3fcac5ade43914df3f174668bf64d05e049a4f032a388c027b1ebd78628
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Neovim (pinned release, checksum verified)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/nvim.tar.gz" "https://github.com/neovim/neovim/releases/download/${NVIM_VERSION}/nvim-linux-x86_64.tar.gz"
          echo "${NVIM_SHA256}  $RUNNER_TEMP/nvim.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/nvim"
          tar -xzf "$RUNNER_TEMP/nvim.tar.gz" -C "$RUNNER_TEMP/nvim" --strip-components=1
          echo "$RUNNER_TEMP/nvim/bin" >> "$GITHUB_PATH"
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: '1.58.0'
      - name: Install the pinned toolchain
        run: python3 tools/ci/install_pinned.py rust
      - name: Run the plugin tests (builds only jailsp)
        run: just nvim-test -j 2
  stdlib-runtime:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'stdlib-runtime')
    name: stdlib runtime tests (${{ matrix.platform }}, ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        # The legs come from tools/ci/ci_changes.py (stdlib_matrix). A K/N shard runs every Nth
        # stdlib test (tools/stdlib/stdlib_runtime.py --shard) in `modes`, and again at -O2 when
        # `o2` is set; the other legs run the producer suites in `suites`, and the `suites` leg also
        # the WebGPU checks, and `jacket test` where no tooling leg runs it.
        include: ${{ fromJSON(needs.changes.outputs.stdlib_matrix) }}
    concurrency:
      group: ${{ github.workflow }}-stdlib-runtime-${{ github.ref }}-${{ matrix.platform }}-${{ matrix.shard }}-${{ github.sha }}
      cancel-in-progress: true
    runs-on: ${{ fromJSON('{"macos-arm64":"macos-15","macos-x64":"macos-15-intel","linux-x64":"ubuntu-24.04","linux-arm64":"ubuntu-24.04-arm"}')[matrix.platform] }}
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-unix
        with:
          lld: 'true'
          # The stdlib's FreeType is built by tools/native/build_native_libs.py and found first;
          # Homebrew's stays for projects that link it themselves. SDL2 is not built there:
          # stdlib/SDL/tests/geometry-timer.jai uses Homebrew's.
          brew: freetype sdl2 mingw-w64
          alsa: 'true'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Build production compiler and lint tools
        run: |
          cargo build --locked -p jaic-cli -p jailint
          cargo build --locked --release -p jaic-cli -p jacket
          target/debug/jaic jaifmt/main.jai -O2 -exe target/jaifmt
      - uses: ./.github/actions/native-libs-cache
        with:
          helpers: 'true'
      - name: Build private native dependencies from source
        run: bash tools/native/ci_native_deps.sh full
      - name: Run reviewed contracts and retained regressions
        if: ${{ contains(matrix.shard, '/') }}
        run: |
          ulimit -c 0
          run=()
          [[ "$RUNNER_OS" == Linux ]] && run=(xvfb-run -a -s "-screen 0 1280x1024x24")
          "${run[@]}" python3 -u tools/stdlib/stdlib_runtime.py --jaic target/release/jaic --platform ${{ matrix.platform }} --shard ${{ matrix.shard }} \
            --modes ${{ matrix.modes }} --strict --timeout 600 --coverage target/stdlib-coverage.txt
      - name: Stdlib tests, native O2
        if: ${{ always() && !cancelled() && matrix.o2 }}
        run: |
          ulimit -c 0
          run=()
          [[ "$RUNNER_OS" == Linux ]] && run=(xvfb-run -a -s "-screen 0 1280x1024x24")
          "${run[@]}" python3 -u tools/stdlib/stdlib_runtime.py --jaic target/release/jaic --platform ${{ matrix.platform }} --shard ${{ matrix.shard }} \
            --modes native --opt O2 --strict --timeout 600
      - name: Stdlib tests run by jacket test
        # The modules under `[test] paths` in jacket.toml (stdlib_runtime.py skips them), once per
        # platform: native, interpreted and native -O2, and with `wasm`, wasm interpreted and built.
        # `jacket_test` is `all`, or `hash:K/N`: this leg's share, which spreads them over the
        # platform's tooling legs (tools/ci/stdlib_jacket_test.sh).
        if: ${{ always() && !cancelled() && matrix.jacket_test }}
        env:
          WASM: ${{ matrix.wasm }}
          JACKET_TEST_PARTITION: ${{ matrix.jacket_test }}
        run: bash tools/ci/stdlib_jacket_test.sh
      # The `stdlib-coverage` job reports the interpreter reachability of all shards together.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() && !cancelled() && contains(matrix.shard, '/') }}
        with:
          name: stdlib-coverage-${{ matrix.platform }}-${{ strategy.job-index }}
          path: target/stdlib-coverage.txt
          retention-days: 3
          if-no-files-found: ignore
      - name: NEW producer behavior suites against production
        # The suite legs run the suites `matrix.suites` names, two groups at a time; the independent
        # suites share no scratch directory across groups (GROUPS in check_stdlib_suites.py).
        if: ${{ always() && !cancelled() && matrix.suites }}
        env:
          SUITES: ${{ matrix.suites }}
          TOOLING_PART: ${{ matrix.tooling_part }}
        run: bash tools/ci/stdlib_producer_suites.sh
      - name: WebGPU without a window (wgpu-native, interpreted and built)
        # Renders offscreen, runs a compute shader, uploads a texture, maps buffers and checks
        # an error scope (stdlib/Extensions/WebGPU/tests/headless.jai). Linux has Mesa's lavapipe; the macOS
        # runners are VMs whose Metal device may be missing, so there no adapter is a skip.
        if: ${{ always() && !cancelled() && matrix.shard == 'suites' }}
        run: |
          require=()
          [[ "$RUNNER_OS" == Linux ]] && require=(--require-adapter)
          python3 -u tools/bindings/run_webgpu_native.py --jaic target/debug/jaic "${require[@]}"
      - name: WebGPU in a window (surface, configure, present, read back)
        # stdlib/Extensions/WebGPU/tests/window.jai opens a Window_Creation window and presents frames to its
        # surface: on Linux an X11 surface on Xvfb, presented by lavapipe through Vulkan's Xlib WSI.
        if: ${{ always() && !cancelled() && matrix.shard == 'suites' }}
        run: |
          run=() require=()
          [[ "$RUNNER_OS" == Linux ]] && run=(xvfb-run -a -s "-screen 0 1280x1024x24") require=(--require-adapter)
          "${run[@]}" python3 -u tools/bindings/run_webgpu_native.py --jaic target/debug/jaic --test window --frames 120 "${require[@]}"
  stdlib-coverage:
    # Informational: the stdlib procedures the interpreter reached across a platform's shards
    # (tools/stdlib/stdlib_coverage.py).
    name: stdlib interpreter reachability
    needs: [changes, stdlib-runtime, windows-stdlib]
    # Not on pushes: it only reports, and waiting for it adds a minute to the run.
    if: ${{ always() && !cancelled() && needs.changes.outputs.full == 'true' && needs.stdlib-runtime.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: stdlib-coverage-*
          path: target/coverage
      - name: Report each platform
        run: |
          # One artifact per shard, named stdlib-coverage-<platform>-<job index>.
          shopt -s nullglob
          for shard in target/coverage/*/; do
            platform="$(basename "$shard" | sed -E 's/^stdlib-coverage-(.*)-[0-9]+$/\1/')"
            cat "$shard/stdlib-coverage.txt" >> "target/$platform.coverage"
          done
          for record in target/*.coverage; do
            python3 tools/stdlib/stdlib_coverage.py --record "$record" --platform "$(basename "$record" .coverage)"
          done
  upstream-smoke:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'upstream-smoke')
    # Open-source Jai projects built with their own entry points (first.jai, build.jai and the
    # arguments their READMEs document) and run: CLIs and libraries answer a real request or pass
    # their tests, games and editors open a window on a virtual display for a few seconds and must
    # draw something (docs/tools/upstream-corpus.md). `windows-smoke` runs the same checks on
    # Windows.
    name: third-party projects (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        # macOS and Linux arm64 only in the full tier.
        include: ${{ fromJSON(needs.changes.outputs.full == 'true' && '[{"runner":"macos-15","platform":"macos-arm64"},{"runner":"ubuntu-24.04","platform":"linux-x64"},{"runner":"ubuntu-24.04-arm","platform":"linux-arm64"}]' || '[{"runner":"ubuntu-24.04","platform":"linux-x64"}]') }}
    concurrency:
      group: ${{ github.workflow }}-upstream-smoke-${{ github.ref }}-${{ matrix.platform }}
      cancel-in-progress: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-unix
        with:
          brew: freetype
          alsa: 'true'
      - name: Install bubblewrap
        # The third-party programs run in a sandbox (tools/bench/sandbox.py); Ubuntu 24.04 restricts
        # the unprivileged user namespaces bubblewrap needs.
        if: ${{ runner.os == 'Linux' }}
        run: |
          bash tools/ci/apt_install.sh bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build jaic
        run: cargo build --release --locked -p jaic-cli
      - uses: ./.github/actions/native-libs-cache
      - name: Build the native helper libraries
        run: |
          if [ "$RUNNER_OS" = Linux ]; then bash tools/native/ci_native_deps.sh clipboard; fi
          bash tools/native/ci_native_deps.sh developer
      # The blobless mirrors the fetch keeps (tools/fetch_upstreams.py); every blob is checked
      # against its pinned git id, so a restored mirror only saves the clone.
      - name: Cache the upstream mirrors
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/cache/upstream
          key: upstream-mirrors-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('corpus/upstreams.json', 'tools/upstream-cases.json') }}
          restore-keys: upstream-mirrors-${{ runner.os }}-${{ runner.arch }}-
      - name: Restore the upstream mirrors
        if: ${{ github.ref != 'refs/heads/main' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/cache/upstream
          key: upstream-mirrors-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('corpus/upstreams.json', 'tools/upstream-cases.json') }}
          restore-keys: upstream-mirrors-${{ runner.os }}-${{ runner.arch }}-
      - name: Fetch the pinned projects
        run: |
          project_list="$(python3 tools/corpus/upstream_smoke.py --jaic x --projects)"
          read -r -a project_names <<< "$project_list"
          python3 tools/fetch_upstreams.py --only "${project_names[@]}"
      - name: Build and run the projects
        run: |
          ulimit -c 0
          run=()
          [[ "$RUNNER_OS" == Linux ]] && run=(xvfb-run -a -s "-screen 0 1280x1024x24")
          "${run[@]}" python3 -u tools/corpus/upstream_smoke.py --jaic target/release/jaic --platform ${{ matrix.platform }}
      - name: Check the x64-only projects
        # Cases restricted to linux-x64 in tools/upstream-cases.json (CPUID, #asm, the Linux Vulkan
        # configuration of Vk-Engine): selected by tools/corpus/select_upstream_cases.py, run as
        # sweep cases.
        if: ${{ matrix.platform == 'linux-x64' }}
        run: |
          read -ra repos <<< "$(python3 tools/corpus/select_upstream_cases.py --platform linux-x64 --repos)"
          python3 tools/fetch_upstreams.py --only "${repos[@]}"
          xvfb-run -a python3 -u tools/differential/jaic_sweep.py --jaic target/release/jaic --timeout 600 -v upstream --only-platform linux-x64
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() && !cancelled() }}
        with:
          name: smoke-screenshots-${{ matrix.platform }}
          path: target/smoke-screenshots
          if-no-files-found: ignore
  sanitizers:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'sanitizers')
    # Native builds of the test programs under AddressSanitizer and the IR-level UBSan checks,
    # with the interpreter's expectations; any sanitizer report fails the case
    # (docs/native/sanitizers.md).
    name: native tests under ASan and UBSan (${{ matrix.runner }}, ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        # From tools/ci/ci_changes.py (sanitizer_matrix): Linux split in shards
        # (tools/differential/jaic_sweep.py --shard); macOS in the full tier, and on pushes that
        # change what ASan builds (the `sanitizers-macos` area): its slot is the scarcest.
        include: ${{ fromJSON(needs.changes.outputs.sanitizer_matrix) }}
    concurrency:
      group: ${{ github.workflow }}-sanitizers-${{ github.ref }}-${{ matrix.runner }}-${{ matrix.shard }}
      cancel-in-progress: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-unix
        with:
          # stdlib/SDL/tests/geometry-timer.jai links the installed SDL2.
          brew: sdl2 freetype
          alsa: 'true'
      - uses: ./.github/actions/native-libs-cache
        with:
          helpers: 'true'
      - name: Build the native helper libraries
        run: bash tools/native/ci_native_deps.sh full
      - name: Build jaic
        id: build-jaic
        run: cargo build --locked -p jaic-cli
      # Runners have no display or GPU, so programs that open windows are built but not run
      # (--headless). Unoptimized code keeps every value in memory, so ASan sees each access;
      # -O2 is where LLVM acts on undefined behaviour and the bounds checks see the most objects.
      - name: Corpus, stdlib and module tests under ASan and UBSan (-O0)
        run: python3 tools/differential/jaic_sweep.py --jaic target/debug/jaic --jobs 4 --timeout 300 --opt O0 --headless --sanitize address,undefined --shard ${{ matrix.shard }} corpus modules regressions negative
      - name: Corpus, stdlib and module tests under ASan and UBSan (-O2)
        # Full tier only (tools/ci/ci_changes.py).
        if: ${{ always() && !cancelled() && steps.build-jaic.outcome == 'success' && needs.changes.outputs.full == 'true' }}
        run: python3 tools/differential/jaic_sweep.py --jaic target/debug/jaic --jobs 4 --timeout 300 --opt O2 --headless --sanitize address,undefined --shard ${{ matrix.shard }} corpus modules regressions
  sdl3:
    # SDL3 built from the pinned source on every platform, its installed SDK audited and the
    # generated bindings checked (docs/extensions/sdl3.md).
    name: SDL3 native artifacts (${{ matrix.platform }})
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'sdl3')
    strategy:
      fail-fast: false
      matrix:
        # macOS only on nightly and manual runs
        include: ${{ fromJSON(needs.changes.outputs.full == 'true' && '[{"platform":"macos-arm64","runner":"macos-15"},{"platform":"macos-x64","runner":"macos-15-intel"},{"platform":"linux-x64","runner":"ubuntu-24.04"},{"platform":"linux-arm64","runner":"ubuntu-24.04-arm"},{"platform":"windows-x64","runner":"windows-2025"},{"platform":"windows-arm64","runner":"windows-11-arm"}]' || '[{"platform":"linux-x64","runner":"ubuntu-24.04"},{"platform":"linux-arm64","runner":"ubuntu-24.04-arm"},{"platform":"windows-x64","runner":"windows-2025"},{"platform":"windows-arm64","runner":"windows-11-arm"}]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: ./.github/actions/apt-cache
        if: runner.os == 'Linux'
        with:
          label: sdl3
      - name: Install the Linux backend SDKs
        if: runner.os == 'Linux'
        run: |
          bash tools/ci/install_ci_native_linux.sh
          sudo apt-get autoclean -qq
          sudo rm -rf "$JAI_APT_ARCHIVES/partial"
          sudo chown -R "$(id -u):$(id -g)" "$JAI_APT_ARCHIVES"
      - name: Prepare hash-pinned SDL Python test inputs
        run: python3 tools/bindings/prepare_sdl_python_tests.py --scratch "$RUNNER_TEMP/sdl-python" --cache "$RUNNER_TEMP/sdl-python-cache" >> "$GITHUB_ENV"
      - name: Generator and build tests
        run: python3 tools/run_tests.py -p 'test_sdl*.py'
      - name: Show the Windows MSVC toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake --version
          python tools/bindings/sdl3_native.py --platform "${{ matrix.platform }}" --show-toolchain
      - name: Build SDL3 and run C/C++ static and shared consumers against the installed SDK
        run: python3 tools/native/build_native_libs.py SDL3 --platform "${{ matrix.platform }}"
      - name: Offline rebuild from the source cache
        run: python3 tools/bindings/sdl3_native.py --platform "${{ matrix.platform }}" --offline
      - name: Audit version, runtime symbols, licenses and the installed SDK
        run: python3 tools/bindings/run_sdl3.py --audit-only --platform "${{ matrix.platform }}" --native "target/native-libs/${{ matrix.platform }}"
      - uses: ./.github/actions/setup-unix
        if: matrix.platform == 'linux-x64'
        with:
          native-libs: 'false'
      - name: Generated bindings are current
        if: matrix.platform == 'linux-x64'
        run: |
          cargo build --locked -p jaic-cli
          JAIC_STDLIB="$PWD/stdlib" target/debug/jaic jaifmt/main.jai -O2 -exe "$PWD/target/jaifmt"
          python3 tools/bindings/sdl3_gen.py --source target/sdl3/SDL3-3.4.18 --jaifmt "$PWD/target/jaifmt" --check
  clipboard-linux:
    # The Linux clipboard against real X11 clients on Xvfb, and the relocated package.
    name: Linux clipboard (X11)
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'clipboard-linux')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/clipboard-linux
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-unix
        with:
          native-libs: 'false'
      - name: Install the X11 build and display dependencies
        run: |
          bash tools/ci/apt_install.sh libx11-dev xvfb xauth clang-format
          python3 -m pip install ruff==0.14.14
          cargo fetch --locked
      - name: X11 clients, the Jai runtime and the relocated package
        run: |
          mkdir -p "$CARGO_TARGET_DIR"
          xvfb-run -a python3 tools/portable/check_portable_clipboard.py --linux-runtime | tee "$CARGO_TARGET_DIR/runtime.log"
          xvfb-run -a python3 tools/portable/check_clipboard_linux_package.py --verification-receipt "$(tail -n 1 "$CARGO_TARGET_DIR/runtime.log")" --output "$CARGO_TARGET_DIR/package"
  nix:
    # Evaluates the flake, builds jaic and jaifmt through Nix (their install checks build and run
    # programs natively) and runs the packaged compiler; see docs/tools/releases.md.
    name: flake (${{ matrix.runner }})
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'nix')
    strategy:
      fail-fast: false
      matrix:
        # macOS only on nightly and manual runs
        runner: ${{ fromJSON(needs.changes.outputs.full == 'true' && '["ubuntu-24.04","macos-15"]' || '["ubuntu-24.04"]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Check the lock file is current
        run: nix flake lock --no-update-lock-file
      - name: Check the flake
        run: nix flake check --print-build-logs
      - name: Build
        run: nix build --print-build-logs .#jaic .#jaifmt
      - name: Run the packaged compiler outside the checkout
        run: bash tools/ci/nix_smoke.sh
  # Package channels against the latest published release: install.sh, install.ps1 and the
  # Homebrew formula rendered by tools/dev/render_packages.py, each installed for real and run. Nothing
  # is published from here (release.yml publishes); see docs/tools/releases.md.
  shellcheck:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'shellcheck')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint every shell script
        # *.sh and files with a sh/bash shebang, as the pre-commit hook picks them.
        run: |
          shellcheck --version
          sh tools/dev/staged-files.sh shell-all | xargs shellcheck
  install-sh:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'install-sh')
    name: install.sh (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        # macOS only on nightly and manual runs
        runner: ${{ fromJSON(needs.changes.outputs.full == 'true' && '["ubuntu-24.04","ubuntu-24.04-arm","macos-15","macos-15-intel"]' || '["ubuntu-24.04","ubuntu-24.04-arm"]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No release yet (a new repository, or before the first tag): the steps that install a
      # published release are skipped with a notice. Any other failure of `gh` still fails the job.
      - name: Is there a published release?
        id: released
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci/published_release.py
      # A release may lack this platform's archive: then install.sh must pick the platform and
      # say the release has no build for it.
      - name: Does the latest release have this platform's archive?
        id: release
        if: steps.released.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/ci/install_sh_release_archive.sh
      # Stub toolchains in release-shaped archives, served through JAI_BASE_URL=file://...:
      # install, upgrade, a bad checksum and an occupied command, whether or not a release exists.
      - name: Install from locally built archives
        run: python3 -m unittest discover -s tools/ci -p test_install_sh.py -v
      - name: Without one, install.sh names the missing archive
        if: steps.release.outputs.has == 'false'
        run: |
          if ./install.sh 2> err.txt; then exit 1; fi
          cat err.txt
          grep -Eq "has no jacket-$PLATFORM\.tar\.gz" err.txt
      - name: Install an older release, then upgrade to the latest through a pipe
        if: steps.release.outputs.has == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/ci/install_sh_upgrade.sh
      - name: Run the installed toolchain outside the checkout
        if: steps.release.outputs.has == 'true'
        run: |
          cd "$RUNNER_TEMP"
          printf '#import "Basic";\n\nmain :: () {\n    print("hello from install.sh\\n");\n}\n' > hello.jai
          test "$(jaic hello.jai -interp)" = "hello from install.sh"
          jailint hello.jai
          test "$(echo 'main::(){x:=1;}' | jaifmt --stdin)" = "$(printf 'main :: () {\n    x := 1;\n}')"
          command -v jailsp
      - name: Custom directories, and a re-run of the same version
        if: steps.release.outputs.has == 'true'
        run: |
          export JAI_INSTALL_DIR="$RUNNER_TEMP/custom/share" JAI_BIN_DIR="$RUNNER_TEMP/custom/bin"
          ./install.sh
          ./install.sh
          test "$(find "$JAI_INSTALL_DIR" -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')" = 1
          cd "$RUNNER_TEMP" && "$JAI_BIN_DIR/jaic" hello.jai -interp
      - name: Bad versions and occupied commands fail with a message
        run: |
          if JAI_VERSION=0.0.0-missing JAI_INSTALL_DIR="$RUNNER_TEMP/x" JAI_BIN_DIR="$RUNNER_TEMP/xb" ./install.sh 2> err.txt; then exit 1; fi
          cat err.txt && grep -q "could not download" err.txt
          # (Without an archive for this platform, install.sh stops before looking at the links.)
          if [ "${{ steps.release.outputs.has }}" != true ]; then exit 0; fi
          mkdir -p "$RUNNER_TEMP/occupied" && touch "$RUNNER_TEMP/occupied/jaic"
          if JAI_BIN_DIR="$RUNNER_TEMP/occupied" ./install.sh 2> err.txt; then exit 1; fi
          cat err.txt && grep -q "is not a symlink" err.txt
  install-ps1:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'install-ps1')
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No release yet (a new repository, or before the first tag): the steps that install a
      # published release are skipped with a notice. Any other failure of `gh` still fails the job.
      - name: Is there a published release?
        id: released
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/ci/published_release.py
      # A stub toolchain in a release-shaped zip, served through JAI_BASE_URL=file:///...: runs
      # whether or not a release exists.
      - name: Install from a locally built archive
        shell: powershell
        run: .\tools\ci\test_install_ps1.ps1
      # The same checks under PowerShell 7, which install.ps1 also supports.
      - name: Install from a locally built archive (PowerShell 7)
        shell: pwsh
        run: .\tools\ci\test_install_ps1.ps1
      # Windows PowerShell 5.1, the way `irm ... | iex` runs it on a stock machine.
      - name: Install the latest release twice (the second run is an upgrade in place)
        if: steps.released.outputs.published == 'true'
        shell: powershell
        run: |
          Get-Content -Raw install.ps1 | Invoke-Expression
          Get-Content -Raw install.ps1 | Invoke-Expression
          $current = Join-Path $env:LOCALAPPDATA 'Programs\jai\current'
          if (-not (Test-Path (Join-Path $current 'stdlib\prelude\module.jai'))) { throw 'no stdlib next to jaic.exe' }
          if (([Environment]::GetEnvironmentVariable('Path', 'User') -split ';') -notcontains $current) { throw 'user PATH lacks the install' }
          @(Get-ChildItem -Directory (Join-Path $env:LOCALAPPDATA 'Programs\jai')).Count
          $current | Out-File -Encoding ascii -Append $env:GITHUB_PATH
      - name: Run the installed toolchain outside the checkout
        if: steps.released.outputs.published == 'true'
        shell: pwsh
        run: |
          Set-Location $env:RUNNER_TEMP
          "#import `"Basic`";`n`nmain :: () {`n    print(`"hello from install.ps1\n`");`n}`n" | Set-Content -NoNewline hello.jai
          $out = jaic hello.jai -interp
          if ($LASTEXITCODE -ne 0 -or $out -ne 'hello from install.ps1') { throw "jaic -interp printed '$out'" }
          jailint hello.jai
          if ($LASTEXITCODE -ne 0) { throw 'jailint failed' }
          (Get-Command jaifmt, jailsp).Source
  homebrew:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'homebrew')
    name: homebrew (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        # macOS only on nightly and manual runs
        runner: ${{ fromJSON(needs.changes.outputs.full == 'true' && '["macos-15","ubuntu-24.04"]' || '["ubuntu-24.04"]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      HOMEBREW_NO_ENV_HINTS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      # No release yet (a new repository, or before the first tag): the steps that install a
      # published release are skipped with a notice. Any other failure of `gh` still fails the job.
      - name: Is there a published release?
        id: released
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci/published_release.py --formula
      - name: Render the formula for the latest release
        if: steps.released.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" -p SHA256SUMS -D "$RUNNER_TEMP"
          python3 tools/dev/render_packages.py --version "$tag" --sums "$RUNNER_TEMP/SHA256SUMS" --out "$RUNNER_TEMP/packages"
          cat "$RUNNER_TEMP/packages/homebrew/jacket.rb"
      # Every platform's url and sha256 from synthetic checksums.
      - name: Render and audit a formula for all four platforms
        run: |
          sums="$RUNNER_TEMP/all-platforms.SHA256SUMS"
          for asset in macos-arm64.tar.gz macos-x64.tar.gz linux-x64.tar.gz linux-arm64.tar.gz; do
            echo "$(printf '%s' "$asset" | shasum -a 256 | cut -d ' ' -f 1)  jacket-$asset"
          done > "$sums"
          python3 tools/dev/render_packages.py --version 99.0.0 --sums "$sums" --out "$RUNNER_TEMP/all-platforms"
          formula="$RUNNER_TEMP/all-platforms/homebrew/jacket.rb"
          cat "$formula"
          grep -q 'jacket-macos-x64.tar.gz' "$formula" && grep -q 'jacket-linux-arm64.tar.gz' "$formula"
          if grep -q 'depends_on arch: :' "$formula"; then echo "the formula still restricts the architecture"; exit 1; fi
          bash tools/ci/check_formula.sh "$formula" jaiall/local audit
      - name: Install the formula from a local tap and run its test
        if: steps.released.outputs.installable == 'true'
        run: bash tools/ci/check_formula.sh "$RUNNER_TEMP/packages/homebrew/jacket.rb" jaitest/local install
  # Native Windows executables from `jaic` for x64 and arm64: built on Windows with the MSVC
  # toolchain, and cross-built from Linux with MinGW-w64 (llvm-mingw for arm64) then run on
  # Windows (docs/native/windows.md). Runs on manual runs, on the Windows work branches, and on
  # main when a path its coverage is about changes (tools/ci/ci_changes.py).
  windows-cross:
    name: cross-build ${{ matrix.cpu }} ${{ matrix.shard }}/3 (Linux, ${{ matrix.mingw }})
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'windows-cross')
    strategy:
      fail-fast: false
      matrix:
        # From tools/ci/ci_changes.py (windows_cross_matrix): a third of the programs each, arm64
        # only in the full tier. `windows-run-cross` runs the same legs.
        include: ${{ fromJSON(needs.changes.outputs.windows_cross_matrix) }}
    concurrency:
      group: ${{ github.workflow }}-windows-cross-${{ github.ref }}-${{ matrix.cpu }}-${{ matrix.shard }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_TARGET_DIR: target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-unix
        with:
          font: 'false'
      - name: Install MinGW-w64
        if: matrix.cpu == 'x64'
        run: |
          bash tools/ci/apt_install.sh gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64
          x86_64-w64-mingw32-gcc --version
      - name: Install llvm-mingw
        if: matrix.cpu == 'arm64'
        run: |
          name="llvm-mingw-$LLVM_MINGW_VERSION-ucrt-ubuntu-22.04-x86_64"
          curl -fsSL -o llvm-mingw.tar.xz "https://github.com/mstorsjo/llvm-mingw/releases/download/$LLVM_MINGW_VERSION/$name.tar.xz"
          mkdir -p "$RUNNER_TEMP/llvm-mingw"
          tar -xJf llvm-mingw.tar.xz -C "$RUNNER_TEMP/llvm-mingw" --strip-components=1
          rm llvm-mingw.tar.xz
          echo "$RUNNER_TEMP/llvm-mingw/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/llvm-mingw/bin/aarch64-w64-mingw32-clang" --version
      - uses: ./.github/actions/native-libs-cache
        with:
          variant: mingw-${{ matrix.cpu }}
      - name: Build jaic
        run: cargo build --locked -p jaic-cli
      - name: Build the resource-only PE fixture
        run: python3 tools/native/build_windows_resource_fixture.py --cpu ${{ matrix.cpu }} --out cross-${{ matrix.cpu }}/resource-fixture --rc /usr/lib/llvm-23/bin/llvm-rc --linker /usr/lib/llvm-23/bin/lld-link --readobj /usr/lib/llvm-23/bin/llvm-readobj
      - name: Cross-build the Windows test programs
        # --stdlib first cross-builds the third-party C libraries (stb_*, FreeType, lz4, ...) with
        # MinGW-w64 or llvm-mingw as static archives (tools/native/build_native_libs.py).
        run: python3 tools/native/windows_cross.py build --stdlib --cpu ${{ matrix.cpu }} --shard ${{ matrix.shard }}/3 --jaic target/debug/jaic --out cross-${{ matrix.cpu }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cross-${{ matrix.cpu }}-${{ matrix.shard }}
          path: cross-${{ matrix.cpu }}
          if-no-files-found: error
  windows-run-cross:
    if: contains(fromJSON(needs.changes.outputs.jobs), 'windows-run-cross')
    name: run cross-built programs (Windows ${{ matrix.cpu }}, ${{ matrix.shard }}/3)
    needs: [changes, windows-cross]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.windows_cross_matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cross-${{ matrix.cpu }}-${{ matrix.shard }}
          path: cross-${{ matrix.cpu }}
      - name: Install Mesa's software OpenGL
        run: |
          bash tools/ci/install_ci_mesa_windows.sh ${{ matrix.cpu }} "$RUNNER_TEMP/mesa"
          cp "$RUNNER_TEMP"/mesa/*.dll cross-${{ matrix.cpu }}/
      - name: Run
        run: |
          JAIC_TEST_WINDOWS_RESOURCE_DIR="$(cygpath -m "$PWD/cross-${{ matrix.cpu }}/resource-fixture")"
          export JAIC_TEST_WINDOWS_RESOURCE_DIR
          python tools/native/windows_cross.py run --dir cross-${{ matrix.cpu }}
  windows-native:
    name: jaic on Windows ${{ matrix.cpu }} (MSVC, ${{ matrix.part }})
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'windows-native')
    strategy:
      fail-fast: false
      matrix:
        # From tools/ci/ci_changes.py (windows_native_matrix), arm64 only in the full tier.
        # `programs`: the C++ vtables, platform I/O, the test programs and the native backend
        # tests; `graphics`: everything that links the third-party libraries or draws (Mesa, WGL,
        # WebGPU, the data resource suite and File_Watcher).
        include: ${{ fromJSON(needs.changes.outputs.windows_native_matrix) }}
    concurrency:
      group: ${{ github.workflow }}-windows-native-${{ github.ref }}-${{ matrix.cpu }}-${{ matrix.part }}
      cancel-in-progress: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    env:
      JAIC: target/${{ matrix.triple }}/debug/jaic.exe
      JAILINT: target/${{ matrix.triple }}/debug/jailint.exe
      MESA_DIR: ${{ matrix.mesa_dir }}
      CPU: ${{ matrix.cpu }}
      VS_ARCH: ${{ matrix.vs_arch }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-windows
        with:
          cpu: ${{ matrix.cpu }}
          triple: ${{ matrix.triple }}
      - uses: ./.github/actions/native-libs-cache
      - name: Build jaic with the LLVM backend
        run: cargo build --locked -p jaic-cli -p jailint --no-default-features --features static-llvm
      # The provider comes first: it puts the crash runtime's DLL on PATH for every later step, so a failing
      # check below cannot leave the programs those steps build unable to load.
      - uses: ./.github/actions/windows-provider
        with:
          cpu: ${{ matrix.cpu }}
          triple: ${{ matrix.triple }}
      - name: Native C++ vtable generation and dispatch
        if: ${{ matrix.part == 'programs' }}
        run: |
          python tools/developer_checks/build_generator_platform.py
          python tools/developer_checks/check_developer_tools.py ManifestChecks.test_check_developer_vtables
      - name: Windows dynamic package tests
        if: ${{ matrix.part == 'programs' }}
        run: TMPDIR="$RUNNER_TEMP" PYTHONDONTWRITEBYTECODE=1 python3 tools/run_tests.py -p test_windows_dynamic_package.py -v
      - name: Platform I/O (interpreter and native O0/O2)
        if: ${{ !cancelled() && matrix.part == 'programs' }}
        run: python -u tools/stdlib/check_platform_io.py --jaic "$JAIC" --stdlib stdlib --native --windows-crash
      - name: Build the caller-owned Windows resource fixture
        run: |
          python tools/native/build_windows_resource_fixture.py --cpu "$CPU" --out "$RUNNER_TEMP/windows-resources"
          printf 'JAIC_TEST_WINDOWS_RESOURCE_DIR=%s\n' "$(cygpath -m "$RUNNER_TEMP/windows-resources")" >> "$GITHUB_ENV"
      - name: Build and run the Windows test programs natively
        if: ${{ matrix.part == 'programs' }}
        run: |
          mkdir -p native-exes
          "$JAIC" tests/corpus/positive/integer-control.jai -exe native-exes/smoke
          python -u tools/native/windows_cross.py build --jaic "$JAIC" --out native-exes --host --keep-going
          python -u tools/native/windows_cross.py run --dir native-exes
      - name: Interpreter variadic foreign calls
        if: ${{ !cancelled() && matrix.cpu == 'arm64' && matrix.part == 'programs' }}
        run: test "$("$JAIC" tests/compiler/native/windows/variadic.jai -interp | tr -d '\r')" = ok
      - name: Install Mesa's software OpenGL
        if: ${{ !cancelled() && matrix.part == 'graphics' }}
        # Beside jaic.exe too, for the interpreter runs below.
        run: |
          mkdir -p native-exes
          bash tools/ci/install_ci_mesa_windows.sh "$CPU" "$MESA_DIR"
          cp "$MESA_DIR"/*.dll "$(dirname "$JAIC")/"
      # The stdlib runtime tests run in `windows-stdlib`; the steps below link the third-party
      # libraries (FreeType, stb_*...) built here.
      - name: Build the native libraries
        if: ${{ !cancelled() && matrix.part == 'graphics' }}
        run: python -u tools/native/build_native_libs.py --platform windows-${{ matrix.cpu }} --missing
      - name: Data resource discovery and Icon effects
        if: ${{ !cancelled() && matrix.part == 'graphics' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          . tools/ci/enter_vs_dev_shell.ps1
          $env:JAIC_STDLIB = (Resolve-Path stdlib).Path
          & $env:JAIC jaifmt/main.jai -O2 -exe target/jaifmt.exe
          if ($LASTEXITCODE -ne 0) { throw 'jaifmt build failed' }
          python tools/portable/portable_data/build_windows_images.py --cpu $env:CPU
          if ($LASTEXITCODE -ne 0) { throw 'Native image SDK build failed' }
          python -u tools/portable/portable_data/run.py --compiler $env:JAIC --linter $env:JAILINT --formatter target/jaifmt.exe
          if ($LASTEXITCODE -ne 0) { throw 'Native data/resource suite failed' }
      - name: A Simp game's metaprogram build without Clang on PATH
        # tests/compiler/native/simp-game: first.jai builds src/main.jai (Simp, GL, Input, stb_image) in a
        # workspace and runs build/game.exe. Without LLVM on PATH, and with Git's coreutils
        # `link` in /usr/bin, jaic must skip that `link` and use Visual Studio's link.exe with
        # the LIB it works out. The stb libraries come from the native libraries step.
        if: ${{ !cancelled() && matrix.cpu == 'x64' && matrix.part == 'graphics' }}
        run: bash tools/ci/simp_game_without_clang.sh
      - name: D3DCompiler provider and interpreter identity
        if: ${{ !cancelled() && matrix.part == 'graphics' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python3 tools/run_tests.py -p 'test_windows_d3dcompiler*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'D3DCompiler diagnostic tests failed' }
          . tools/ci/enter_vs_dev_shell.ps1
          $importLibrary = $env:LIB.Split(';') | ForEach-Object { Join-Path $_ 'd3dcompiler.lib' } | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if (-not $importLibrary) { throw 'Selected SDK LIB search has no d3dcompiler.lib' }
          python -u tools/native/check_windows_d3dcompiler_provider.py --jaic $env:JAIC --stdlib stdlib --import-library "$importLibrary" --report "target/d3dcompiler-$env:CPU/provider.json"
          if ($LASTEXITCODE -ne 0) { throw 'D3DCompiler provider interpreter/native check failed' }
      - name: WebGPU without a window (wgpu-native on D3D12's WARP adapter)
        # stdlib/Extensions/WebGPU/tests/headless.jai interpreted and built; docs/extensions/webgpu.md#tests.
        if: ${{ !cancelled() && matrix.part == 'graphics' }}
        run: python -u tools/bindings/run_webgpu_native.py --jaic "$JAIC" --platform windows-${{ matrix.cpu }} --require-adapter
      - name: WebGPU in a window (HWND surface on WARP, presented)
        # stdlib/Extensions/WebGPU/tests/window.jai: a Window_Creation window in the runner's interactive desktop
        # session, a DXGI swap chain through wgpu-native's D3D12 backend, frames read back.
        if: ${{ !cancelled() && matrix.part == 'graphics' }}
        run: python -u tools/bindings/run_webgpu_native.py --jaic "$JAIC" --platform windows-${{ matrix.cpu }} --require-adapter --test window --frames 120
      - name: Native WGL driver diagnostics and public rendering
        if: ${{ !cancelled() && matrix.part == 'graphics' }}
        run: |
          mkdir -p target/native-libs/windows-${{ matrix.cpu }}
          python -u tools/window_render/window_render_wgl_ci.py --jaic "$JAIC" --jailint "$JAILINT" --stdlib stdlib --native-libs target/native-libs/windows-${{ matrix.cpu }} --driver-dir "$MESA_DIR" --consumer-dir native-exes
      - name: Signed mouse wheel events reach the program (interpreter, O0, O2)
        if: ${{ !cancelled() && matrix.part == 'graphics' }}
        run: |
          "$JAIC" stdlib/Input/tests/signed-wheel-windows.jai -interp
          "$JAIC" stdlib/Input/tests/signed-wheel-windows.jai -exe native-exes/signed-wheel
          native-exes/signed-wheel.exe
          "$JAIC" stdlib/Windows/tests/render-events.jai -interp
          for opt in O0 O2; do
            "$JAIC" stdlib/Windows/tests/render-events.jai -$opt -exe native-exes/render-wheel-$opt
            native-exes/render-wheel-$opt.exe
          done
      - name: Native backend tests
        if: ${{ !cancelled() && matrix.part == 'programs' }}
        run: cargo test --locked -p jaic-cli --no-default-features --features static-llvm --test native -- --test-threads 2
      - name: Native File_Watcher and Windows time-zone SDK ABI fixtures
        if: ${{ !cancelled() && matrix.part == 'graphics' }}
        shell: pwsh
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          $ErrorActionPreference = 'Stop'
          . tools/ci/enter_vs_dev_shell.ps1
          python -u tools/stdlib/check_file_watcher_platforms.py --compiler $env:JAIC --linter $env:JAILINT --formatter target/jaifmt.exe --native-runtime
          $watcherExit = $LASTEXITCODE
          python -u tools/native/check_windows_time_zone.py --compiler $env:JAIC --linter $env:JAILINT --formatter target/jaifmt.exe --sdk-runtime
          $abiExit = $LASTEXITCODE
          if ($watcherExit -ne 0 -or $abiExit -ne 0) { throw 'Native File_Watcher or SDK time-zone ABI suite failed' }
  windows-stdlib:
    # The stdlib runtime tests of `stdlib-runtime` on Windows (interpreter, native and native -O2),
    # in two shards like there.
    name: stdlib runtime tests (windows-${{ matrix.cpu }}, ${{ matrix.shard }})
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'windows-stdlib')
    strategy:
      fail-fast: false
      matrix:
        # From tools/ci/ci_changes.py (windows_stdlib_matrix): more shards and no -O2 rerun in the
        # fast tier.
        include: ${{ fromJSON(needs.changes.outputs.windows_stdlib_matrix) }}
    concurrency:
      group: ${{ github.workflow }}-windows-stdlib-${{ github.ref }}-${{ matrix.cpu }}-${{ matrix.shard }}
      cancel-in-progress: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    env:
      JAIC: target/${{ matrix.triple }}/debug/jaic.exe
      MESA_DIR: target/mesa-driver
      JAIC_TEST_FONT_PATH: C:\Windows\Fonts\arial.ttf
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-windows
        with:
          cpu: ${{ matrix.cpu }}
          triple: ${{ matrix.triple }}
      - uses: ./.github/actions/native-libs-cache
      - name: Build jaic with the LLVM backend
        run: |
          cargo build --locked -p jaic-cli --no-default-features --features static-llvm
          cargo build --locked -p jacket
      - uses: ./.github/actions/windows-provider
        with:
          cpu: ${{ matrix.cpu }}
          triple: ${{ matrix.triple }}
      - name: Build the caller-owned Windows resource fixture
        run: |
          python tools/native/build_windows_resource_fixture.py --cpu ${{ matrix.cpu }} --out "$RUNNER_TEMP/windows-resources"
          printf 'JAIC_TEST_WINDOWS_RESOURCE_DIR=%s\n' "$(cygpath -m "$RUNNER_TEMP/windows-resources")" >> "$GITHUB_ENV"
      - name: Install Mesa's software OpenGL
        run: |
          bash tools/ci/install_ci_mesa_windows.sh ${{ matrix.cpu }} "$MESA_DIR"
          cp "$MESA_DIR"/*.dll "$(dirname "$JAIC")/"
      - name: Stdlib runtime tests (interpreter and native)
        # The third-party libraries (FreeType, stb_*...) are built first (tools/native/build_native_libs.py).
        run: python -u tools/stdlib/stdlib_runtime.py --jaic "$JAIC" --platform windows-${{ matrix.cpu }} --shard ${{ matrix.shard }} --modes interp,native --strict --timeout 600 --coverage target/stdlib-coverage.txt --dlls "$MESA_DIR"
      - name: Stdlib tests, native O2
        if: ${{ !cancelled() && matrix.o2 }}
        run: python -u tools/stdlib/stdlib_runtime.py --jaic "$JAIC" --platform windows-${{ matrix.cpu }} --shard ${{ matrix.shard }} --modes native --opt O2 --strict --dlls "$MESA_DIR"
      - name: Stdlib tests run by jacket test
        # The modules under `[test] paths` in jacket.toml, as in `stdlib-runtime`, without wasm;
        # each shard runs its share of the tests.
        if: ${{ !cancelled() }}
        run: |
          jacket="$(dirname "$JAIC")/jacket.exe"
          status=0
          "$jacket" test -q --partition "hash:${{ matrix.shard }}" || status=1
          "$jacket" test -q --partition "hash:${{ matrix.shard }}" --interp || status=1
          "$jacket" test -q --partition "hash:${{ matrix.shard }}" -- -O2 || status=1
          exit $status
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() && !cancelled() }}
        with:
          name: stdlib-coverage-windows-${{ matrix.cpu }}-${{ strategy.job-index }}
          path: target/stdlib-coverage.txt
          retention-days: 3
          if-no-files-found: ignore
  windows-smoke:
    # The third-party projects of `upstream-smoke`, built and run on Windows with the interactive
    # desktop and Mesa's software OpenGL (docs/tools/upstream-corpus.md).
    name: third-party projects (Windows x64)
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'windows-smoke')
    concurrency:
      group: ${{ github.workflow }}-windows-smoke-${{ github.ref }}
      cancel-in-progress: true
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-windows
        with:
          cpu: x64
          triple: x86_64-pc-windows-msvc
      - uses: ./.github/actions/native-libs-cache
      - name: Build jaic with the LLVM backend
        run: cargo build --release --locked -p jaic-cli --no-default-features --features static-llvm
      - uses: ./.github/actions/windows-provider
        with:
          cpu: x64
          triple: x86_64-pc-windows-msvc
      - name: Install Mesa's software OpenGL
        run: bash tools/ci/install_ci_mesa_windows.sh x64 "$RUNNER_TEMP/mesa"
      - name: Prepare Bindings_Generator runtime
        run: python tools/ci/package_bindings_helpers.py --platform windows-x64 --llvm-prefix "$LLVM_SYS_231_PREFIX" --out target/native-libs/windows-x64
      - name: Cache the upstream mirrors
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/cache/upstream
          key: upstream-mirrors-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('corpus/upstreams.json', 'tools/upstream-cases.json') }}
          restore-keys: upstream-mirrors-${{ runner.os }}-${{ runner.arch }}-
      - name: Restore the upstream mirrors
        if: ${{ github.ref != 'refs/heads/main' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/cache/upstream
          key: upstream-mirrors-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('corpus/upstreams.json', 'tools/upstream-cases.json') }}
          restore-keys: upstream-mirrors-${{ runner.os }}-${{ runner.arch }}-
      - name: Fetch the pinned projects
        run: |
          project_list="$(python tools/corpus/upstream_smoke.py --jaic x --projects)"
          read -r -a project_names <<< "$project_list"
          python tools/fetch_upstreams.py --only "${project_names[@]}"
      - name: Build and run the projects
        run: python -u tools/corpus/upstream_smoke.py --jaic target/x86_64-pc-windows-msvc/release/jaic.exe --platform windows-x64 --dlls "$RUNNER_TEMP/mesa"
      - name: Check the x64-only projects
        # Cases restricted to windows-x64 in tools/upstream-cases.json, selected by
        # tools/corpus/select_upstream_cases.py.
        run: |
          read -ra repos <<< "$(python tools/corpus/select_upstream_cases.py --platform windows-x64 --repos)"
          python tools/fetch_upstreams.py --only "${repos[@]}"
          python -u tools/differential/jaic_sweep.py --jaic target/x86_64-pc-windows-msvc/release/jaic.exe --timeout 600 -v upstream --only-platform windows-x64
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() && !cancelled() }}
        with:
          name: smoke-screenshots-windows-x64
          path: target/smoke-screenshots
          if-no-files-found: ignore
