      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      # No release yet (a new repository, or before the first tag): the steps that install a
      # published release are skipped with a notice. Any other failure of `gh` still fails the job.
      - name: Is there a published release?
        id: released
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName 2> "$RUNNER_TEMP/gh-err.txt")"; then
            echo "Latest release: $tag"
            echo "published=true" >> "$GITHUB_OUTPUT"
          elif grep -qi 'release not found' "$RUNNER_TEMP/gh-err.txt"; then
            msg="$GITHUB_REPOSITORY has no published release yet, so the steps that install a published release are skipped; the locally built archive steps still run."
            echo "::notice title=No published release::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            cat "$RUNNER_TEMP/gh-err.txt"
            exit 1
          fi
      - name: Render the formula for the latest release
        if: steps.released.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
