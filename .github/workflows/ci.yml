name: compiler checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    name: compiler (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install nightly-2026-08-29 --profile minimal --component rustfmt --component clippy
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Validate dependency ages before building
        run: python3 tools/check_dependency_age.py
      - name: Install LLVM 22 (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm@22
          echo "LLVM_SYS_221_PREFIX=$(brew --prefix llvm@22)" >> "$GITHUB_ENV"
          echo "$(brew --prefix llvm@22)/bin" >> "$GITHUB_PATH"
      - name: Install LLVM 22 (Linux)
        if: runner.os == 'Linux'
        run: |
          bash tools/install_ci_llvm_linux.sh
          echo "LLVM_SYS_221_PREFIX=/usr/lib/llvm-22" >> "$GITHUB_ENV"
          echo "/usr/lib/llvm-22/bin" >> "$GITHUB_PATH"
      - name: Verify native host and LLVM
        run: |
          uname -sm
          llvm-config --version
          clang --version
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Rust and native execution tests
        # These two tests require the separately supplied distribution. The
        # local reference checks run them with the supplied inputs.
        run: |
          ulimit -c 0
          cargo test --workspace --locked -- --skip lex_entire_reference_without_executing_it --skip supplied_executable_is_rejected_before_backend_execution
      - name: Policy tests
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Benchmark smoke checks (no timing gate on shared runners)
        run: cargo bench -p jai-bench --bench compiler --locked -- --test --skip reference_lex
