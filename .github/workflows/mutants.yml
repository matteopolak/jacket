name: mutants
# Weekly and by hand: cargo-mutants on the type checker's calls, conversions and interval
# analysis, the interpreter's arithmetic and the parser. A surviving mutant is code a test
# does not constrain; the shard artifacts list them (docs/tools/mutation-testing.md). Informational.
on:
  schedule:
    - cron: '17 3 * * 6'
  workflow_dispatch:
    inputs:
      scope:
        description: Space-separated --file globs to mutate instead of the default scope
        type: string
        default: ''
      full_suite:
        description: Run every jaic test against each mutant (about a minute each) instead of the fast subset
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  # Each manual dispatch gets its own group, so a second one does not cancel the first; the weekly run
  # shares the ref's group and replaces a stale one of itself.
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true
env:
  # tools/ holds the folders the Python scripts import from (`from toolkit.repo import ROOT`).
  PYTHONPATH: ${{ github.workspace }}/tools
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always
jobs:
  mutants:
    name: shard ${{ matrix.shard }}/8
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: ./.github/actions/setup-unix
        with:
          native-libs: 'false'
          font: 'false'
      - name: Install cargo-mutants
        run: python3 tools/ci/install_pinned.py cargo-mutants
      - name: Mutate
        env:
          SCOPE: ${{ inputs.scope }}
          FULL_SUITE: ${{ inputs.full_suite }}
        run: |
          if [ -z "$SCOPE" ]; then
            SCOPE='crates/jaic/src/sema/calls/**/*.rs crates/jaic/src/sema/convert/**/*.rs crates/jaic/src/sema/convert.rs crates/jaic/src/ide/interval.rs crates/jaic/src/types.rs crates/jaic/src/interp/arith.rs crates/jaic-syntax/src/parser/**/*.rs'
          fi
          files=()
          # shellcheck disable=SC2086
          for glob in $SCOPE; do files+=(--file "$glob"); done
          # The fast subset: the unit tests plus the integration binaries that check programs in-process
          # (no linking of a native executable). docs/tools/mutation-testing.md says how to pick them.
          tests=(--lib)
          for name in cast_shifts cast_semantics literals call_diagnostics default_type nominal_comparisons operator_filters struct_arguments variadics poly_inference_errors void_ifx typed_nodes pointer_subscript raw_pointers never_returns; do tests+=(--test "$name"); done
          [ "$FULL_SUITE" != true ] || tests=()
          # Surviving mutants are the output, not a failure: exit codes 2 (missed) and 3 (timeouts) pass.
          cargo mutants -p jaic -p jaic-syntax --shard "${{ matrix.shard }}/8" "${files[@]}" --output mutants-out --jobs 1 -- "${tests[@]}" && status=0 || status=$?
          [ "$status" -eq 0 ] || [ "$status" -eq 2 ] || [ "$status" -eq 3 ]
      - name: Surviving mutants
        if: ${{ always() }}
        run: |
          { echo "## Shard ${{ matrix.shard }}: surviving mutants"; echo '```'; cat mutants-out/mutants.out/missed.txt 2>/dev/null || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: mutants-${{ matrix.shard }}
          path: mutants-out/mutants.out
          retention-days: 30
