name: Cache the Ubuntu packages
description: Keeps the packages tools/ci/install_ci_*_linux.sh download between runs and points apt at them (JAI_APT_ARCHIVES, read by tools/ci/apt_lib.sh).
inputs:
  label:
    description: Names the package set; one cache per label
    required: true
runs:
  using: composite
  steps:
    # The runners' mirror sometimes slows to a crawl for minutes. Weekly keys, so the set follows
    # package updates; main saves, other refs only restore. A job that installs with these
    # archives runs `sudo chown -R "$(id -u):$(id -g)" "$JAI_APT_ARCHIVES"` afterwards, so the
    # cache step can read what apt (as root) wrote.
    - id: apt-key
      if: runner.os == 'Linux'
      shell: bash
      env:
        LABEL: ${{ inputs.label }}
      run: |
        echo "JAI_APT_ARCHIVES=$RUNNER_TEMP/jai-apt-archives" >> "$GITHUB_ENV"
        # A label may list packages: one cache per set, so a new package is saved in a key of its own.
        # A set with no cache yet starts from its label's first word (the base set), so only the
        # extra packages come from the mirror.
        scripts=${{ hashFiles('tools/ci/install_ci_llvm_linux.sh', 'tools/ci/install_ci_native_linux.sh') }}
        read -r base _ <<< "$LABEL"
        LABEL=$(echo "$LABEL" | xargs | tr ' ' '-')
        prefix="apt-debs-$RUNNER_ARCH-$LABEL-$scripts-"
        echo "key=$prefix$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
        {
          echo "restore-keys<<EOF"
          echo "$prefix"
          [[ "$base" == "$LABEL" ]] || echo "apt-debs-$RUNNER_ARCH-$base-$scripts-"
          echo EOF
        } >> "$GITHUB_OUTPUT"
    - if: runner.os == 'Linux' && github.ref == 'refs/heads/main'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.JAI_APT_ARCHIVES }}
        key: ${{ steps.apt-key.outputs.key }}
        restore-keys: ${{ steps.apt-key.outputs.restore-keys }}
    - if: runner.os == 'Linux' && github.ref != 'refs/heads/main'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.JAI_APT_ARCHIVES }}
        key: ${{ steps.apt-key.outputs.key }}
        restore-keys: ${{ steps.apt-key.outputs.restore-keys }}
