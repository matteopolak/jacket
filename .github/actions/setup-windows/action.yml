name: Set up Windows
description: Pinned Rust toolchain, Node, and the official LLVM release with the static CRT.
inputs:
  cpu:
    description: x64 or arm64
    required: true
  triple:
    description: Rust target triple
    required: true
runs:
  using: composite
  steps:
    - name: Install the pinned Rust toolchain
      shell: bash
      env:
        TRIPLE: ${{ inputs.triple }}
      run: |
        if ! command -v rustup > /dev/null; then
          curl -fsSL -o "$RUNNER_TEMP/rustup-init.exe" "https://static.rust-lang.org/rustup/dist/$TRIPLE/rustup-init.exe"
          "$RUNNER_TEMP/rustup-init.exe" -y --default-toolchain none --profile minimal
          printf '%s\n' "$USERPROFILE\\.cargo\\bin" >> "$GITHUB_PATH"
          export PATH="$PATH:$(cygpath -u "$USERPROFILE")/.cargo/bin"
        fi
        rustup toolchain install nightly-2026-08-29 --profile minimal
        # The official LLVM release is built against the static C runtime (/MT); mixing it with
        # Rust's default dynamic CRT crashes at run time. A target-specific flag keeps it off
        # build scripts and proc macros.
        flags="CARGO_TARGET_$(echo "$TRIPLE" | tr 'a-z-' 'A-Z_')_RUSTFLAGS"
        echo "$flags=-C target-feature=+crt-static" >> "$GITHUB_ENV"
        echo "CARGO_BUILD_TARGET=$TRIPLE" >> "$GITHUB_ENV"
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24'
    # The same key and path as release.yml's download, so either workflow's copy serves both.
    - id: llvm
      shell: bash
      env:
        CPU: ${{ inputs.cpu }}
      run: |
        arch=x86_64; [ "$CPU" = arm64 ] && arch=aarch64
        echo "archive=clang+llvm-$LLVM_VERSION-$arch-pc-windows-msvc.tar.xz" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/llvm-download
        key: llvm-${{ steps.llvm.outputs.archive }}
    - name: Install the official LLVM release
      shell: bash
      env:
        ARCHIVE: ${{ steps.llvm.outputs.archive }}
      run: |
        download="$(cygpath -u "$RUNNER_TEMP")/llvm-download"
        if [ ! -f "$download/$ARCHIVE" ]; then
          mkdir -p "$download"
          curl -fsSL -o "$download/$ARCHIVE" "https://github.com/llvm/llvm-project/releases/download/llvmorg-$LLVM_VERSION/$ARCHIVE"
        fi
        # GNU tar reads `D:\...` as a remote host: extract to the POSIX spelling of the path.
        llvm="$(cygpath -u "$RUNNER_TEMP")/llvm"
        mkdir -p "$llvm"
        tar -xJf "$download/$ARCHIVE" -C "$llvm" --strip-components=1
        echo "LLVM_SYS_231_PREFIX=$(cygpath -m "$llvm")" >> "$GITHUB_ENV"
        cygpath -w "$llvm/bin" >> "$GITHUB_PATH"
        test -x "$llvm/bin/wasm-ld.exe"
        echo "JAIC_WASM_LD=$(cygpath -m "$llvm/bin/wasm-ld.exe")" >> "$GITHUB_ENV"
        # Supply the static libraries llvm-config names but the archive lacks (libxml2, zstd)
        # and the llvm-config front that llvm-sys needs (docs/tools/llvm-setup.md).
        bash tools/ci/windows-llvm/prepare.sh "$llvm"
    # The dependencies' build output, restored everywhere and saved from main.
    - uses: ./.github/actions/rust-cache
