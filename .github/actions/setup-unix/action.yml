name: Set up Linux or macOS
description: Pinned Rust toolchain, Python, LLVM 23 and the native libraries the CI jobs link.
inputs:
  lld:
    description: Install wasm-ld (macOS)
    default: 'false'
  brew:
    description: Extra Homebrew packages (macOS)
    default: ''
  native-libs:
    description: Install the Linux window, audio and display libraries (tools/ci/install_ci_native_linux.sh)
    default: 'true'
  alsa:
    description: Point ALSA at the headless test configuration (Linux)
    default: 'false'
  font:
    description: Export JAIC_TEST_FONT_PATH
    default: 'true'
runs:
  using: composite
  steps:
    - name: Install the pinned Rust toolchain
      shell: bash
      run: python3 tools/ci/install_pinned.py rust --component rustfmt --component clippy
    - name: Install cargo-nextest
      shell: bash
      run: python3 tools/ci/install_pinned.py nextest
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.14'
    - name: Install LLVM 23 (macOS)
      if: runner.os == 'macOS'
      shell: bash
      env:
        LLD: ${{ inputs.lld }}
        BREW: ${{ inputs.brew }}
        FONT: ${{ inputs.font }}
      run: |
        # --lld: wasm-ld, which `jaic -os wasm` links with (docs/native/wasm-target.md).
        tools/ci/install_ci_llvm_macos.sh $([ "$LLD" = true ] && echo --lld)
        brew install openssl@3 pkg-config
        for package in $BREW; do brew list "$package" > /dev/null 2>&1 || brew install "$package"; done
        if [ "$FONT" = true ]; then echo 'JAIC_TEST_FONT_PATH=/System/Library/Fonts/Supplemental/Arial.ttf' >> "$GITHUB_ENV"; fi
    # The Ubuntu packages the Linux install below downloads, kept between runs: the runners' mirror
    # sometimes slows to a crawl for minutes. Weekly keys, so the set follows package updates; main
    # saves, other refs only restore. tools/ci/apt_lib.sh points apt at JAI_APT_ARCHIVES.
    - id: apt-key
      if: runner.os == 'Linux'
      shell: bash
      env:
        NATIVE: ${{ inputs.native-libs }}
      run: |
        echo "JAI_APT_ARCHIVES=$RUNNER_TEMP/jai-apt-archives" >> "$GITHUB_ENV"
        prefix="apt-debs-$RUNNER_ARCH-native$NATIVE-${{ hashFiles('tools/ci/install_ci_llvm_linux.sh', 'tools/ci/install_ci_native_linux.sh') }}-"
        echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
        echo "key=$prefix$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
    - if: runner.os == 'Linux' && github.ref == 'refs/heads/main'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.JAI_APT_ARCHIVES }}
        key: ${{ steps.apt-key.outputs.key }}
        restore-keys: ${{ steps.apt-key.outputs.prefix }}
    - if: runner.os == 'Linux' && github.ref != 'refs/heads/main'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.JAI_APT_ARCHIVES }}
        key: ${{ steps.apt-key.outputs.key }}
        restore-keys: ${{ steps.apt-key.outputs.prefix }}
    - name: Install LLVM 23 (Linux)
      if: runner.os == 'Linux'
      shell: bash
      env:
        NATIVE: ${{ inputs.native-libs }}
        FONT: ${{ inputs.font }}
      run: |
        bash tools/ci/install_ci_llvm_linux.sh
        echo "LLVM_SYS_231_PREFIX=/usr/lib/llvm-23" >> "$GITHUB_ENV"
        echo "DEVELOPER_TOOLS_LLVM_PREFIX=/usr/lib/llvm-23" >> "$GITHUB_ENV"
        echo "/usr/lib/llvm-23/bin" >> "$GITHUB_PATH"
        # X11, GL (Mesa's software renderer), FreeType, Xvfb, ALSA and Mesa's lavapipe (the
        # Vulkan adapter of the WebGPU tests).
        if [ "$NATIVE" = true ]; then bash tools/ci/install_ci_native_linux.sh; fi
        if [ "$FONT" = true ]; then echo 'JAIC_TEST_FONT_PATH=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf' >> "$GITHUB_ENV"; fi
        # Drop superseded package versions, and let the cache step read what apt (as root) wrote.
        sudo apt-get autoclean -qq
        sudo rm -rf "$JAI_APT_ARCHIVES/partial"
        sudo chown -R "$(id -u):$(id -g)" "$JAI_APT_ARCHIVES"
    - name: Configure the headless ALSA provider
      if: runner.os == 'Linux' && inputs.alsa == 'true'
      shell: bash
      run: |
        test -r /usr/share/alsa/alsa.conf
        echo "ALSA_CONFIG_PATH=$GITHUB_WORKSPACE/stdlib/Sound_Player/tests/fixtures/alsa-null.conf" >> "$GITHUB_ENV"
        echo 'JAI_AUDIO_ALSA_DEVICE=jai_audio_test' >> "$GITHUB_ENV"
    # The dependencies' build output, restored everywhere and saved from main. Last, so that the
    # key sees the RUSTFLAGS the LLVM steps set.
    - uses: ./.github/actions/rust-cache
