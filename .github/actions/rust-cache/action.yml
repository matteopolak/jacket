name: Cache the Rust dependencies
description: >-
  Restores cargo's registry and the dependencies' build output (Swatinem/rust-cache), saved from
  main, without touching the rest of target/.
inputs:
  workspaces:
    description: rust-cache `workspaces` (a cargo workspace outside the repository root, e.g. `fuzz`)
    default: '.'
runs:
  using: composite
  steps:
    # rust-cache treats every directory under target/ as cargo's: it saves all of them trimmed to
    # their cargo parts, and on a partial key match it also trims them before restoring. The tools
    # keep their own state there (target/cache/upstream, target/sdl3...), which would come back
    # half-deleted, so move the job's non-cargo entries aside, restore, delete the non-cargo
    # entries the cache brought back and move the job's own back. Cargo's entries are the
    # profile directories, which hold .fingerprint directly or under a target triple.
    - shell: bash
      run: |
        shopt -s nullglob dotglob
        mkdir -p target "$RUNNER_TEMP/target-aside"
        for entry in target/*; do
          case "$entry" in target/CACHEDIR.TAG | target/.rustc_info.json) continue ;; esac
          nested=("$entry"/*/.fingerprint)
          [ -d "$entry/.fingerprint" ] || [ ${#nested[@]} -gt 0 ] || mv "$entry" "$RUNNER_TEMP/target-aside/"
        done
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        save-if: ${{ github.ref == 'refs/heads/main' }}
        workspaces: ${{ inputs.workspaces }}
    - shell: bash
      run: |
        shopt -s nullglob dotglob
        for entry in target/*; do
          case "$entry" in target/CACHEDIR.TAG | target/.rustc_info.json) continue ;; esac
          nested=("$entry"/*/.fingerprint)
          [ -d "$entry/.fingerprint" ] || [ ${#nested[@]} -gt 0 ] || rm -rf "$entry"
        done
        aside=("$RUNNER_TEMP"/target-aside/*)
        [ ${#aside[@]} -eq 0 ] || mv "${aside[@]}" target/
        rmdir "$RUNNER_TEMP/target-aside"
